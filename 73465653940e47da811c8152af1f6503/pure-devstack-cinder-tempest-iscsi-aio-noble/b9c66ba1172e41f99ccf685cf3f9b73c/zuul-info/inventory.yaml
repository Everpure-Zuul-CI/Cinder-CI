        private_ipv6: null
        provider: cinderci
        public_ipv4: 192.168.1.106
        public_ipv6: ''
        region: cinderci
        slot: null
      pure:
        backend: fa
        chap_enabled: false
        multiattach: false
        multipath: true
        protocol: iscsi
        replication: false
        scale_test: false
        secondary_backend: none
        topology: aio
