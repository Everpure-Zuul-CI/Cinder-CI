      buildset: 43515ba240504e97a85e8599b6d592c8
      change: '1015288'
      change_message: "Scope attachments by their own volume's project\n\nChange Ib2044e4143b9
        turned on project_only for attachment reads, but\nthe filter model_query adds
        for VolumeAttachment compares\nVolume.project_id with no link to the attachment.
        The result is a cross\njoin that only asks whether the caller's project owns
        any volume, so a\nnon-admin whose project has a volume can show another project's\nattachment,
        including its connection info, given the attachment's UUID.\n\nFilter on the
        attachment's own volume instead. Update and delete were\nalready refused by
        policy for these callers, and now return 404 rather\nthan 403, the same as
        a caller whose project has no volume.\n\ntest_migrate_attachment_specs mocked
        models.Volume, which made the old\nfilter always true. It now creates a real
        volume.\n\nConflicts:\n\tcinder/db/api.py\n\tcinder/tests/unit/objects/test_volume_attachment.py\n\nNOTE:
        model_query is still in cinder/db/sqlalchemy/api.py on this\nbranch, so the
        change is applied there.\n\nCloses-Bug: #2173158\nRelated-Bug: #2138566\nSigned-off-by:
        Noppakorn Kaewsalabnil <noppakorn@nipa.cloud>\nChange-Id: I91c4a033e2b3b16d999faaf0dce96448531a2d03\n(cherry
        picked from commit 6c3354e665e7a34927954ba2d2135c5731a82f7d)\n(cherry picked
        from commit 21b607d9eaf84f543896af826d112a7cc123f084)\n(cherry picked from
        commit 0e5a1304b00370cf4e7537655474efa0d7122894)\n"
