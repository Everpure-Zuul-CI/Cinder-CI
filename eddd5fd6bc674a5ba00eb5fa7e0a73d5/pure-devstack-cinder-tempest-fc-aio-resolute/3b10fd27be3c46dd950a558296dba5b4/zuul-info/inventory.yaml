      change: '1009366'
      change_message: 'Everpure: bound the wait for a ghost pod to stretch


        Retyping a volume into or out of synchronous replication stretches a

        temporary ghost pod and then waits in _wait_for_stretch until every

        member array reports the pod online. The loop had neither a delay nor a

        limit: it re-read the pod as fast as the array answered, and if the

        peer never came online (replication link down, mediator unreachable,

        peer array offline) the retype never returned and the worker thread was

        lost for good.


        Poll at REPL_SETTINGS_PROPAGATE_RETRY_INTERVAL and give up with a

        PureDriverException after the same overall budget the other replication

        waits in the driver use, so the retype fails and the volume goes back to

        its previous state instead of hanging the volume service.


        Assisted-By: Claude Code claude-fable-5-1

        Change-Id: Ibfdb6c3430a505baac9a774d7850b8884ecc4ab2

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
