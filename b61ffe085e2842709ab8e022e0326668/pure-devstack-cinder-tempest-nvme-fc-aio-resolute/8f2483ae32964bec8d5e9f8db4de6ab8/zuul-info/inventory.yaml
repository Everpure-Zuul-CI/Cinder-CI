      branch: master
      build: 8f2483ae32964bec8d5e9f8db4de6ab8
      buildset: b61ffe085e2842709ab8e022e0326668
      change: '996145'
      change_message: 'RBD: Add group replication support


        RBD-backed groups whose group type sets

        consistent_group_replication_enabled cannot be failed over or

        failed back as a unit: enable_replication, disable_replication and

        failover_replication are not implemented, so the generic group

        manager rejects these actions with NotImplementedError and callers

        must fail over each volume individually.


        Implement the three group actions by driving RBD''s existing

        per-volume replication primitives (_enable_replication,

        _disable_replication, image-level mirror promote/demote) across

        every volume in the group. failover_replication reads the active

        backend recorded in the first volume''s replication_driver_data to

        determine which site currently holds the primaries, demotes that

        site''s images, and promotes the target site''s images for every

        volume in the group, mirroring the approach used for host-level

        failover. Advertise consistent_group_replication_enabled in the

        reported stats so the scheduler can select this backend for

        replicated group types.


        AI-modified files:

        - cinder/volume/drivers/rbd.py

        - cinder/tests/unit/volume/drivers/test_rbd.py

        - releasenotes/notes/rbd-group-replication-5e73ab623ba04428.yaml


        Partial-Implements: blueprint replication-v3

        Generated-By: Claude Code / claude-sonnet-4-5 (claude.ai/code)


        Change-Id: If3cc3574fee7bd0257dad01411d9cbc9afb996a3

        Signed-off-by: Rajat Dhasmana <rajatdhasmana@gmail.com>

        Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>

        '
