      branch: stable/2025.2
      build: ab2ff60e8f234db6aa12e31b9e94d3a2
      buildset: 55acfb03326e443e82d2dca56c32451e
      change: '999312'
      change_message: "[Pure Storage] Fix QoS for py-pure-client 1.86.0+\n\npy-pure-client
        1.86.0 (FlashArray REST API 2.52) changed the Patch\nmodels so that ``VolumePatch.qos``
        and ``VolumeGroupPatch.qos`` no longer\naccept a flat ``Qos`` object with
        integer ``iops_limit``/``bandwidth_limit``\nvalues. They now require a ``QosPatch``
        whose limits are wrapped in\n``QosIopsLimitPatch`` and ``QosBandwidthLimitPatch``
        objects.\n\nAs a result, any operation that set QoS through a volume *patch*
        -- most\nvisibly creating a volume from a snapshot, which always patches the
        new\nvolume's QoS -- failed with::\n\n    pydantic.v1.error_wrappers.ValidationError:
        2 validation errors for\n    VolumePatch\n    qos -> bandwidth_limit\n      value
        is not a valid dict (type=type_error.dict)\n    qos -> iops_limit\n      value
        is not a valid dict (type=type_error.dict)\n\nleaving the volume in ERROR
        state.\n\nBuild the QoS object for the ``*Patch`` requests with the new\n``QosPatch``/``QosIopsLimitPatch``/``QosBandwidthLimitPatch``
        models via a\nsmall helper. The ``*Post`` models (``VolumePost``/``VolumeGroupPost``)\nstill
        take a flat ``Qos`` with integer limits in all supported SDK\nreleases, so
        those call sites are unchanged.\n\nAdd a unit test that exercises ``set_qos``
        across the four IOPS/bandwidth\ncombinations and asserts the ``QosPatch``/``QosIopsLimitPatch``/\n``QosBandwidthLimitPatch``
        models are used (and the flat ``Qos`` is not),\nso a regression back to the
        flat ``Qos`` form is caught.  This test was\ncontributed by Jon Bernard as
        a follow-up change and squashed in here.\n\nChanges for stable/2025.2:\n\n*
        The minimum py-pure-client version is left at 1.47.0. The 1.89.0 floor\n  raised
        on master and stable/2026.1 is above this branch's\n  upper-constraint (1.73.0)
        and is not needed for the fix: the ``QosPatch``\n  models exist in every release
        from 1.86.0, and the driver never patched\n  QoS successfully on older releases
        anyway. The release note's upgrade\n  section and the pyproject.toml change
        are dropped accordingly (this\n  branch keeps its driver extras in setup.cfg).\n*
        py-pure-client 1.94.1 re-accepts the flat ``Qos`` form in ``*Patch``\n  models,
        but marks it deprecated. The ``QosPatch`` form works on every\n  release from
        1.86.0 onwards, including 1.94.1.\n* Subject and release note use the driver
        name used on this branch.\n\nCloses-Bug: #2158313\n\nAssisted-By: claude-code
        claude-opus-4-8\nCo-Authored-By: Jon Bernard <jobernar@redhat.com>\nChange-Id:
        Ife6a7f42778c065a70af4752e12661cec34bf7b2\nSigned-off-by: Simon Dodsley <simon@purestorage.com>\n(cherry
        picked from commit 635e41dfc66d7257192a9c693af201797e010d99)\n(cherry picked
        from commit c3d5787c2c621b20d6ffad7b205b66f041cd8664)\n"
