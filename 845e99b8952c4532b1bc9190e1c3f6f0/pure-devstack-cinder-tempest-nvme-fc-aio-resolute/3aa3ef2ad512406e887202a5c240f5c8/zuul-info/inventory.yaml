      build: 3aa3ef2ad512406e887202a5c240f5c8
      buildset: 845e99b8952c4532b1bc9190e1c3f6f0
      change: '986740'
      change_message: 'Add cinder-manage image-cache warm and list actions


        Add a new cinder-manage image-cache category so operators can inspect

        and pre-populate Cinder''s existing image-volume cache out of band.


        The warm action targets one pool, given as host@backend#pool or

        cluster@backend#pool, and waits for the result through a bounded RPC

        call to that service or cluster.


        An existing entry is reused according to the normal create-flow lookup

        rules. Otherwise, the backend validates the request and creates a

        transient internal-tenant volume through the existing create-from-image

        path, then attempts to delete it. After a successful create, it checks

        the cache again and reports failure if no entry is found or the

        transient volume remains.


        The command reports created or exists with exit 0, or failed with

        exit 1. Usage errors exit 2 without a result line.


        The warm RPC carries no token. Instead, cinder-volume obtains its own

        Glance tokens using the [glance] service credentials.


        The list action displays existing cache entries and resolves image

        names through Glance using the same [glance] service credentials in

        the cinder-manage process.


        glance now imports image_utils only for type checking, breaking the

        import cycle that the new cinder-manage import order exposed and that

        kept cinder-manage from starting on Python versions before 3.14.


        No driver API changes are introduced.

        Bump the volume RPC API version from 3.20 to 3.21.


        Implements: blueprint image-volume-cache-management

        Change-Id: I65a9afe78e544831602dc42abb844dc4121b0adb

        Signed-off-by: minwooseo <alsdn1211@naver.com>

        Assisted-By: Claude Code

        '
