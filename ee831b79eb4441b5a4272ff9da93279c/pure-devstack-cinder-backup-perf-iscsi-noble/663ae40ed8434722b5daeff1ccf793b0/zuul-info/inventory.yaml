      buildset: ee831b79eb4441b5a4272ff9da93279c
      change: '556'
      change_message: "Add a hand-triggered cinder-backup chunked-driver measurement
        job\n\nLaunchpad bug 1918119 (chunked backup drivers are slow for large volumes)\nhas
        had no fresh numbers since 2023, and those predate cinder-backup\nrunning
        on native threads.  This adds a job that produces them on our\nhardware so
        the fix can be argued from data.\n\npure-devstack-cinder-backup-perf-iscsi-noble
        stands up the same\nFlashArray iSCSI devstack as the tempest job, then instead
        of tempest\nruns playbooks/devstack/files/backup_perf.py.  The harness builds
        a\nsynthetic volume with a known mix of zero, compressible and random\nblocks,
        and backs it up once per compression algorithm (zlib, zstd,\nnone) with cinder-backup
        on native threads, against the lab\nFlashBlade's S3 service.  It splits every
        chunk into read+sha /\ncompress / upload+md5 from the driver's own debug lines,
        samples CPU\nwith vmstat, and publishes results.json, results.md and the raw\njournal
        excerpts under backup-perf/ in the job logs.\n\nThe job parents on plain \"devstack\"
        rather than on the tempest job,\nbecause devstack-tempest's post-run runs
        `stestr last` unguarded and\nfails when tempest never ran.  It is attached
        only to a new \"perf\"\npipeline that fires on the comment \"run backup perf\"
        on a change in\nthis repo, so an hour-long measurement never gates a config
        change.\n\nThe S3 target needs three things this change handles:\n\n* boto3,
        which cinder dropped from requirements.txt (902104) and\n  devstack does not
        yet install (1004804 is unmerged): the playbook\n  pips it into the devstack
        venv.\n* S3 credentials: the harness mints a throwaway object-store account,\n
        \ user, access key and bucket on the FlashBlade for the run and removes\n
        \ them afterwards, so no S3 keys live in this repo.  A post-run scrubs\n  the
        keys from cinder.conf in case the job is killed mid-harness.\n* The FlashBlade
        API token, delivered as the Zuul secret flashblade_api.\n  tools/encrypt-flashblade-secret.sh
        writes zuul.d/flashblade_secret.yaml\n  from the token already in roles/pure-manila-setup;
        the job's secrets\n  stanza is left commented until that file exists, because
        Zuul rejects\n  a job naming a secret it cannot find.\n\nAlso let the two
        GitHub log-publishing roles fall back to the Cinder-CI\ndeploy key for jobs
        anchored on this config repo (periodic, perf), which\nhave no key of their
        own; without this their logs were never published.\n\nCo-Authored-By: Claude
        Fable 5.1 <noreply@anthropic.com>\nChange-Id: I8a4490b63b10ba938143ac9051d453d5f7509c07\n"
