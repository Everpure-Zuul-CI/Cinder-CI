      change: '1009516'
      change_message: 'Everpure: consistency groups in pod pools


        A protection group only accepts members from its own pod, so a

        consistency group scheduled on a pod pool needs its protection group

        inside that pod: name it pod::consisgroup-<id>-cinder from the group''s

        host, the way the ActiveCluster pod already prefixes replicated groups.


        Cinder keeps a group and its members on one backend but not on one

        pool, so check that every member''s pod matches the group''s when the

        group is created and when members are added, and raise InvalidVolume

        instead of surfacing the array''s 400. A group whose member types are

        replicated is refused before the protection group is created, so a

        failing member create cannot leave an orphaned group behind.


        Partial-Implements: blueprint flasharray-pod-pools


        Assisted-By: Claude Code claude-fable-5-1

        Change-Id: I529fd82e020458de51f3d4242db32f2dca57e959

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

