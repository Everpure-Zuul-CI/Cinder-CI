      branch: master
      build: 83b835eae1114341a940bd55a54b44d3
      buildset: 974112810bc64632a94008a4807ca82f
      change: '988315'
      change_message: 'Implement per-pool image-volume cache promotion


        When a driver advertises clone_across_pools and the image-volume

        cache is enabled, Cinder can seed a local cache entry on the

        destination pool after a successful cross-pool clone. Later creates

        for the same image on that pool then use a same-pool clone instead

        of repeating the cross-pool copy.


        Promotion is opt-in via image_volume_cache_promote_across_pools

        (default False), so existing deployments are unchanged on upgrade.


        CreateVolumeFromSpecTask._clone_and_promote_locked serialises

        clone-then-promote (lock image-promote-{image_id}-{volume.host}).

        Waiters re-check ImageVolumeCache.get_entry(...,

        clone_across_pools=False) and reuse a local entry.

        _do_create_cache_entry clones the user volume into the cache and

        cleans up on failure. _create_from_cinder_store_image tries the

        cache first, then the locked clone/promote path.


        NetApp ONTAP REST clone verification uses the LUN create Location

        header (/storage/luns/<uuid>) via return_headers / return_location,

        then GET/PATCH that UUID (get_lun_by_uuid, do_direct_resize) so

        name-filtered collection search cannot miss a LUN that exists.


        Implements: blueprint per-pool-image-cache-promotion

        Change-Id: I4941197a2df741f80c317fb9e270f29f6fb085b2

        Signed-off-by: Jayaanan Borra <jayaanand.borra@netapp.com>

        '
