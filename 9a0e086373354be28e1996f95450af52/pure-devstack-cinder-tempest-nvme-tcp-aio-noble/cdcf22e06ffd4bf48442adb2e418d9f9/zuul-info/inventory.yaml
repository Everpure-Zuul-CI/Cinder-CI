      change: '999786'
      change_message: "NetApp: Fix crashes on missing LUN/NS metadata\n\nWhen the
        driver's local LUN or namespace cache has no entry for a\nvolume, the iSCSI/FC
        ``_get_lun_attr`` and NVMe\n``_get_namespace_attr`` helpers log the failure
        and return None\nrather than raising. Several callers then indexed the result\ndirectly
        (``metadata['Path']``), crashing with ``TypeError:\n'NoneType' object is not
        subscriptable`` instead of failing with a\nclear error or handling the missing
        entry gracefully.\n\nThis was originally seen in ``terminate_connection_iscsi``/\n``terminate_connection_fc``
        (block_base.py): when creating a\nbootable volume fails (e.g. a Glance image
        download error) before\nthe LUN is ever registered, Cinder's cleanup call
        to\nterminate_connection crashed instead of no-op'ing.\n\nThe same unguarded
        pattern also crashes ``initialize_connection`` on\nattach, seen via ``_map_lun``
        (block_base.py, shared by iSCSI and\nFC) when the LUN isn't in the local cache
        at connection time.\nChecking for the same pattern elsewhere found it again,
        unfixed, in\nthe NVMe driver (nvme_library.py): both ``_map_namespace``\n(initialize_connection)
        and ``terminate_connection`` have the\nidentical crash, since NVMe has its
        own implementation separate from\nblock_base.py and was missed by the original
        fix.\n\nGuard all four call sites against a missing metadata entry:\n- terminate_connection_iscsi/fc
        and NVMe's terminate_connection log a\n  warning and return early, since there
        is nothing to unmap if the\n  LUN/namespace was never mapped.\n- _map_lun
        and _map_namespace raise a clear\n  VolumeBackendAPIException instead of crashing,
        since connection\n  setup cannot proceed without the LUN/namespace's path.\n\nFixing
        _map_namespace also required renaming an unrelated throwaway\ntuple-unpack
        variable from `_` to `_unused` in the same function:\nPython's whole-function
        static scoping otherwise treats `_` as a\nlocal name because of that later
        assignment, shadowing the i18n\n`_()` used by the new error message and raising
        UnboundLocalError.\n\nAI-modified files:\n- cinder/volume/drivers/netapp/dataontap/block_base.py\n-
        cinder/volume/drivers/netapp/dataontap/nvme_library.py\n- cinder/tests/unit/volume/drivers/netapp/dataontap/test_block_base.py\n-
        cinder/tests/unit/volume/drivers/netapp/dataontap/test_nvme_library.py\n-
        releasenotes/notes/bug-2162883-netapp-terminate-conn.yaml\n\nCloses-Bug: #2162883\nGenerated-By:
        Claude Code / claude-opus-4-8 (claude.ai/code)\nChange-Id: Id24db8aa2975a205fcff70b358163e169525ab32\nSigned-off-by:
        rajathere <rajatdhasmana@gmail.com>\n"
