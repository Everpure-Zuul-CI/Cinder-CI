      branch: master
      build: 6690d12017b6427192365623bbe922f7
      buildset: c73a0e2205b4429c9b94cce8f628de48
      change: '1000373'
      change_message: "privsep/nvmet: support both Port.setup signatures\n\nnvmetcli
        removed the ``root`` parameter from ``Port.setup()`` in its\ncommit 3bb9795d
        (landed on master 2026-07-14):\n\n  - def setup(cls, root, n, err_func):\n
        \ + def setup(cls, n, err_func):\n\n  https://git.infradead.org/?p=users/hch/nvmetcli.git;a=commit;h=3bb9795d\n\nCinder's
        privsep wrapper still called ``nvmet.Port.setup(root, n,\nerr_func=...)``,
        so the port configuration dict was bound to the\n``err_func`` positional while
        ``err_func`` was also passed by keyword,\nraising ``TypeError: Port.setup()
        got multiple values for argument\n'err_func'``.  This made initialize_connection
        fail for every export on\nthe LVM nvmet target.\n\n``nvmet`` is not version-pinned
        in Cinder's requirements, so a\ndeployment may have either signature.  Detect
        the installed library's\n``Port.setup`` signature and forward ``root`` only
        when it is still\naccepted, keeping compatibility with both older and newer
        nvmetcli.\n\nCloses-Bug: #2163200\nChange-Id: Ib00d24fd6312680a931b0669cf7aeeef956e5293\nSigned-off-by:
        Simon Dodsley <simon@purestorage.com>\nCo-Authored-By: Claude Opus 4.8 (1M
        context) <noreply@anthropic.com>\n"
