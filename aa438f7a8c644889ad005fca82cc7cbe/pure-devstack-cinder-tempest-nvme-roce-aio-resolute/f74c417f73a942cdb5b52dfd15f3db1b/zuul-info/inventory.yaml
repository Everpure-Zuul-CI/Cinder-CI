      change: '1006837'
      change_message: "Add deployment-wide gigabytes helper and sentinel bootstrap\n\nThe
        deployment-wide aggregate quota counter needs two pieces of DB\nplumbing before
        it can be maintained:\n\n- _deployment_gigabytes_in_use computes what the
        counter's in_use should\n  hold.  It mirrors _sync_gigabytes across every
        project: volumes.size\n  plus, unless no_snapshot_gb_quota is set, snapshots.volume_size,
        over\n  undeleted rows with use_quota set.  It cannot reuse\n  _volume_data_get_for_project,
        which is hard-filtered by project_id,\n  and it must include snapshots because
        snapshot create and delete\n  reserve gigabytes deltas that will reach the
        counter; a volumes-only\n  figure would diverge from the maintained value
        immediately.  Honouring\n  use_quota keeps temporary and migration-destination
        volumes out, so a\n  migration campaign cannot inflate the counter and deny
        tenants.\n\n- _deployment_quota_usage_get and _deployment_quota_usage_create
        find or\n  create the sentinel quota_usages row.  The row is never seeded
        by a\n  schema or data migration; it is created on first use with in_use from\n
        \ the helper above, exactly as missing per-project rows are created\n  today.
        \ until_refresh stays NULL so the project-keyed refresh path can\n  never
        reach it, and race_preventer takes the model default so the\n  (project_id,
        resource, race_preventer) unique constraint applies.  A\n  concurrent first
        creator loses with DBDuplicateEntry, which the\n  wrap_db_retry decorator
        on quota_reserve already turns into a retry.\n\nNothing calls these yet.  The
        next change wires them into\nquota_reserve, and the repair subcommands reuse
        the same helper so that\nbootstrap and repair can never disagree about what
        the counter should\nhold.\n\nImplements: blueprint deployment-aggregate-quota\nAssisted-By:
        Claude Code claude-fable-5-1\nChange-Id: Id0b6b2fedcc88517c0e0900cba0b9319e3fdb230\nSigned-off-by:
        Simon Dodsley <simon@purestorage.com>\n"
