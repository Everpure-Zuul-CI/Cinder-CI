      build: fa4528f90b044ae490abccdb999229d1
      buildset: f00c5945c4c9450ab7aae5c1e5825fbe
      change: '986740'
      change_message: 'Add cinder-manage image-cache warm/list subcommand


        Add a new cinder-manage image-cache category with warm and list actions

        so operators can manage Cinder''s existing image-volume cache out of band.


        The warm action asks a target cinder-volume service to populate the

        image-volume cache for an image by using the existing create-from-image

        cache path with a transient internal volume. The transient volume is

        deleted after the cache entry has been seeded.


        The list action prints existing image_volume_cache_entries and resolves

        image names through Glance.


        This gives operators a backend-neutral way to pre-warm cache entries

        before user-facing creates hit a cache miss. One motivating case is

        backend-specific size drift on the first create from an image, but the

        command itself is not driver-specific and does not add any driver API.


        RPC API version bumped 3.20 -> 3.21.


        Related-Bug: #1915015

        Change-Id: I65a9afe78e544831602dc42abb844dc4121b0adb

        Signed-off-by: minwooseo <alsdn1211@naver.com>

        '
