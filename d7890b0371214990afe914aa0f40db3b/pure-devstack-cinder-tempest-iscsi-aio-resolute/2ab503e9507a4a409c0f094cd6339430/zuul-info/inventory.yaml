      branch: master
      build: 2ab503e9507a4a409c0f094cd6339430
      buildset: d7890b0371214990afe914aa0f40db3b
      change: '1012379'
      change_message: 'Add the pools table and Pool object


        A backend can report several storage pools, and there is no way to take a

        single pool out of service today: disabling the volume service or the

        cluster takes the whole backend out.  An operator who has to drain one

        pool - decommissioning a rack, moving one Ceph pool at a time - has no

        supported mechanism for it.


        Add a pools table holding the administrative state of a pool, keyed by

        the identity the scheduler already uses: backend_id, which is the service

        topic queue and therefore the cluster name when the services are

        clustered, plus the pool name.  Add a Pool object over it.


        The table is the source of truth.  Nothing is transported in

        capabilities and no driver persists the state, so it works for every

        driver without driver changes.


        The migration is d4b2c9e1f7a3, and the usual cinder-manage db

        sync creates the table on an existing deployment.

        Change-Id: I31c4f2afd48fdfa79575ba56f1887e3bb1129277

        Signed-off-by: Walter Boring <waboring@hemna.com>

        Assisted-By: OpenCode deepseek-v4.1-flash-1017

        '
