      change: '1014186'
      change_message: 'Add Everpure FlashBlade NFS volume driver


        The Everpure FlashBlade NFS driver stores every Cinder volume as one

        raw sparse file in its own FlashBlade file system, exported over NFS

        under a single per-backend export policy. The data path is plain NFS,

        so compute hosts mount the export exactly as they do for the generic

        NFS driver, while file system, export and snapshot management goes

        through the FlashBlade REST API (py-pure-client, REST 2.16 or later,

        Purity//FB 4.5.2 or later). This first version supports volume create

        and delete, snapshots of attached volumes, create from snapshot and

        clone (host copies read from the .snapshot tree), extend, revert to

        the most recent snapshot, image copy in both directions, multiattach

        and thin-provisioning statistics. QoS, replication, groups,

        manage/unmanage and encryption are left for later versions.


        File systems and snapshots follow the FlashArray driver''s naming. A

        volume''s file system is <volume name>-cinder (volume-<id>-cinder with

        the default volume_name_template); a volume name longer than 56

        characters is left-truncated first, keeping the template prefix and

        the tail of the name, so the whole name fits FlashBlade''s 63-character

        limit. The name is stored in volume.provider_id at create, clone and

        create-from-snapshot time and read back from there, so the file system

        id is no longer kept (nothing used it). A snapshot is

        <file system>.<snapshot name>, volume-<id>-cinder.snapshot-<id> by

        default; a snapshot_name_template containing "_" is rejected because

        FlashBlade snapshot suffixes allow no underscore. The stats filter is

        name=''<prefix>*-cinder''; the provisioned sum comes from the total_only

        aggregate (one FileSystem model in py-pure-client) and falls back to a

        filtered destroyed=False listing when the aggregate carries none.


        As the FlashArray driver does, each volume carries array_volume_name

        and array_name in its metadata and each snapshot array_snapshot_name

        and array_name, merged with any metadata the user set.

        update_migrated_volume returns only _name_id and provider_location:

        the manager copies the original''s values of every returned key onto

        the temporary record and swaps the fields back on completion, so a

        returned provider_id would land on the record that is deleted.


        Assisted-By: Claude Code claude-fable-5-1

        Change-Id: I4551c1a1235ead96f32321db995eab54a24e67e5

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
