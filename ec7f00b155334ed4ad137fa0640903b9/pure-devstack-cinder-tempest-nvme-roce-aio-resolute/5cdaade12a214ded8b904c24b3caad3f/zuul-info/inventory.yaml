      branch: master
      build: 5cdaade12a214ded8b904c24b3caad3f
      buildset: ec7f00b155334ed4ad137fa0640903b9
      change: '1010505'
      change_message: 'Add the os-list_changed_blocks volume action


        Expose the Changed Block Tracking (CBT) driver contract through the REST

        API so external backup tools can query changed blocks directly, without

        going through cinder-backup. Because get_cbt_extents() is side-effect-

        free and only diffs snapshots that already exist, the action can safely

        take two of a volume''s ordinary snapshots.


        The new ''os-list_changed_blocks'' volume action (microversion 3.72)

        returns the changed block extents between target_snapshot_id and an

        optional base_snapshot_id (omit the base for a full enumeration of the

        allocated blocks), with optional offset/length byte windowing and

        marker/limit pagination that is applied by the volume driver. Both

        snapshots must belong to the volume and be available, and the base must

        be the older of the two (a 400 otherwise). A window or marker that

        starts at or beyond the end of the target snapshot is answered as an

        empty page by the API layer without consulting the driver, so that case

        does not depend on the backend. Responses are always a bounded page:

        limit defaults to, and is capped at, the new changed_blocks_max_limit

        option (default 1000), and changed_blocks_next_marker tells the caller

        whether more remain. A new volume:list_changed_blocks policy guards the

        action; backends without CBT, or snapshots that cannot be compared,

        return 409.


        Includes unit tests for the action and the volume API layer, and a

        release note.


        Assisted-By: Claude (Opus 4.8)

        Change-Id: I89b5bf99ffb1ab8b1332c51f1fc2b766800d4424

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
