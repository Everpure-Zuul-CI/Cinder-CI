      build: 7d523d46ba0a4794bfbf4f1217470c0c
      buildset: 9b264c3a005f496db2843d9622c31500
      change: '1000307'
      change_message: "NetApp: FlexVol autosize, auto-provisioning and discover\n\nEnable
        ONTAP \"volume autosize\" management on Cinder-managed FlexVols\nand automatically
        provision a new FlexVol pool when an existing one\nruns out of headroom, so
        operators no longer have to manually grow\nor add ONTAP volumes as usage increases.\n\nnetapp_flexvol_autosize_mode
        (disabled/enabled) turns on ONTAP\ngrow-only autosize for every FlexVol backing
        a pool on the affected\nbackend, sized via netapp_flexvol_autosize_max_gb
        and\nnetapp_flexvol_autosize_grow_threshold_percent. It is applied from\nthe
        existing housekeeping periodic task, so it self-heals if the\nONTAP-side setting
        ever drifts.\n\nWhen netapp_autoprov_enabled is set and autosize is enabled,
        a new\nFlexVol is created automatically the moment an existing FlexVol\neither:\n\n
        * has grown to its autosize ceiling and is still above\n   netapp_autoprov_used_percent_ceiling,
        or\n * has reached netapp_autoprov_lun_count_ceiling LUNs (ONTAP\n   enforces
        a hard per-FlexVol LUN limit that free capacity alone\n   cannot work around).\n\nThe
        new FlexVol lands on the least-loaded aggregate below\nnetapp_autoprov_aggregate_used_percent_ceiling,
        is rate-limited by\nnetapp_autoprov_cooldown_seconds, capped by netapp_autoprov_max_pools,\nand
        is guarded by an Active/Active coordination lock so concurrent\ncinder-volume
        processes cannot double-create. A one-shot storage\nservice catalog (SSC)
        refresh makes the new pool visible on the next\nstats cycle instead of waiting
        for the hourly SSC refresh.\n\nAlso wire up real on-demand discovery: the
        capabilities API's\n`discover` query parameter was hardcoded to False, so\n`GET
        /capabilities/<host>?discover=true` never actually rescanned\nstorage. It
        now reaches the driver, and the NetApp iSCSI/FC drivers\nuse it to force a
        full FlexVol rescan and immediately publish the\nresult to the scheduler,
        so a FlexVol created by any means (manual\nONTAP CLI, another tool, etc.)
        becomes schedulable without\nrestarting cinder-volume.\n\nFixes two bugs found
        while live-testing against a real ONTAP\ncluster: ZAPI's volume-autosize-get
        returns maximum-size in KB, not\nbytes like every other ZAPI size field; and
        the autosize ceiling\nmust be compared against a FlexVol's nominal size, not
        its\nsnapshot-reserve-adjusted size-total, or the \"grown to ceiling\"\ncheck
        could never become true.\n\nLive-verified end to end against a real ONTAP
        cluster and devstack:\nautosize configuration, LUN-count- and capacity-based\nauto-provisioning
        triggers, and discover=true finding a FlexVol\ncreated entirely outside Cinder
        and making it immediately\nschedulable, with no regressions in the existing
        test suite.\n\nChange-Id: Ibea84d146ef2ce0669b3792e48c9c731eadbe009\nSigned-off-by:
        Jayaanand Borra <jayaanand.borra@netapp.com>\n"
