      build: 11f09d0be06c404fb3cf8a5363b8538c
      buildset: cacee3a8239f4038856b748484ed6f4d
      change: '1014361'
      change_message: 'Fixes Pure driver setting max_oversubscription_ratio<1


        When pure_automatic_max_oversubscription_ratio=true, the Pure

        Storage driver may report a max_over_subscription_ratio <1.0

        which is then rejected by Cinder''s CapacityFilter, effectively

        filtering out the backend and potentially preventing volume

        creation (regardless of the available capacity).


        This patch addresses this and also updates the tests to account

        for max_over_subscription_ratio use cases.


        Closes-Bug: #2173149

        Change-Id: Ib87c6c3a04d7da3ecb6215c817686ef4dcd5b3e9

        Signed-off-by: Alejandro Santoyo <alejandro.santoyo@canonical.com>

        '
