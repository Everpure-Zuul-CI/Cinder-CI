      branch: master
      build: a77eba4a3cae4ced809f82b695acf568
      buildset: e0f6d238f84c4abba1b64d52e1faa6ff
      change: '1003076'
      change_message: 'NetApp: Omit vserver args for same-SVM LUN copy


        The clone_across_pools cross-aggregate clone path calls the ONTAP

        lun-copy-start ZAPI to copy a LUN between FlexVols. This copy always

        happens within a single vserver: cross-SVM boundaries are detected

        earlier and fall back to image download instead of reaching this

        call. ONTAP rejects source-vserver/destination-vserver as invalid

        extra input when both LUNs are already in the same vserver, so the

        cross-pool clone failed.


        Add a same_vserver parameter to the ZAPI client''s start_lun_copy,

        defaulting to False so existing callers are unaffected, and omit the

        vserver fields from the request only when set. The cross-pool clone

        call site now passes same_vserver=True, since it can only ever copy

        within one vserver.


        The cross-vserver volume migration path (_copy_lun, used by

        _migrate_volume_to_vserver) genuinely copies between two different

        vservers, so it keeps the default and continues to send both vserver

        fields. The REST client''s start_lun_copy has no equivalent parameter

        pair to fix: it only sends the destination svm.name.


        Add direct unit test coverage for start_lun_copy itself, asserting

        the vserver fields are omitted when same_vserver is set, since the

        existing tests only verified the caller''s arguments and never

        exercised this branch.


        Assisted-By: Claude Code / claude-opus-4-8 (claude.ai/code)

        AI-modified files:

        - cinder/tests/unit/volume/drivers/netapp/dataontap/client/test_client_cmode.py


        Change-Id: I1bc7adf918f89b2120d8943e5ec4d46d3749d39c

        Signed-off-by: Rajat Dhasmana <rajatdhasmana@gmail.com>

        '
