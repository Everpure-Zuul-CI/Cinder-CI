      build: bba45784c77a438ba8b4ee5081167fca
      buildset: 6c81839eb1ef4b12854cc8e7afa63df1
      change: '1005609'
      change_message: 'Huawei: Synchronize HyperMetro clones before returning


        Snapshot-based volume creation populates the local LUN before creating

        its HyperMetro pair. Volume cloning uses the same path. The remote LUN

        is newly allocated, so disabling initial synchronization leaves it

        without the cloned contents.


        Enable initial synchronization for clones, explicitly start it and wait

        for the pair to become healthy and normal using the configured LUN

        timeout. Preserve the existing behavior for empty volumes.


        On synchronization failure, remove the pair before deleting the

        destination LUNs. Stop cleanup if pair removal fails so neither LUN is

        deleted while the pair remains. Reuse the existing pair deletion path.


        Cover copy ordering, empty volumes, both clone mechanisms,

        synchronization state transitions, timeouts, API failures and cleanup

        failures with unit tests. Hardware validation remains outstanding.


        Closes-Bug: #2167242

        Assisted-By: Codex (gpt-6-astra)

        Change-Id: I0259a76c50adcbbc5fb5fb4fa75c5839141b04e5

        Signed-off-by: Guillaume Boutry <guillaume.boutry@canonical.com>

        '
