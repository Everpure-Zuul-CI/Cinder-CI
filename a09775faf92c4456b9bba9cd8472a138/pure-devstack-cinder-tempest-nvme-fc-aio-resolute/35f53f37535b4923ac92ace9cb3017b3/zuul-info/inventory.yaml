      build: 35f53f37535b4923ac92ace9cb3017b3
      buildset: a09775faf92c4456b9bba9cd8472a138
      change: '999400'
      change_message: 'NetApp ONTAP: apply space allocation to cloned LUNs


        Creating a volume from a snapshot or cloning a volume did not apply the

        netapp:space_allocation extra spec, nor the ONTAP version based default,

        to the new LUN: _clone_source_to_destination() never determined the

        setting and did not pass it to _clone_lun().  ONTAP does not propagate

        the source LUN''s setting to a clone, so on ONTAP 9.15.1 and later, where

        space-allocation is enabled by default, a cloned volume ended up enabled

        even when its volume type requested ''<is> False''.  Verified on ONTAP

        9.16.1P10.


        The clone paths now determine the setting the same way create_volume()

        does and apply it to the new LUN.  ZAPI clone-create cannot set it, so

        the cloned LUN is updated afterwards through a new

        ensure_lun_space_allocation() client method, cycling the LUN

        offline/online as older releases require; it is not mapped to an

        initiator yet, so this is safe.  REST passes it in the clone creation

        request and verifies it afterwards with the same method, which changes

        it in place without an offline cycle.  The REST private CLI clone

        fallback, used when snapshot directory access is disabled, cannot set

        it either and applies it the same way afterwards.  Cross-pool clones

        and migrations to another vserver use the same method once the lun-copy

        completes, and revert to snapshot passes the setting to its snapshot

        clone.  If applying the setting fails, the new LUN is destroyed: it is

        not in the driver LUN table yet, so Cinder could never reclaim it, and a

        leftover LUN would fail a retry on the duplicate name.


        Closes-Bug: #2162548

        Related-Bug: #2152031

        Assisted-By: Claude Code claude-opus-5

        Signed-off-by: hongp <inyong.hong@samsung.com>

        Change-Id: Idd175236e0f0a4bbb7e4e0f12f079c6e92acc172

        '
