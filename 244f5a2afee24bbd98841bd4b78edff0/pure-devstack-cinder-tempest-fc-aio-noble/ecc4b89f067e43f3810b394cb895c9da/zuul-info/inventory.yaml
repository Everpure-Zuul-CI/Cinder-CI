      buildset: 244f5a2afee24bbd98841bd4b78edff0
      change: '996727'
      change_message: 'image: support in-place qemu-img convert


        Add a skip_create flag to convert_image()/_convert_image()/

        _get_qemu_convert_cmd() that maps to ''qemu-img convert -n''. With -n,

        qemu-img skips creation of the target image and writes into the

        existing destination, preserving its container structure (for example

        a qcow2 file''s backing chain, or a block device) while every

        virtual-disk block is rewritten from the source.


        This is needed by the generic volume migration data copy, which must

        rewrite the contents of an existing destination image without

        re-creating it: re-creating the destination would discard its

        container structure and, for qcow2, its backing-file linkage.


        In-place conversion is refused for encrypted images and output

        subformats because qemu-img only honors image creation options when

        it creates the target image itself.


        Related-Bug: #2160206

        Assisted-By: Github Copilot

        Change-Id: I97e38c961ceb0a20a090df84656b3d222370c9db

        Signed-off-by: Masayoshi Mizuma <m.mizuma@fujitsu.com>

        '
