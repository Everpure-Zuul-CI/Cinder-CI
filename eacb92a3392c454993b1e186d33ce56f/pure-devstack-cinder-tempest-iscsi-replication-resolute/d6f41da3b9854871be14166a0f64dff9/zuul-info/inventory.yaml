      buildset: eacb92a3392c454993b1e186d33ce56f
      change: '1009291'
      change_message: '[Everpure] Separate volume group and volume QoS


        The array does not allow per-volume QoS limits on a member of a volume

        group that has QoS, nor moving a volume with limits into such a group,

        and every volume group the driver creates has QoS. Only create_volume

        and create_volume_from_snapshot respected this; cloning, extending,

        retyping and managing a volume applied or kept per-volume limits, and

        none of them checked the array''s refusal. Resetting limits to their

        maximum values made it worse, as the array stores the maximum as an

        explicit limit; a limit is only removed by sending an empty string.


        Clones now land in the volume group of their type, group members get

        no per-volume QoS on extend or import, a volume''s limits are cleared

        before it is moved into a group and the QoS spec of the new type is

        applied after it leaves one, a refused move fails the retype or import

        instead of recording a path that does not exist, manage_existing

        records the volume group path as provider_id, limits are cleared

        rather than pinned at the maximum, set_qos reports failures, and

        extend_volume sizes per-GB limits in GB. Verified against a FlashArray

        at REST 2.46 and 2.54.


        Closes-Bug: #2169868

        Assisted-By: Claude Code claude-fable-5-1

        Change-Id: Idaad55f033e08933ab5cb5421171933c91e3153e

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
