      change: '1012441'
      change_message: "RBD: deferred deletion for eligible volumes\n\nThe RBD driver
        can remove a volume directly even when deferred\ndeletion is enabled. A successful
        direct removal bypasses the\nconfigured delay, leaving no backend retention
        window. This is\nrelated to the behavior reported in bug #2126853.\n\nThe
        main purpose of this proposal is backend soft deletion: retain\neligible deleted
        volumes in RBD trash before permanent removal.\nThis gives operators a configurable
        window to investigate accidental\ndeletions and attempt backend recovery.\n\nThe
        proposed changes cover three related areas:\n\n1. Honor the configured retention
        delay.\n\n   When enable_deferred_deletion is enabled, move quota-accounted\n
        \  volumes in deleting status that reach the normal deletion path\n   to trash
        using deferred_deletion_delay.\n\n   Preserve the existing .deleted handling
        for volumes with dependent\n   Cinder clones. Keep requests outside the eligibility
        checks on\n   their existing deletion paths.\n\n2. Keep periodic trash cleanup
        running after failures.\n\n   Start the purge loop with stop_on_exception=False
        so an unexpected\n   connection or trash-listing failure does not permanently
        stop\n   subsequent scheduled cleanup attempts.\n\n3. Handle unexpired trash
        entries correctly.\n\n   Catch rbd.PermissionError alongside OSError and retain
        the EPERM\n   check. An unexpired entry is an expected condition; other failures\n
        \  must remain visible in the logs.\n\nReuse the existing deferred deletion
        configuration and preserve its\ndisabled-by-default behavior.\n\nThis proposal
        provides retention of backend data. It does not add a\nCinder undelete API
        or preserve the active Cinder volume resource.\nQuota can be released while
        retained data still occupies Ceph space.\nRecovery of encrypted volumes is
        not guaranteed by retaining their\nRBD images alone.\n\nClone dependency handling,
        retry behavior and regression coverage\nare being completed before this change
        is marked ready for review.\n\nRelated-Bug: #2126853\nAssisted-By: GPT\nChange-Id:
        I04eba40ebbce0e06fe4f78914dc4988c86aa6601\nSigned-off-by: Amir Modarresi <seyedamirmodaresi@gmail.com>\n"
      change_url: https://review.opendev.org/c/openstack/cinder/+/1012441
