      build: 588d9b541b334bff829be3c39b067326
      buildset: 4a711c3304b24c4eb7a07df5bf34b4e5
      change: '1007031'
      change_message: 'Everpure: replicate CGs created from a source


        create_group_from_src() passed the boolean True as the replication type

        of a replicated consistency group instead of the group''s actual

        replication type. create_consistencygroup() only configures a schedule

        and replication targets for the "async" and "trisync" types, so a

        replicated group cloned from a group or a group snapshot was given a

        protection group that never replicated anything.


        Resolve the replication type from the group''s volume types, exactly as

        create_group() does, by moving that logic into a shared helper. The

        helper raises PureDriverException for a group whose volume types do not

        match its group type. create_group() previously returned an error

        status for two of those cases; the volume manager puts the group into

        error either way, and raising is what create_group_from_src() needs so

        that the volumes being created for the new group are errored too.


        Assisted-By: Claude Code claude-fable-5-1

        Change-Id: I2faf446dd8c70dc363b70bf1835d015f25abb024

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
