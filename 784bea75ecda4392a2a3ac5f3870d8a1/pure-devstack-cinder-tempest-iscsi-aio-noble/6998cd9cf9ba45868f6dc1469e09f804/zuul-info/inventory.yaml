      branch: master
      build: 6998cd9cf9ba45868f6dc1469e09f804
      buildset: 784bea75ecda4392a2a3ac5f3870d8a1
      change: '998955'
      change_message: 'NetApp ONTAP: make SSC refresh interval configurable


        The NetApp cDOT block driver refreshes its Storage Service Catalog

        (SSC) -- the discovered set of backend pools/FlexVols and their

        capabilities -- purely on a hardcoded one-hour loopingcall, with no

        config option and no on-demand trigger. A newly provisioned FlexVol is

        therefore invisible to the Cinder scheduler for up to an hour after

        it''s ready to serve volumes, and the only workaround available to

        callers is externally polling the scheduler-stats endpoint.


        Add a new configuration option, netapp_ssc_polling_interval, that

        controls the SSC refresh interval in seconds. The default remains 3600

        (one hour) for backward compatibility; operators or automation that

        need faster pool discovery can lower it (minimum 60 seconds).


        Closes-Bug: #2161973

        Change-Id: I2be3260c61047b33fef49df12adc2f07340a3099

        Signed-off-by: Akash Roshan Chaurasia <akashroshanchaurasia@gmail.com>

        '
