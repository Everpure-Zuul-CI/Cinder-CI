      branch: master
      build: a2ed7920ac2248b2ac648a624e87feff
      buildset: 5bf264be3c204c5dab11a342d7990651
      change: '988315'
      change_message: 'Implement per-pool image-volume cache promotion


        When a driver advertises clone_across_pools and the image-volume

        cache is enabled, Cinder can seed a local cache entry on the

        destination pool after a successful cross-pool clone. Later creates

        for the same image on that pool then use a same-pool clone instead

        of repeating the cross-pool copy.


        Promotion is opt-in via image_volume_cache_promote_across_pools

        (default False). Local cache rows are not seeded from a remote

        cache volume unless that option is enabled.


        Cache-entry preparation uses the lock

        image-promote-{image_id}-{volume.host} instead of the previous

        service-wide {image_id} lock. That lock-name change applies even

        when the option is left at False.


        When the option is False, the first lookup still uses

        clone_across_pools so a remote hit returns ASAP and the clone runs

        outside the lock. When it is True, that lookup is host-local so a

        remote row can be cloned, the volume DB row is saved, then a local

        cache entry is seeded. A failed promote clone does not look up the

        cache a second time. Glance cinder-store image clone is unchanged.


        Implements: blueprint per-pool-image-cache-promotion

        Change-Id: I4941197a2df741f80c317fb9e270f29f6fb085b2

        Signed-off-by: Jayaanan Borra <jayaanand.borra@netapp.com>

        '
