      change_message: 'RBD: Flatten replicated image clones


        RBD clones of raw Glance images retain the Glance image as a

        parent. Enabling mirroring on a replicated volume fails when that

        parent is not mirrored.


        Flatten replicated image clones before setting up the volume. If

        flattening fails, remove the partial clone and let Cinder fall back

        to the generic image-copy workflow. Preserve setup exceptions so

        failures from QoS, replication, or multiattach configuration are not

        misreported.


        AI-modified files:

        - cinder/volume/drivers/rbd.py

