      change: '1003765'
      change_message: "NetApp ONTAP: validate replication configuration at init\n\nThe
        driver reported replication_status=enabled for backend\nconfigurations that
        cannot support replication, deferring the failure\nto the first SnapMirror
        operation where it surfaced as an opaque\nONTAP error.\n\nValidate the configuration
        during check_for_setup_error() and fail\nfast with a descriptive message when
        a replication_device is\nconfigured together with any of:\n\n* netapp_disaggregated_platform=True
        (ASA r2), which has no\n  per-FlexVol pool model for SnapMirror to provision
        against\n* a netapp_replication_policy outside the ONTAP-recognized set\n*
        AutomatedFailOverDuplex without netapp_consistent_replication=True\n* netapp_consistent_replication=True
        on a pool containing FlexGroup\n  volumes, which cannot be SnapMirror Consistency
        Group members\n* an ONTAP cluster older than 9.16.1\n\nCloses-Bug: #2166341\nCloses-Bug:
        #2166342\nCloses-Bug: #2166343\nCloses-Bug: #2166345\nAssisted-By: Cursor\nChange-Id:
        Iba119184cc5ff0ea25360f87e5ec9430d83b53fd\nSigned-off-by: Mada, Sailaja <sailajam@netapp.com>\n"
