      change: '1014444'
      change_message: 'Block on invalid protocol or replication settings


        An unsupported protocol value made the charm send volume_driver = None

        to cinder, enabling use-replication without all three replication

        target settings crashed the hook, and replication-type was compared

        verbatim so "Sync" or a YAML block scalar silently fell back to async.

        Validate these in custom_assess_status_check so the unit goes blocked

        with a clear message, leave the replication options out until the

        target settings are complete, and normalise replication-type before

        comparing it. While the unit is blocked the backend configuration is

        held back from the cinder principal, so a bad edit cannot downgrade a

        working backend.


        Assisted-By: Claude Code claude-fable-5-1

        Change-Id: I93755c6493dcb388a40ada76e30818880c68c5dc

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
