      change: '995924'
      change_message: "RBD: Preserve snapshots during volume reimage\n\nVolume snapshots
        were silently deleted during server rebuild with\n--reimage-boot-volume for
        bfv-servers, because copy_image_to_volume()\nunconditionally called delete_volume(),
        which destroys all snapshots at\nbackend.\n\nThe fix passes an explicit reimage=True
        from vol manager to the rbd\ndriver to distinguish between vol create or reimage.\n-
        vol creation: delete vol, rbd import to recreate vol\n- vol reimage: qemu-img
        convert -n, to overwrite existing volume (and\n  preserve snapshots).\n\nAll
        driver copy_image_to_volume signatures accept **kwargs so the\nreimage param
        passes through without affecting non-rbd drivers.\n\ncmd used to recreate
        in devstack logs:\n qemu-img convert -O raw -n -S 0 -f raw\n  /opt/stack/data/cinder/conversion/tmpxy73f2g5
        \\\n  rbd:volumes/volume-5bf6b76a-...:conf=/etc/ceph/ceph.conf:id=cinder\n\nCloses-Bug:
        #2160473\n\nChange-Id: Ib0a39ffedd0869c49a47db0afd85fb50725b4381\nSigned-off-by:
        Amit Uniyal <auniyal@redhat.com>\n"
