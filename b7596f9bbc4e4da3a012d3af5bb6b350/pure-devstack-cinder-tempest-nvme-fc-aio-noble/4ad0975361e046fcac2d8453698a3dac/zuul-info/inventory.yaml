      change: '1002961'
      change_message: 'RBD: add Changed Block Tracking backup support


        Implement the CBT incremental backup driver methods

        (create_cbt_snapshot, get_cbt_extents, delete_cbt_snapshot) for the

        Ceph RBD driver using librbd''s diff_iterate(). Incremental backups

        taken with the chunked backup drivers then ship only the changed

        blocks, and the first (full) backup is made sparse, instead of

        scanning and SHA256-hashing the whole volume.


        get_cbt_extents() opens the image as of to_snapshot and diffs against

        from_snapshot, so it creates nothing. It pushes the requested

        offset/length window into diff_iterate() to avoid scanning the whole

        volume, consolidates adjacent extents, and returns the page through

        volume_utils.window_cbt_page rather than truncating its own result.

        from_snapshot=None passes straight through, giving the allocation map

        the framework asks for on a full backup.


        Only regions to ship are reported, always exists=True. An incremental

        diff includes regions librbd reports with exists=0: those are guest

        fstrim/discards, changes to zero, and dropping them would leave the

        parent''s stale data in place on restore. In the allocation map the

        same flag marks a never-written hole, omitted so the backup stays

        sparse.


        Snapshot identifiers are RBD snap names, so both callers agree:

        create_cbt_snapshot() returns the name, and an ordinary snapshot now

        exposes its own via provider_id, letting os-list_changed_blocks diff

        two ordinary snapshots. Any failure returns None rather than raising,

        so the backup falls back to the existing full-scan path.


        Assisted-By: Claude Opus 5

        Depends-On: https://review.opendev.org/c/openstack/cinder/+/990923

        Signed-off-by: hongp <inyong.hong@samsung.com>

        Change-Id: I3fb5b39dfa6713203804728442380ac9fb93963e


        '
