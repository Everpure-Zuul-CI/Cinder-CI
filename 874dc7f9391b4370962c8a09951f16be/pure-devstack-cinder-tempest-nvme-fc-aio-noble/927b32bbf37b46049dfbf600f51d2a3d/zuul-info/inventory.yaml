      change: '998393'
      change_message: 'WIP: remotefs: adopt migrated snapshots by re-keying snapshot
        info


        Implement update_migrated_snapshot() for the remotefs snapshot

        drivers. During a snapshot-aware migration the destination snapshot is

        first created under a temporary staging snapshot id, so its chain file

        and its entry in the volume''s snapshot info file are keyed by that

        staging id. The preserved (original) snapshot record must be able to

        address the artifact after completion.


        remotefs backends resolve every snapshot operation through the info

        file (snapshot id -> chain file name), so adopting the artifact only

        requires re-keying its info entry to the original snapshot id. The

        chain file itself is not renamed: file names embed the creation-time

        id purely as a naming convention, and a rename would additionally

        require rebasing every child delta on a remote filesystem, a

        multi-step non-atomic operation.


        A replay that finds the entry already re-keyed is a no-op so that

        crash recovery can safely retry the finalize phase. If neither id

        resolves, VolumeMigrationFailed is raised so the migration rolls back

        instead of committing a snapshot that cannot be addressed afterwards.


        The hook lives on RemoteFSSnapDriverBase so any remotefs-family driver

        can opt into snapshot-aware migration by just advertising the

        capability.


        Assisted-By: Github Copilot

        Implements: blueprint retype-volume-including-snapshots

        Depends-On: I93282cbf99194c8c6591c7c24a29804f7cce301a

        Depends-On: Ief4f84d364417b9221a77b2eae4fa9ade80009ea

        Change-Id: I7bd6397d4d0da910ddc24078e322faf705ae8eda

        Signed-off-by: Fuli Qi <qi.fuli@fujitsu.com>

        '
