      change: '994912'
      change_message: 'WIP: volume: orchestrate generic snapshot retype


        Add the multi-snapshot loop for generic snapshot-aware retype. The

        manager rebuilds snapshots in oldest-first order before copying current

        volume data into the migration target.


        Carry migrated snapshot metadata through the generic migration path.

        Before the volume records are swapped, completion adopts the rebuilt

        destination snapshots under the original snapshot ids and repoints the

        preserved snapshot records. The source snapshot artifacts are deleted

        only after the base volume provider update and the database cutover

        have succeeded. If update_migrated_volume fails, the preserved records

        are restored to the source artifacts and the adopted destination

        artifacts are deleted.


        On failures before completion, delete any staging destination

        snapshots that were already rebuilt and wait for their deletion before

        the existing temporary volume cleanup path. If snapshot finalization

        fails during completion, restore provider metadata for snapshots that

        were already updated.


        Register a worker for the retyping volume so that a migration

        interrupted by a cinder-volume restart is rolled back through

        do_cleanup: staged destination snapshots, the destination temporary

        volume and the per-snapshot temporary source volumes are removed, each

        step best-effort, and the volume is marked as a failed migration.

        Temporary source volumes are identified by a private admin metadata

        marker, not only by their display name.


        Log the snapshot migration phase, snapshot id, snapshot index, and

        volume id when rebuilding an individual snapshot fails.


        Document the API microversion, the admin and contributor workflow, and

        add a release note.


        Assisted-By: Github Copilot

        Implements: blueprint retype-volume-including-snapshots

        Change-Id: I274a0df3314f2f814af9122a560ebbf7764949e3

        Signed-off-by: Fuli Qi <qi.fuli@fujitsu.com>

        '
