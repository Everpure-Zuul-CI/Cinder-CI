      change: '994908'
      change_message: 'volume: add migrated snapshot update plumbing


        Add volume RPC, manager, and driver plumbing for finalizing migrated

        snapshot backend metadata. The manager delegates to the destination

        backend driver and falls back to the destination snapshot provider

        fields when the driver hook is not implemented.


        Add delete_migrated_source_snapshot RPC plumbing for source backend

        cleanup after migrated snapshot provider metadata has been updated.

        This deletes only the source backend object and keeps the preserved

        snapshot database row and ID intact.


        Both finalization calls require volume RPC API 3.21. Guard the client

        methods with the minimum RPC version so mixed-version deployments fail

        explicitly instead of sending unsupported calls.


        The new path only swaps existing snapshot provider metadata and cleans

        up migrated source backend objects. It does not introduce snapshot

        migration status or schema changes.


        Assisted-By: Github Copilot

        Implements: blueprint retype-volume-including-snapshots

        Change-Id: Ie7b36e06abf5a33c9a60a45aa28efbd24a2b9c5f

        Signed-off-by: Fuli Qi <qi.fuli@fujitsu.com>

