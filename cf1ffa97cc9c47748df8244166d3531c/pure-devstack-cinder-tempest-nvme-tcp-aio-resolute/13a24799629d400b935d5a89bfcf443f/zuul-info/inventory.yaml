      build: 13a24799629d400b935d5a89bfcf443f
      buildset: cf1ffa97cc9c47748df8244166d3531c
      change: '1013404'
      change_message: 'WIP NetApp: retype backend QoS in place


        A same-pool retype that only changes QoS still falls through to a

        generic volume copy. ONTAP can update the policy on the existing LUN

        or file, so the driver should do that when migration-policy is never.


        Apply back-end and "both" qos-specs, and netapp:qos_policy_group, on

        the current object. Fixed and Adaptive policies cannot be converted

        in place, so the driver retires the old openstack-<uuid> policy and

        creates the other kind. Unified NVMe namespaces have no QoS

        attribute; each Cinder NVMe volume gets a dedicated FlexVol and QoS

        is set there. ASA r2 NVMe backend QoS stays unsupported. Front-end

        specs are left to Nova.


        Change-Id: I09ca75b6ba787f89a974f2e785df09c629c1e1d5

        Signed-off-by: Jayaanand Borra <jayaanand.borra@netapp.com>

        '
