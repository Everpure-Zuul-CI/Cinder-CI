      change: '1014443'
      change_message: 'Fix replication and NVMe backend config generation


        With replication-type sync the replication_device value carried a

        second type:sync (and uniform:true) entry, which oslo.config rejects as

        a duplicate key, so cinder-volume failed to start. Setting nvme-cidr

        raised AttributeError because extend() was called on the protocol

        string instead of the option list, and replica-retention-short was

        read under the wrong key and never applied. Whitespace around the

        replication target settings, such as the trailing newline a YAML block

        scalar adds, was copied into replication_device and split the line.

        Remove the duplicated block, append pure_nvme_cidr to the option list,

        read the correct key and strip the replication target values.

        pure_nvme_cidr applies to both NVMe transports, so say so in the

        option description.


        Closes-Bug: #2008006

        Assisted-By: Claude Code claude-fable-5-1

        Change-Id: I2b51a6a2ede4e370e7ae10f38706883264aa17a8

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
      change_url: https://review.opendev.org/c/openstack/charm-cinder-purestorage/+/1014443
