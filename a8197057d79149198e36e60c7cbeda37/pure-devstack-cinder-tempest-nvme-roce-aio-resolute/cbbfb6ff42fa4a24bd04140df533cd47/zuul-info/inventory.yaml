      branch: master
      build: cbbfb6ff42fa4a24bd04140df533cd47
      buildset: a8197057d79149198e36e60c7cbeda37
      change: '1010230'
      change_message: 'Grow destination when retyping to encrypted type


        When an unencrypted volume is retyped or migrated with the generic

        migration to a volume type with encryption, the destination volume is

        created with the same size as the source volume. The encryption header

        then takes part of that space and copying the full source volume fails

        with "No space left on device".


        Create the destination volume 1 GB larger in this case only and reserve the

        additional gigabyte in the project quota. The reservation is committed

        when the migration completes and rolled back when it fails. Because the

        source and destination volume records are swapped at the end of the

        migration, the volume reports the new size afterwards.


        Attached volumes are not changed, as their data is copied by Nova.


        Closes-Bug: #1925818

        Change-Id: I7c8c118418782dc9d80cbd4dada47dc364440bde

        Signed-off-by: Jan Wasilewski <jan.wasilewski@atman.pl>

        '
