      build: 085099febb914b5991155a0d9f348b68
      buildset: 0f568e35679e483fa1c64eeb08c5613f
      change: '990923'
      change_message: 'Add changed-block tracking contract and os-list_changed_blocks
        API


        Add the volume-side foundation for Changed Block Tracking (CBT): a driver

        contract for reporting changed blocks, and a REST API that exposes it.

        The cinder-backup service that consumes this to ship incremental backups

        of only the changed blocks is added by a follow-on change.


        Volume drivers opt in by overriding the new BaseVD.get_cbt_extents()

        (plus create_cbt_snapshot()/delete_cbt_snapshot() for reference-point

        management); the default implementations report no support, so existing

        drivers are unaffected. Support is advertised over a new cinder-volume

        RPC API version 3.21 (supports_cbt/get_cbt_extents/create_cbt_snapshot/

        delete_cbt_snapshot).


        get_cbt_extents() is side-effect-free: it diffs two snapshots that

        already exist, while snapshot creation/deletion is done explicitly via

        create_cbt_snapshot()/delete_cbt_snapshot(). A from_snapshot of None asks

        the driver for the volume''s allocation map (its written blocks) so a

        caller can enumerate a full, sparse block list; backends that cannot

        answer return None.


        Because get_cbt_extents() is side-effect-free, the capability is exposed

        directly to external backup tools via a new ''os-list_changed_blocks''

        volume action (REST API microversion 3.72). It returns the changed block

        extents between two of a volume''s existing snapshots (omit the base

        snapshot for a full enumeration), with optional byte-window and

        marker/limit pagination applied by the volume driver, and a new

        volume:list_changed_blocks policy. Backends without CBT return a 409.


        Includes unit tests for the volume manager, RPC API and the changed-blocks

        API, a contributor guide for vendor drivers, and a release note.


        Assisted-By: Claude (Opus 4.8)

        Change-Id: Ib8e4ca1f061e178f1e20df2c0ca1960ec2480251

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
