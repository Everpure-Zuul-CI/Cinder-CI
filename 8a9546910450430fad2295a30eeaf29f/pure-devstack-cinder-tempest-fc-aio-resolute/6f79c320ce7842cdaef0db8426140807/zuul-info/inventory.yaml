      branch: master
      build: 6f79c320ce7842cdaef0db8426140807
      buildset: 8a9546910450430fad2295a30eeaf29f
      change: '1012421'
      change_message: 'Decide all_tenants reads by policy, not is_admin


        Listing volumes, snapshots and backups across projects was decided by

        is_admin, so a read-only cross-project role had to be added to

        context_is_admin, which also passes every admin-only check. Add

        volume:get_all:all_tenants, volume:get_all_snapshots:all_tenants and

        backup:get_all:all_tenants, defaulting to is_admin:True, the check the

        API made before. RequestContext.read_scope() is the single decision

        point and hands an elevated copy of the context to the DB read only,

        so the DB listers keep @require_admin_context. A denied caller keeps

        its own project rather than a 403, because python-cinderclient sends

        all_tenants=1 on every lookup by name (bug 1917574). Show of another

        project''s resource is a one row list under the same rule. The getters

        stay project scoped on purpose, because write paths use them.


        A repeated all_tenants is now read as one value. Before, it emptied an

        admin''s snapshot or backup list and gave a non-admin a 500 below 3.31

        and a 400 from 3.31. From 3.31 the 400 also goes away on groups, group

        snapshots, attachments and messages, and from 3.52 on volume types,

        which all keep their own all_tenants handling.


        The detail view reads a volume''s group with an elevated context to

        decide the consistency group alias, so the alias is the same in list

        and show and needs no group read.


        Closes-Bug: #1522264

        Change-Id: I054aa06a0e3c77a521a726c5deddf8ae8b147218

        Signed-off-by: Noppakorn Kaewsalabnil <noppakorn@nipa.cloud>

        '
