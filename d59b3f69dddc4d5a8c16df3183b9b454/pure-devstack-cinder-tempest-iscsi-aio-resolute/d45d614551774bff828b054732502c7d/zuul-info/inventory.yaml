      change_message: 'Everpure: report FlashArray pods as Cinder pools


        Add pure_pod_pools, a list of pre-existing pods with a quota (Purity

        6.4.3, REST 2.23) to expose as extra pools next to the array pool. Each

        pod''s quota is the pool''s total capacity and its used provisioned space

        the provisioned capacity, reported thin with a fixed oversubscription

        ratio of 1.0 and no reserve, so the scheduler refuses what the array

        would refuse. Volumes and volume groups on a pod pool are created in

        the pod. The driver never creates pods or sets quotas; without the

        option nothing changes.


        Partial-Implements: blueprint flasharray-pod-pools


