      change: '1007306'
      change_message: 'RBD: Update volume location on failover


        Replication failover updates the service state but leaves replicated

        volume host and availability zone values pointing to the original backend.

        This causes subsequent volume operations to use stale placement metadata.


        Return the active RBD backend pool in successful failover updates and use

        the corresponding volume service to update host and availability zone

        metadata. Select volumes from the active backend during failback so the

        same metadata is restored to the primary service.


        AI-modified files:

        - cinder/tests/unit/volume/drivers/test_rbd.py

        - cinder/tests/unit/volume/test_replication_manager.py

        - cinder/volume/drivers/rbd.py

