      buildset: 9b4676bfeb5c499a8a0aeaa72335cd5e
      change: '996392'
      change_message: "Dell PowerFlex Driver: Fix NVMe/TCP host creation with long
        host names\n\nPowerFlex has a 31-character limit for host names. When attaching\nvolumes
        via NVMe/TCP, host names exceeding this limit caused the\nREST API to fail
        with \"The given name exceeds the allowed length of\n31 characters.\"\n\nThis
        fix adds a _truncate_host_name method that returns the name\nunchanged if
        it's \u2264 31 characters. Otherwise, it truncates the name\nand appends an
        8-character MD5 hash suffix to preserve uniqueness\nwhile staying within the
        limit. The method is deterministic \u2014 same\ninput always produces the
        same output.\n\nThe method is called in _create_host_if_not_exist before creating\nthe
        NVMe host. Unit tests cover short names, exact-limit names,\nlong names, determinism,
        and uniqueness.\n\nCloses-Bug: #2160063\nChange-Id: I47111f4b3c196bef05fe7bdd649f1f3f29948c00\nSigned-off-by:
        Nilesh Thathagar <nilesh.thathagar@dell.com>\n"
