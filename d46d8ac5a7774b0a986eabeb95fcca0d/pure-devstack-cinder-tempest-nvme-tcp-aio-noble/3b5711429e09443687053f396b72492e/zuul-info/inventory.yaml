      change: '873249'
      change_message: 'Apply non-default qemu process limits


        followup to I462cecc3152bf838b7d42d5abc3ca31610567e5e


        due to how oslo.config is parsing options, currently ProcessLimits

        object is constructed before the config file is actually parsed,

        so image_conversion_cpu_limit and image_conversion_address_space_limit

        options are basically no-op as defaults are always used.


        This patch moves object contstruction closer to where the object is

        actually used, making these values indeed customizable.


        The `image_converson_*` options were renamed (with deprecation)

        to `image_introspection_*` ones to indicate that they apply only

        to image introspection (qemu-img info), not conversion, with appropriate

        changes in help messages.


        Closes-Bug: #1917353

        Related-Bug: #1705340

        Change-Id: I198e2dd20c83f5d2298e7d78521eb4dddf4b91f2

        Signed-off-by: Pavlo Shchelokovskyy <shchelokovskyy@gmail.com>

        '
