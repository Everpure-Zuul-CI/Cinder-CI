        private_ipv6: null
        provider: cinderci
        public_ipv4: 192.168.1.143
        public_ipv6: ''
        region: cinderci
        slot: null
      pure:
        backend: fa
        chap_enabled: false
        multiattach: false
        multipath: true
        nvme_protocol: roce
        protocol: nvme
        replication: false
        scale_test: false
        secondary_backend: none
