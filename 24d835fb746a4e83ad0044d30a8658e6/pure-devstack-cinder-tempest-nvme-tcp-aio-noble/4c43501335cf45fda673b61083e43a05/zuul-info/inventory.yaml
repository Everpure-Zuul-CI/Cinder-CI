      change: '1000747'
      change_message: 'Consume Changed Block Tracking in cinder-backup


        Build on the Changed Block Tracking (CBT) driver contract and RPC API to

        let cinder-backup ship only the blocks that changed since the previous

        backup, instead of scanning and SHA256-hashing the whole volume.


        The backup manager establishes a reference point on full backups, asks

        the volume driver for the changed extents on incrementals, and instructs

        the chunked backup driver (Swift, S3, Google, NFS, ...) to back up only

        those extents. It creates this backup''s reference point before diffing

        against the parent''s, using the side-effect-free get_cbt_extents() to

        diff the two snapshots.


        On a full backup the manager also asks the driver for the volume''s

        allocation map (a get_cbt_extents() diff with from_snapshot=None) so the

        full backup is itself sparse -- only written extents are shipped -- on

        backends that can report their written blocks. Backends that cannot

        answer a full diff fall back to a dense scan; either way a reference

        point is recorded for the next incremental.


        The framework falls back transparently to the existing SHA-diff path

        when CBT is unsupported or fails, and re-bootstraps a fresh reference

        point (one full scan) when a CBT chain''s reference snapshot has gone

        missing, so the chain recovers automatically. Restore is unchanged apart

        from a zero-fill step for sparse full backups onto a volume that already

        holds data.


        The CBT reference point is recorded under the cbt_metadata key of the

        backup''s metadata. Backup metadata is saved with delete-on-omit

        semantics, so a user updating their own keys through the API would

        otherwise drop the reference point and break the chain; the backup API

        therefore treats the key as reserved and preserves it, and the chunked

        driver promotes to a full backup if a parent''s SHA256 file turns out to

        be unreadable rather than erroring.


        The chunked driver also rejects CBT extents that lie outside the volume,

        fails the backup if the device ends part-way through a reported extent

        (instead of finalising it with those bytes missing), and applies the

        volume-grew guard the SHA256 path has always had to CBT incrementals

        too. Releasing a CBT reference on backup deletion looks the volume up

        with deleted rows visible so the backend snapshot is not orphaned when

        the volume was deleted first.


        Includes unit tests for the backup manager, chunked driver and backup

        API, and a release note.


        Assisted-By: Claude (Opus 4.8)

        Change-Id: I7ce598b68b1ca4e7caf169842a54dc735edac081

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
