      build: 97abf63ca2b7446f9aff03055bc43681
      buildset: d7090ae49f624583bf0c6ade5071b745
      change: '1012739'
      change_message: "NetApp ONTAP: add FC transport for SnapMirror replication\n\nSnapMirror
        relationships were always created over IP. ONTAP 9.20.1\nadds Fibre Channel
        as an alternative data plane transport, which lets\nreplication traffic use
        an existing FC fabric instead of the\nintercluster IP network.\n\nAdd a per-target
        ``transport`` key to ``replication_device``, so a\nbackend can select FC for
        a given destination:\n\n  replication_device = backend_id:<dest>,transport:fc\n\nThe
        key is optional and defaults to ``ip``, preserving the existing\nbehaviour.
        Nothing new is sent to clusters older than 9.20.1.\n\nThe transport in use
        is reported as the ``replication_transport`` pool\ncapability, so it can be
        matched from volume type extra specs, for\nexample ``replication_transport='<is>
        fc'``.\n\nFC transport is only expressible through the ONTAP REST API, so
        the\nREST client is forced for FC relationships and the ZAPI client rejects\nthe
        configuration with a message pointing at\n``netapp_use_legacy_client``. It
        is also rejected on ASA r2\n(disaggregated) platforms, which do not support
        SnapMirror at all.\n\nBefore creating an FC relationship the driver verifies
        on both the\nsource and destination clusters the effective cluster version,
        the\npresence of FC intercluster LIFs on each admin Vserver, and that the\ncluster
        peer has FC monitoring enabled and reports an FC state of\n``available``.\n\nSVM-scoped
        credentials (e.g. vsadmin on an SVM management LIF) are\ndetected so X-Dot-SVM
        tunneling is skipped (ONTAP 2621712). Cluster-only\nFC pre-checks that vsadmin
        cannot run are skipped with a warning while\nstill setting transport:fc on
        SnapMirror create.\n\nAssisted-by: Cursor\nChange-Id: If68968ad5510a63d477e68651ba00e1e68a86eda\nSigned-off-by:
        Sailaja Mada <sailajam@netapp.com>\nCo-authored-by: Cursor <cursoragent@cursor.com>\n"
