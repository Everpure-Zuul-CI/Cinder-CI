      change_message: 'Add backups summary API


        This adds a backups summary API in, the same way

        that the volumes summary API is implemented, in

        a new API microversion.


        This is a good way for both end-user and

        administrators to get an overview of the

        backups that is stored and it really helps

        when having thousands of backups to get an

        overview on the state of the backups

        across one or all projects.


        Closes-Bug: #2107329

        Change-Id: I69f0469b1a6c543752502f2f915001caf4570686

        Signed-off-by: Tobias Urdin <tobias.urdin@binero.com>

