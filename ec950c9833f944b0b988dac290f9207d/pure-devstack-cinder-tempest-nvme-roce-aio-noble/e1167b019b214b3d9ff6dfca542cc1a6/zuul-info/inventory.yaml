      change: '995131'
      change_message: "Add ASGI entry point for Cinder API\n\nAdds cinder.asgi.api:application,
        an ASGI entry point that wraps the\nexisting WSGI application (including the
        full paste deploy middleware\npipeline) using oslo_service.asgi.wrap_wsgi().
        This enables serving the\nCinder Volume API under modern ASGI servers such
        as Hypercorn while\npreserving all middleware, authentication, and API behavior
        unchanged.\n\nUsage:\n  $ hypercorn cinder.asgi.api:application --bind 0.0.0.0:8776\n\nThe
        existing WSGI entry point (cinder.wsgi.api:application) remains\navailable
        and unchanged for deployers using uwsgi, gunicorn, or mod_wsgi.\n\nASGI mode
        requires eventlet to be disabled. Deploy Cinder API with\neventlet monkey-patching
        disabled when using the ASGI entry point.\n\nThe ASGI entry point clears sys.argv
        before initializing the service\nbecause ASGI servers pass their own CLI arguments
        (--bind, --workers,\netc.) which would confuse oslo.config's argument parser.\n\nAlso
        adds a voting tempest-integrated-storage-asgi gate job that runs\nthe full
        integrated storage tempest suite with the API served under\nHypercorn instead
        of uWSGI.\n\nDepends-On: https://review.opendev.org/c/openstack/oslo.service/+/995128\nDepends-On:
        https://review.opendev.org/c/openstack/devstack/+/995132\nDepends-On: https://review.opendev.org/c/openstack/cinder/+/995001\nGenerated-By:
        claude-opus-4-6 (OpenCode)\nChange-Id: I89f3b99a3bc6544bcbbacf09b0549401e0647e3c\nSigned-off-by:
        Adam Harwell <flux.adam@gmail.com>\n"
