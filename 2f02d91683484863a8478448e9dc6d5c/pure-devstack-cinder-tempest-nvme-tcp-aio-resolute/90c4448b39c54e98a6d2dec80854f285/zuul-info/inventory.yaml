      branch: master
      build: 90c4448b39c54e98a6d2dec80854f285
      buildset: 2f02d91683484863a8478448e9dc6d5c
      change: '1010616'
      change_message: 'Infinidat: Add support for immutable snapshots


        Add snapshot retention locking through the infinidat:lock_expires_at

        extra spec on the source volume type. Apply the retention period when

        creating volume snapshots and consistency group snapshots.


        Accept positive integer durations in hours, days, weeks, months and

        years, including singular units. Calculate expiration in UTC using

        calendar arithmetic for months and years, and pass the resulting

        deadline to InfiniSDK.


        Validate retention settings and check has_snapshot_lock() before

        creating snapshots when locking is requested. Reject unsupported

        requests instead of creating snapshots without the requested lock.


        For consistency group snapshots, calculate all expirations from one

        UTC reference. Require the same expiration for every member, or no

        retention for all members. Reject inconsistent settings before creation.


        Handle DELETE_LOCKED_SNAPSHOT as SnapshotIsBusy when deleting an

        individual snapshot. Let Cinder restore the snapshot to available

        instead of error_deleting and record a snapshot-busy user message.

        Log the storage system''s refusal, including the retention expiration.

        Other backend failures retain their existing exception handling.


        Exclude internal temporary snapshots used for cloning and backups

        from retention locking so Cinder can remove them after use.


        Add shared extra-spec lookup, advertise the retention vendor property,

        and declare the calendar arithmetic dependency. Include unit coverage

        for calendar boundaries, validation, group retention, capability checks,

        temporary snapshots, deletion error mapping and retries. Add

        administrator documentation and a release note.


        Implements: blueprint infinidat-immutable-snapshots

        Change-Id: I8bcfeb37b74c5872028edd13b0c5a9fcb9657ac3

        Signed-off-by: Alexander Deiter <adeiter@infinidat.com>

        '
