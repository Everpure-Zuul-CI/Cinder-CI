      buildset: 03f8727ad9e74fc3a754fce6462331b8
      change: '1014186'
      change_message: 'Add Everpure FlashBlade NFS volume driver


        The Everpure FlashBlade NFS driver stores every Cinder volume as one

        raw sparse file in its own FlashBlade file system, exported over NFS

        under a single per-backend export policy. The data path is plain NFS,

        so compute hosts mount the export exactly as they do for the generic

        NFS driver, while file system, export and snapshot management goes

        through the FlashBlade REST API (py-pure-client, REST 2.16 or later,

        Purity//FB 4.5.2 or later). This first version supports volume create

        and delete, snapshots of attached volumes, create from snapshot and

        clone (host copies read from the .snapshot tree), extend, revert to

        the most recent snapshot, image copy in both directions, multiattach

        and thin-provisioning statistics. QoS, replication, groups,

        manage/unmanage and encryption are left for later versions.


        Assisted-By: Claude Code claude-fable-5-1

        Change-Id: I4551c1a1235ead96f32321db995eab54a24e67e5

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
