      branch: master
      build: 0fe96efee8ea45d6a1a55b8dfa70f4b1
      buildset: f3ebf9f3e7de4612964e9eacd258b446
      change: '1003074'
      change_message: 'NetApp: Retry lun-copy-start without vserver args


        The clone_across_pools cross-aggregate clone path calls the ONTAP

        lun-copy-start ZAPI, always passing source-vserver and

        destination-vserver. An SVM-scoped ONTAP login rejects both as extra

        input (error 13115): the vserver is already implicit in an SVM-scoped

        session, and only a cluster-scoped login is allowed to specify it

        explicitly. This made cross-pool cloning fail for any backend

        configured with SVM-scoped credentials.


        Rather than guessing the credential''s scope ahead of time, catch the

        specific rejection and retry the call without the vserver params, the

        same way this client already handles other credential-scope-dependent

        ZAPI calls (see the EAPINOTFOUND handling in list_cluster_nodes).

        Only retry when source and destination are the same vserver, since

        dropping the params in that case cannot change which vserver the copy

        targets; any other extra-input rejection, or a rejection where the

        vservers genuinely differ, is left to propagate.


        Add unit tests covering the retry-and-succeed path and the three

        cases that must not retry: a different error code, an extra-input

        rejection unrelated to the vserver params, and differing source and

        destination vservers.


        Assisted-By: Claude Code / claude-opus-4-8 (claude.ai/code)

        AI-modified files:

        - cinder/tests/unit/volume/drivers/netapp/dataontap/client/test_client_cmode.py


        Change-Id: Ib647587fe9fbf0760c53dfd2e5e04a16e89c9c76

        Signed-off-by: Rajat Dhasmana <rajatdhasmana@gmail.com>

        '
