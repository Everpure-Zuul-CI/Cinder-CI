      ansible_version: '8'
      attempts: 1
      branch: master
      build: ba0541c6f8dd43fb9fdbb91ba7f09202
      buildset: 993a71affa964be1b70fef5609519e84
      change: '988717'
      change_message: 'volume: Add deleted_at to usage notifications


        Cinder usage notifications expose creation timestamps but not the

        deletion timestamp. Without deleted_at, downstream telemetry and

        resource-tracking consumers cannot authoritatively distinguish a

        deleted resource from a replayed or late-arriving delete.end

        notification, which leads to incorrect resource lifecycle

        reconstruction.


        Populate deleted_at in the payloads built by _usage_from_volume,

        _usage_from_snapshot, and _usage_from_backup. The value is the ISO

        8601 timestamp from the database soft-delete column, or None for

        resources that have not been deleted. This mirrors the existing

        handling of created_at and launched_at and aligns cinder with the

        long-standing precedent in nova''s instance notifications. The

        change is purely additive for consumers.


        Closes-Bug: #2152661

        Change-Id: I7cd49d517b51f4740ed62928d41bcacab04ec055

        Signed-off-by: Luke Repko <luke.repko@rackspace.com>

        '
