      build: 5edacc25001a4608a3e2423b4f808998
      buildset: 8714b2665a8c40079a18e24aeb2336f4
      change: '1000481'
      change_message: 'Lightbits: record volume project in provider_id


        Retyping a volume between two volume types that name different

        Lightbits projects left the source volume behind on the storage. It

        disappeared from OpenStack''s view but kept consuming capacity; the

        only trace was a permission-denied or not-found error in the

        cinder-volume log.


        A Lightbits volume cannot move between projects, so such a retype

        migrates: Cinder copies the data into a new volume in the destination

        project and deletes the original afterwards. A Lightbits volume is

        addressed by its project, and the driver read that project from the

        volume type on every call - but Cinder deliberately leaves the

        destination volume type on the record it uses to delete the source

        volume (a volume type is "not a key for volume deletion" per

        Volume.finish_volume_migration). So the driver asked the destination

        project to delete a volume living in the source project, and the

        delete failed.


        A volume''s project and Lightbits UUID are now recorded in its

        provider_id at creation and travel with whichever record addresses

        that volume, since Cinder swaps provider_id between the two records

        during the migration hand-over. The volume type stays as a fallback.

        Creation still reads the volume type: a volume type says where to

        create a volume, a provider_id records where one already lives, and

        the temporary migration volume inherits the source''s provider_id,

        which still names the source project.


        Volumes created before this change are stamped when the volume

        service starts. The backfill takes the project from the volume type

        and makes no cluster calls, so startup cost does not scale with the

        volume count, and a volume whose type cannot be read is left

        unstamped rather than stamped with a guess that would outrank its

        type. Recording the UUID also drops a name lookup per operation, and

        a delete answered NOT_FOUND logs the project and UUID it was

        addressed to, which is the signal left when a delete is addressed to

        a project the volume was never created in.


        Assisted-By: Claude Opus 5, Claude Fable 5 (Claude Code)

        Change-Id: I43e73b8abefbd4541d16a76d551bb0d8d616e5ad

        Signed-off-by: Yuval Brave <yuval@lightbitslabs.com>

        '
