      change: '986072'
      change_message: 'Add InfoScale volume driver


        InfoScale ensures always-on business resilience; its Cluster File System

        (CFS) enables high-performance, concurrent shared-file access across

        clustered hosts. The new driver stores Cinder volumes as files on this

        cluster file system to give them the same resilience and performance.


        The driver manages volumes, snapshots and clones through the InfoScale

        REST API and authenticates every request with a client certificate.


        Volumes are attached with the new "infoscale" connection type. A host

        that is a member of the InfoScale cluster opens the volume file directly

        on the cluster file system. For any other host the driver sets

        need_export, and the host NFS-mounts the exported file system first.


        Attaching needs two companion changes: the os-brick InfoScale connector,

        which resolves the volume path and mounts the export, and the Nova

        libvirt volume driver for the "infoscale" connection type. Cinder itself

        uses the connector when it copies images to and from volumes.


        Implements: blueprint infoscale-cinder-driver

        Depends-On: https://review.opendev.org/c/openstack/os-brick/+/986070

        Depends-On: https://review.opendev.org/c/openstack/nova/+/986071

        Change-Id: I9b91e61f6f628a861cae6994ce05df1c91410d9a

        Signed-off-by: Alokedip Choudhuri <Alokedip.Choudhuri@infoscale.com>

        '
