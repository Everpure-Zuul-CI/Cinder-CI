      change: '926298'
      change_message: 'Adopt image encryption standardization


        Deprecates ''cinder_encryption_key_id'' and

        ''cinder_encryption_key_deletion_policy'' metadata attributes for

        encrypted images.

        Adds support for the new image encryption metadata properties

        ''os_encrypt_key_id'', ''os_encrypt_key_deletion_policy'' and

        ''os_encrypt_format'' for encrypted images created or imported

        by Cinder. The deprecated attributes will still be processed if

        present but only the new ones are now assigned to encrypted images

        created by Cinder.

        In case of the latter, the new container_format ''luks'' is now used.


        Migrates the individual binascii.hexlify() passphrase conversion for

        LUKS to an outsourced os-brick library function which now supports

        different secret types, including ''passphrase'' for which the hexlify

        step is skipped to provide interoperability with encrypted images

        created by Nova or end users based on a LUKS passphrase stored verbatim

        in the Key Manager. The passphrase conversion behavior and key handling

        for images created by Cinder itself are retained.


        Adds support for converting encrypted images from qcow2+LUKS to LUKS for

        Cinder volumes.


        Implements

        https://specs.openstack.org/openstack/cinder-specs/specs/2024.2/LUKS-image-encryption.html

        and makes Cinder able to consume LUKS-encrypted images in either bare or

        qcow2 format created by other entities (e.g. end user) directly.


        Co-Authored-By: Josephine Seifert <josephine.seifert@cloudandheat.com>

        Depends-On: https://review.opendev.org/c/openstack/os-brick/+/926293

        Depends-On: https://review.opendev.org/c/openstack/glance/+/926295

        Change-Id: Iefa3ecc8e68a832f88d7f63ba2734299587d908d

        Signed-off-by: Markus Hentsch <markus.hentsch@cloudandheat.com>

        '
