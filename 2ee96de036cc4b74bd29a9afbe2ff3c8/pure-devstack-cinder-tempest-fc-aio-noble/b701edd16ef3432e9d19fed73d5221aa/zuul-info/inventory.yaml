      change: '1015486'
      change_message: 'Disallow invalid IQNs in Cinder iSCSI targets


        Block initiator IQNs containing invalid characters

        for iSCSI volume targets managed by cinder-volume.


        This is done in rtstool.py to cover the specific case

        described in the bug, and is also done in targets/iscsi.py

        to standardize this checking across other targets.


        This check is not expected to introduce compatibility issues

        with deployments that are already in use. It checks that

        only valid characters are present but does not check that

        IQNs appear to be of any particular format otherwise.


        Closes-Bug: #2163562

        Generated-By: Claude Code Opus 4.8

        Change-Id: Idd9923720af6c1b2589899ff0b0d52fc4929eb45

