      change: '1004806'
      change_message: "NetApp ONTAP: skip SVM tunnel header for SVM users\n\nWith
        the NetApp ONTAP REST client (netapp_use_legacy_client=false),\n_build_headers()
        in RestNaServer adds the X-Dot-SVM-Name tunneling\nheader whenever tunneling
        is enabled, and send_request() enables\ntunneling by default. For an SVM-scoped
        (Vserver) account -- the normal\nCinder configuration on an SVM data LIF --
        the session is already bound\nto a single SVM context, so ONTAP rejects any
        request that also carries\nthis header:\n\n    \"Cannot set the svm context
        from HTTP header using: \\\"X-Dot-SVM-Name\\\"\n     or \\\"X-Dot-SVM-UUID\\\"
        while in an existing svm context\" (error 2621712)\n\nBecause do_setup() issues
        SVM-namespaced requests through this path, the\ndriver fails to initialize
        and the backend never comes up.\n\nA prior change [1] for a related bug [2]
        sets enable_tunneling=False on\ntwo specific call sites (_get_volume_by_args,\nget_operational_lif_addresses).
        Other send_request() call sites still\ndefault to enable_tunneling=True and
        hit SVM-namespaced endpoints during\ninit, so disabling tunneling call by
        call does not fully resolve the\nproblem for SVM-scoped credentials.\n\nDetect
        the account scope once, lazily, on first header build and cache\nit: query
        GET /api/svm/svms and treat exactly one visible SVM as an\nSVM-scoped account.
        For SVM-scoped accounts the X-Dot-SVM-Name header is\nsuppressed in _build_headers();
        cluster-scoped accounts (more than one\nSVM visible) retain the current behaviour.
        This covers every\ntunneling-enabled call site uniformly. The scope probe
        itself never\nsends the tunneling header, and if it cannot be completed the
        account is\ntreated as cluster-scoped so behaviour is unchanged from today.\n\nThis
        does not change the ZAPI client, the request auth path, or any\ncluster-scoped
        behaviour.\n\n[1] https://review.opendev.org/c/openstack/cinder/+/939230\n[2]
        https://bugs.launchpad.net/cinder/bug/2080945\n\nTest Plan:\nPASS - New unit
        tests in test_api.py (NetAppRestApiServerTests):\n       cluster-scoped account
        sends the header; SVM-scoped account\n       (one SVM) suppresses it; no-tunneling
        skips the scope probe;\n       scope detection runs exactly once and is cached;
        num_records\n       of 1 => SVM-scoped, 2/0/None => cluster-scoped; a NaApiError\n
        \      during the probe falls back to cluster-scoped. Verified the\n       probe
        request carries no X-Dot-SVM-Name header.\nPASS - NetAppRestApiServerTests
        suite green (70 tests).\n\nCloses-Bug: #2166532\nSigned-off-by: settkepa <SridharKumar.Ettkepalli@windriver.com>\nChange-Id:
        I3b65e9cee24df32d85121283f52158b774716d91\n"
