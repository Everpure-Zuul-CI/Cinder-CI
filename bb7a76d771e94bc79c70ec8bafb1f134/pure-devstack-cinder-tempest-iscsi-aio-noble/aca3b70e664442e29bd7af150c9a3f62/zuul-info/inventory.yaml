      branch: master
      build: aca3b70e664442e29bd7af150c9a3f62
      buildset: bb7a76d771e94bc79c70ec8bafb1f134
      change: '1005164'
      change_message: 'Everpure: key the connection lock on the array, not the host


        The per-host coordination lock added for bug #2138744 is named

        pure-<connector host>, with nothing in it identifying the array. Every

        Pure backend in the deployment therefore contends on a single lock per

        compute host, even when they serve entirely different arrays.


        LUN numbers are handed out per Purity host object, and those are per

        array. A stale device left behind on one array cannot be confused with a

        LUN reused on another, because the two present different targets to the

        initiator, so backends on different arrays never needed to exclude each

        other. Backends pointing at the same array still do, which is why the

        name carries the array id rather than the backend name: two stanzas

        against one array have to keep colliding.


        Name the lock pure-<array id>-<host>, and take one for every array a

        connection change can touch - the array serving the volume, the driver''s

        current array, and the uniform ActiveCluster targets. That set is a

        superset of what any single operation touches, which costs only

        contention, where an array left out would cost correctness.


        Nothing about the scope of the lock changes: it is acquired at the same

        point and held for the same work. Two operations that could race still

        share a name, because to race they must share an array. Only pairs on

        disjoint arrays stop colliding, and those have disjoint Purity host

        objects and disjoint LUN namespaces.


        The names are no longer fixed at decoration time, so the decorator on

        each driver''s initialize_connection gives way to a single locked entry

        point on the base class that delegates to the per-protocol

        implementation, mirroring what terminate_connection already does.


        This does not fix bug #2167043, where the lock is held across timeouts

        against unreachable ActiveCluster secondaries, but it does confine it:

        a degraded pod will stall only the backends that use those arrays,

        rather than every Pure backend serving the same compute host.


        Assisted-By: Claude Opus 5 (claude-opus-5)

        Closes-Bug: #2167044

        Related-Bug: #2167043

        Change-Id: I48fa11f80f7740b1ab6f662fec00b7ac5c2b1209

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
