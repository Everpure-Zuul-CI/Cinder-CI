      change: '995440'
      change_message: "Add native ASGI app with async RPC for volume actions\n\nAdds
        a native ASGI application entry point at cinder.asgi.native:application\nthat
        demonstrates the async value proposition for Cinder: non-blocking RPC\nfor
        attach/detach/initialize_connection/terminate_connection operations.\n\nArchitecture:\n-
        Dual-dispatch router: registered async handlers run natively on the event\n
        \ loop; unregistered endpoints fall through to the Phase-0 WSGI pipeline\n
        \ (wrapped via oslo_service.asgi.wrap_wsgi) ensuring all existing endpoints\n
        \ work from day 1.\n- AsyncVolumeAPI wraps blocking volume_rpcapi.call() operations
        in\n  asyncio.to_thread(), freeing the event loop during the multi-second\n
        \ wait for volume-manager (iSCSI/FC target setup).\n- async_api.py proves
        the SA 2.0 async DB pattern (model_select helper +\n  5 representative read
        functions using oslo_db asyncio_facade).\n\nThe native app is NON-DEFAULT
        \u2014 existing cinder.asgi.api (Phase-0 wrap_wsgi)\nremains the deployed
        entry point. Enable via:\n  CINDER_ASGI=cinder.asgi.native:application\n\nFiles
        added:\n- cinder/asgi/native.py \u2014 ASGI app skeleton with middleware +
        router\n- cinder/asgi/handlers/volume_actions.py \u2014 async attach/detach/init/term\n-
        cinder/volume/async_rpcapi.py \u2014 AsyncVolumeAPI (to_thread wrappers)\n-
        cinder/db/async_api.py \u2014 SA 2.0 async DB spike (model_select + 5 fns)\n\nChange-Id:
        I02ef95ee15122b43cca31ca7a666d035f6902f1c\nSigned-off-by: Adam Harwell <flux.adam@gmail.com>\nGenerated-By:
        claude-opus-4-6 (OpenCode)\nSigned-off-by: Adam Harwell <flux.adam@gmail.com>\n"
