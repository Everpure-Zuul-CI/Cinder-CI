      change: '994914'
      change_message: 'lvm: support migrated snapshot rename


        LVM names backend snapshots from the Cinder snapshot id. During generic

        snapshot-aware migration, the destination snapshot is first created

        with a temporary Cinder snapshot id, then the original snapshot record

        is updated to point at that destination object.


        Implement update_migrated_snapshot() so LVM renames the destination

        snapshot LV back to the original snapshot name before completion

        updates the database. If the rename fails, fail the migration

        because LVM snapshot operations address backend snapshots by name and

        destination provider fields cannot make an incorrectly named snapshot

        LV usable through the preserved snapshot id.


        Also advertise snapshot_migration_support from the LVM pool

        capabilities so the scheduler can select LVM as a valid destination

        for snapshot-aware retype.


        Assisted-By: Github Copilot

        Implements: blueprint retype-volume-including-snapshots

        Change-Id: I98572e2ef6afa1f6dae62484fe77000e7fd7b5b0

        Signed-off-by: Fuli Qi <qi.fuli@fujitsu.com>

        '
