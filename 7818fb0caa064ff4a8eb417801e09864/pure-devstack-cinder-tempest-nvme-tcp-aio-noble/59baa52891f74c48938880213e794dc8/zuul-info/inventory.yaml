      branch: master
      build: 59baa52891f74c48938880213e794dc8
      buildset: 7818fb0caa064ff4a8eb417801e09864
      change: '1002417'
      change_message: 'Everpure: lock attached hosts on force detach


        A force detach calls terminate_connection() without a connector, so the

        lock name fell back to the volume id. Nothing else uses that name --

        initialize_connection() and a normal detach both lock on

        pure-{connector[host]} -- so a force detach was serialized against

        nothing, while modifying the Purity host objects of every host the

        volume was attached to.


        The host names were there all along: attachment records carry

        attached_host, which _is_multiattach_to_host() already compares against

        connector[''host'']. Lock each attached host instead, sorted so that

        concurrent multi-host detaches cannot deadlock, and keep the volume key

        only when nothing is attached. Attachments are deliberately not filtered

        by attach_status, since one still in progress is exactly what needs

        excluding.


        The lock set is now computed per call rather than fixed at decoration

        time, so the decorator becomes a context manager.


        This completes the per-host serialization added for bug #2138744, which

        did not cover the force detach path.


        Assisted-By: Claude Opus 5 (claude-opus-5)

        Closes-Bug: #2165077

        Change-Id: I3bac07936f1f6b819ea8ff120d695dc37a41c1f9

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
