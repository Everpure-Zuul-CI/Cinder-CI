      change: '994912'
      change_message: 'volume: orchestrate generic snapshot retype


        Add the multi-snapshot loop for generic snapshot-aware retype. The

        manager rebuilds snapshots in oldest-first order before copying current

        volume data into the migration target.


        Carry migrated snapshot metadata through the generic migration path.

        Before the volume records are swapped, completion adopts the rebuilt

        destination snapshots under the original snapshot ids and repoints the

        preserved snapshot records. The source snapshot artifacts are deleted

        only after the base volume provider update and the database cutover

        have succeeded.


        Treat snapshot finalization as an application-level two-phase protocol.

        If destination adoption, update_migrated_volume, or the volume-record

        swap fails before cutover, restore the preserved snapshot records to

        the source artifacts and delete adopted destination artifacts where

        possible. Save both volume records in one database transaction so the

        record swap cannot commit only one side.


        On failures before completion, delete any staging destination

        snapshots that were already rebuilt and wait for their deletion before

        the existing temporary volume cleanup path. If snapshot finalization

        fails during completion, restore provider metadata for snapshots that

        were already updated.


        Register a worker for the retyping volume so an interrupted, unattached

        snapshot-aware migration in migration_status=migrating is rolled back

        through do_cleanup. Remove staged destination snapshots, the

        destination temporary volume, and per-snapshot temporary source

        volumes best-effort, then mark the volume as a failed migration.

        Temporary source volumes are identified by a private admin metadata

        marker, not only by their display name.


        Do not automatically unwind an attached migrating operation because

        Nova may already have pivoted the guest. Likewise, leave an interrupted

        completing operation and a retyping operation with no persisted

        migration phase unchanged for operator inspection, since Cinder cannot

        safely determine which backend mutations have completed.


        Log the snapshot migration phase, snapshot id, snapshot index, and

        volume id when rebuilding an individual snapshot fails.


        Document the API microversion, capacity and quota behavior, rolling

        upgrade restriction, administrator recovery procedure, driver contract,

        and performance impact. Add a release note.


        Assisted-By: Github Copilot

        Implements: blueprint retype-volume-including-snapshots

        Change-Id: I274a0df3314f2f814af9122a560ebbf7764949e3

        Signed-off-by: Fuli Qi <qi.fuli@fujitsu.com>

        '
