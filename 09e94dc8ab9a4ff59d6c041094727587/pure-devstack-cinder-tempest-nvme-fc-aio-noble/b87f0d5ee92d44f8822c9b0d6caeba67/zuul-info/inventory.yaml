      change: '999911'
      change_message: 'Fix data-to-zero corruption restoring an incremental backup
        chain


        When restoring a chunked backup chain (Swift, S3, Google Cloud Storage,

        POSIX/NFS) to a new or sparse volume, restore() applied the ``volume_is_new``

        "skip all-zero chunks" optimisation to every backup in the chain, not just

        the base full backup. A region that changed from data to zero in an

        incremental was therefore skipped instead of being zeroed, leaving the base

        backup''s stale data at that offset in the restored volume.


        Only the base backup, applied first to a pristine (zero) target, may skip

        all-zero chunks. Incrementals layered on top must be written in full so a

        data-to-zero change overwrites the base''s data. Gate the optimisation on
        the

        base backup accordingly.


        This is a pre-existing chunked-driver restore bug independent of Changed

        Block Tracking; it is split out from the CBT framework change so it can be

        reviewed and backported on its own.


        Closes-Bug: #2162961

        Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>

        Change-Id: Id59d70da2326ce5a34e61b22c833903398ac58c4

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
