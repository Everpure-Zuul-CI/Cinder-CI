      branch: master
      build: 875f13fc617447ba8d2034430cc490df
      buildset: 4ed6ceeb02f94aeb9377f9250e23d358
      change: '1007514'
      change_message: 'Use the io controller for copy throttling on cgroup v2


        cinder.privsep.cgroup already creates the volume copy throttle group

        under the io controller when the host mounts the unified cgroup v2

        hierarchy (commit d41586a11), but BlkioCgroup.subcommand still wraps

        every host copy in "cgexec -g blkio:<name>" and the rootwrap filter

        only accepts "blkio:". A cgroup v2 host has no blkio controller, so

        with volume_copy_bps_limit set the group is created under io: and

        then every copy through the host - generic volume migration, retype

        with migration, image to volume, volume to image - fails at cgexec

        before a byte has moved. Ubuntu 26.04, RHEL 9 and Debian 12 are all

        cgroup v2 only by default.


        Two more defects sit on the same path. The v2 cgset branch formats

        the bandwidth with %s, and BlkioCgroup._set_limits divides the limit

        between devices and hands over a float, so io.max is given

        "rbps=512.0", which the kernel rejects; v1 already used %d. And when

        cgroup-tools is not installed, cgcreate raises FileNotFoundError,

        which privsep re-raises as is; BlkioCgroup.__init__ and

        VolumeDriver.set_throttle only catch ProcessExecutionError, so

        init_host fails and the backend never comes up instead of running

        with throttling disabled.


        Add is_cgroup_v2() and io_controller() to cinder.privsep.cgroup as

        plain helpers (the marker file is world readable, and the caller

        needs the answer in its own process), use them in both entrypoints

        and in the cgexec prefix, format the v2 limit as an integer, widen the

        two guards to OSError, and let the rootwrap filter accept either

        controller. Tests cover both hierarchies for cgcreate, cgset and the

        prefix, and the missing-cgroup-tools case.


        A follow-up could drop cgroup-tools altogether and write io.max and

        cgroup.procs through privsep; that is left out of this fix.


        Closes-Bug: #2168548

        Assisted-By: Claude Code claude-fable-5-1

        Change-Id: I8730ed8d020d4b43eb012b02ff0f2a5f0d7841be

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
