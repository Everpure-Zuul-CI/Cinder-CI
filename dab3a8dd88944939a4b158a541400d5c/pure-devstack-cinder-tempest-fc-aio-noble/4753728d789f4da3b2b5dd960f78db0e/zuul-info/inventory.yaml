      change: '1004806'
      change_message: "NetApp ONTAP: skip SVM tunnel header for SVM users\n\nWith
        the NetApp ONTAP REST client (netapp_use_legacy_client=false),\n_build_headers()
        in RestNaServer adds the X-Dot-SVM-Name tunneling\nheader whenever tunneling
        is enabled, and send_request() enables\ntunneling by default. For an SVM-scoped
        (Vserver) account -- the normal\nCinder configuration on an SVM data LIF --
        the session is already bound\nto a single SVM context, so ONTAP rejects any
        request that also carries\nthis header:\n\n    \"Cannot set the svm context
        from HTTP header using: \\\"X-Dot-SVM-Name\\\"\n     or \\\"X-Dot-SVM-UUID\\\"
        while in an existing svm context\" (error 2621712)\n\nBecause do_setup() issues
        SVM-namespaced requests through this path, the\ndriver fails to initialize
        and the backend never comes up.\n\nA prior change [1] for a related bug [2]
        sets enable_tunneling=False on\ntwo specific call sites (_get_volume_by_args,\nget_operational_lif_addresses).
        Other send_request() call sites still\ndefault to enable_tunneling=True and
        hit SVM-namespaced endpoints during\ninit, so disabling tunneling call by
        call does not fully resolve the\nproblem for SVM-scoped credentials.\n\nDetermine
        the account scope once, lazily, on first header build and\ncache it, then
        suppress X-Dot-SVM-Name in _build_headers() for\nSVM-scoped accounts. This
        covers every tunneling-enabled call site\nuniformly; cluster-scoped accounts
        retain the current behaviour.\n\nScope is determined authoritatively: query\nGET
        /api/security/accounts?name=<user>&fields=scope, which reports\nscope as \"svm\"
        or \"cluster\" for the configured user. This is asked of\nONTAP directly rather
        than inferred from the number of visible SVMs, so\na cluster-scoped account
        on a cluster that happens to have a single data\nSVM is not misclassified
        as SVM-scoped.\n\nIf that query cannot be answered -- for example an SVM-scoped
        role that\nis not permitted to read /api/security/accounts -- the account
        is\ntreated as cluster-scoped and the header is sent as before. In that\ncase
        invoke_successfully() detects the resulting 2621712 rejection,\ncaches the
        account as SVM-scoped, rebuilds the headers without the\ntunneling header,
        and retries the request once. This reactive fallback\ncannot produce a false
        positive regardless of the account's RBAC\nvisibility, and the scope caching
        stays one-time.\n\nThis does not change the ZAPI client, the request auth
        path, or any\ncluster-scoped behaviour.\n\n[1] https://review.opendev.org/c/openstack/cinder/+/939230\n[2]
        https://bugs.launchpad.net/cinder/bug/2080945\n\nTest Plan:\nPASS - New unit
        tests in test_api.py (NetAppRestApiServerTests):\n       security/accounts
        scope \"svm\" => SVM-scoped, \"cluster\" =>\n       cluster-scoped; a cluster-scoped
        account on a single-SVM cluster\n       is classified cluster-scoped; an unreadable
        or indeterminate\n       scope query falls back to cluster-scoped; cluster-scoped
        account\n       sends the header, SVM-scoped suppresses it, no-tunneling skips\n
        \      the scope query, scope detection runs once and is cached.\nPASS - New
        unit test: a request that receives error 2621712 while\n       carrying X-Dot-SVM-Name
        caches the account as SVM-scoped and is\n       retried once without the header,
        returning the retry result.\nPASS - NetAppRestApiServerTests suite green (70
        tests).\nPASS - Validated on an SVM-scoped NetApp ONTAP 9.15.1 REST backend\n
        \      (iSCSI and NFS): do_setup() completes, SVM-namespaced operations\n
        \      succeed with no error 2621712, and cluster-scoped and ZAPI paths\n
        \      are unaffected.\n\nCloses-Bug: #2166532\nSigned-off-by: settkepa <SridharKumar.Ettkepalli@windriver.com>\nChange-Id:
        I3b65e9cee24df32d85121283f52158b774716d91\n"
