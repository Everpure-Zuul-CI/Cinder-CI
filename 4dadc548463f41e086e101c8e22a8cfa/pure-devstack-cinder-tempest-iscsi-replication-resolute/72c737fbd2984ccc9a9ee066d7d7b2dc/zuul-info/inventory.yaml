      change: '994913'
      change_message: 'WIP: scheduler: require snapshot migration capable retype backends


        When volume.retype() is called with include_snapshots=true for a volume

        with snapshots, require that destination backends advertise the

        snapshot_migration_support capability. Without this support, generic

        snapshot-aware migration cannot safely finalize migrated snapshot

        metadata.


        Thread include_snapshots and a snapshot_migration_required flag through

        the retype request spec. The scheduler uses the flag to filter retype

        destinations by backend capability and raises NoValidBackend when no

        candidate can handle snapshot migration.


        Pass include_snapshots to cinder-volume in volume RPC API 3.22. If a

        cinder-volume cannot receive it yet during a rolling upgrade, the

        scheduler restores the volume and releases its quota reservations as

        for a scheduling failure. A failed quota rollback while handling a

        scheduler failure is logged and no longer prevents the volume state

        from being restored.


        The volume manager also checks the selected destination before entering

        the snapshot-aware generic migration path, asking a clustered

        destination through its cluster. This catches unsupported destinations

        at execution time if a stale or incomplete request bypasses scheduler

        filtering.


        Add SNAPSHOT_MIGRATION_SUPPORT to common constants so drivers,

        scheduler, and manager share the same capability key.


        Assisted-By: Github Copilot

        Implements: blueprint retype-volume-including-snapshots

        Change-Id: Ief4f84d364417b9221a77b2eae4fa9ade80009ea

        Signed-off-by: Fuli Qi <qi.fuli@fujitsu.com>

        '
