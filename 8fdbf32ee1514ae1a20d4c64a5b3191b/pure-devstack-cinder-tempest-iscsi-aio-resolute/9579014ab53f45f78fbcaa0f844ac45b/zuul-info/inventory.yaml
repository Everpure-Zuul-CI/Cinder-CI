      change: '994906'
      change_message: 'WIP: volume: block snapshot ops during retype


        Add a shared VolumeAPI guard for user-facing snapshot operations while

        the parent volume is being retyped or migrated. This uses the existing

        volume status and migration_status fields, so no snapshot schema state

        is introduced.


        Apply the guard to snapshot create, delete, update, metadata update and

        delete, create-volume-from-snapshot, revert-to-snapshot, and group

        snapshot create, update and delete paths. The group snapshots controller

        re-raises the resulting conflict so a delete is reported as 409, like

        a create.


        While a volume is being migrated together with its snapshots, also

        reject volume update, metadata, delete, extend, retype and user

        attachment operations with 409. finish_volume_migration() swaps these

        fields with the destination record, so a write accepted mid-migration

        would be silently lost. Service requests, such as Nova swapping the

        attached volume, are still allowed. Ordinary migrations of volumes

        without snapshots and finished or failed migrations keep the existing

        behavior.


        Assisted-By: Github Copilot

        Implements: blueprint retype-volume-including-snapshots

        Change-Id: I446bf31f0e345928f87f3da0c3bd9d0e24a4d66d

        Signed-off-by: Fuli Qi <qi.fuli@fujitsu.com>

        '
