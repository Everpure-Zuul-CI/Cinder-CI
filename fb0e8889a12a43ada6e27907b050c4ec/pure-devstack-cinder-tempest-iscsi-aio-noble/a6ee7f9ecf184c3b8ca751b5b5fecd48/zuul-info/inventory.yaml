      change_message: 'WIP: volume: add driver hook for snapshot retype data copy


        Add optional copy_volume_data_to_existing_volume() driver hook so

        drivers can copy data from a temporary source volume into an existing

        destination volume during snapshot rebuild. The hook does not move

        Cinder identity or update provider metadata.


        Use the hook from _copy_volume_data_with_driver_assist() before falling

        back to generic host-assisted copy. Returning False or raising

        NotImplementedError keeps existing drivers on the generic path.


        The one-snapshot rebuild tests keep migrated snapshot finalization

        deferred to completion while covering driver-assisted copy and fallback.


