      buildset: a0cd90b59277458f9938c6e8fff89ae5
      change: '1013383'
      change_message: 'pure: copy snapshot retype data on the array


        A snapshot-aware retype between two backends that front the same

        FlashArray, for example an iSCSI and an FC backend on one array,

        attaches the volumes to the cinder-volume host and copies every

        snapshot and the base volume through it, although the data never

        leaves the array.


        Implement copy_volume_data_to_existing_volume() so the driver

        overwrites the destination volume from the source volume on the array

        (post_volumes with overwrite), which only copies metadata in Purity.

        The destination keeps its Purity name, so its QoS, volume group, pod

        and protection group membership are unchanged, and no Cinder identity

        or provider field moves.


        The destination is known to be on the same array when its Purity

        name, which embeds the Cinder volume id, exists there. The driver

        returns False and lets the manager use the host-assisted copy when the

        destination is on another array, when the encryption changes (the data

        then has to go through dm-crypt), when the source is larger than the

        destination or when a provider_id is missing. A failed overwrite fails

        the migration instead of falling back, and the destination size is

        restored if the overwrite took the smaller source size.


        Assisted-By: Github Copilot

        Implements: blueprint retype-volume-including-snapshots

        Change-Id: Ia124f4f255017f5ca6d0765a843e6696717f9881

        Signed-off-by: Fuli Qi <qi.fuli@fujitsu.com>

        '
