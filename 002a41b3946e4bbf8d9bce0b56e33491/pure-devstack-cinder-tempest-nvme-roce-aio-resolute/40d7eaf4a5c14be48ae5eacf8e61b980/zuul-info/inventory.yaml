      change: '1007355'
      change_message: 'Serialize Cisco FC zoning transactions


        Cisco MDS rejects overlapping updates to the same zoning database.  The

        existing oslo.concurrency lock is local to one cinder-volume node, so it

        does not protect active-active deployments.


        Use a cinder.coordination lock scoped by fabric for both add and delete

        operations.  Retry a failed zoning transaction while holding the lock,

        rerunning the state reads and delta calculation before each attempt so a

        partially applied operation is not blindly replayed.


        Active-active deployments must configure a shared Cinder coordination

        backend.  The default file backend only serializes operations on one node.


        Read and decode SSH stdout and stderr before closing Paramiko streams so

        switch error details and exit status survive in ProcessExecutionError.


        Generated-By: Codex GPT-5

        Signed-off-by: minsu <minsu@cisco.com>

        Closes-Bug: #2168503

        Change-Id: Icca5decc5c53ce0f02eeef636a7b70d058e3d7d7

