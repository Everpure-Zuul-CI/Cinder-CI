      build: 5b48a2010eab47a2a9ef0929a909af95
      buildset: b3c2444b541e4368a7f0ff4ee8868abc
      change: '1013936'
      change_message: 'Release CBT reference snapshots when a volume goes away


        A driver-created Changed Block Tracking reference snapshot is a

        backend-only object recorded in a backup''s cbt_metadata. Only the next

        incremental backup of the same volume consumes it, and the

        dependent-snapshot checks never see it, so nothing released it when the

        volume itself was deleted or unmanaged: thin LVM left the cbt-* LV

        behind for good once its origin was gone, and FlashArray renames a

        volume''s snapshots along with the volume on unmanage, after which the

        recorded name could never be found again.


        Release every driver-created reference a volume''s backups still hold in

        cinder-volume, through the driver''s delete_cbt_snapshot(), immediately

        before the driver deletes or unmanages the volume (plain, cascade and

        group delete), on the source of a generic migration before the record

        swap, and before a driver-assisted migration, whose driver may delete

        or rename the source itself. The release is best-effort and never

        blocks the operation; adopted references are Cinder snapshots and keep

        following the normal snapshot rules.


        The volume service''s delete_cbt_snapshot handler now reports whether

        the driver could delete a reference, so cinder-backup and operator

        tooling can tell a leak from a success.


        Assisted-By: Claude Code (Fable 5.1)

        Change-Id: I7203281089b94529dd6236d371396a4cec2da9d1

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
