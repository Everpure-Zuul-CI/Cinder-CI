      buildset: 16feda7b29a94ec68f8033b36016bacd
      change: '1011437'
      change_message: "RBD: Preserve snapshots during volume reimage\n\nVolume snapshots
        were silently deleted during server rebuild with\n--reimage-boot-volume for
        bfv-servers, because copy_image_to_volume()\nunconditionally called delete_volume(),
        which destroys all snapshots at\nbackend.\n\nThe fix passes an existing disable_sparse
        param to distinguish\nbetween vol create or reimage. disable_sparse=True is
        only set during\nreimage (to prevent data leaks from old volume data).\n-
        vol creation (disable_sparse=False): delete vol, rbd import\n  to recreate
        vol\n- vol reimage (disable_sparse=True): qemu-img convert -n,\n  to overwrite
        existing volume and preserve snapshots.\n\ncmd used to recreate in devstack
        logs:\n qemu-img convert -O raw -n -S 0 -f raw\n  /opt/stack/data/cinder/conversion/tmpxy73f2g5
        \\\n  rbd:volumes/volume-5bf6b76a-...:conf=/etc/ceph/ceph.conf:id=cinder\n\n(cherry
        picked from commit 3d04f146df28570e58a9a7f405196432a11b2db3)\n\nCloses-Bug:
        #2160473\nChange-Id: Ib0a39ffedd0869c49a47db0afd85fb50725b4381\nSigned-off-by:
        Amit Uniyal <auniyal@redhat.com>\nCo-authored-by: Amit Uniyal <auniyal@redhat.com>\nSigned-off-by:
        Rico Lin <rlin@vexxhost.com>\nAssisted-By: Codex <noreply@openai.com>\n"
