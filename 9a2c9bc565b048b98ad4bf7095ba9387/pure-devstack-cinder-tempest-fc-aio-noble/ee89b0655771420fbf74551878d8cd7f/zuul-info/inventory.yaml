      branch: master
      build: ee89b0655771420fbf74551878d8cd7f
      buildset: 9a2c9bc565b048b98ad4bf7095ba9387
      change: '998621'
      change_message: 'Fix backup hang when brick_get_connector_properties fails


        In continue_backup(), brick_get_connector_properties() is called

        outside the try/except block that handles backup failures. If the

        call raises an exception (e.g., oslo_privsep cannot start due to

        insufficient Linux capabilities in a containerized deployment),

        the exception propagates unhandled.


        Since continue_backup is invoked via an RPC cast with no reply

        channel, the caller never receives a response and the backup

        remains stuck in ''creating'' state indefinitely. The source

        volume also remains stuck in ''backing-up'' state.


        Move brick_get_connector_properties() inside the existing

        try/except block so that any failure is properly caught. The

        outer exception handler already calls update_backup_error() to

        transition the backup to ''error'' state and releases the source

        volume from ''backing-up''.


        Also fix the same pattern in _run_restore() where

        brick_get_connector_properties() and secure_file_operations_enabled()

        are called outside the error handler. While the caller

        restore_backup() has its own safety net, moving these calls inside

        the try block ensures proper user-facing error messages are created

        via the message API.


        Closes-Bug: #2161733

        Change-Id: I6f62b595539d8bf39a1a2576f2be5f2d003f9d61

        Signed-off-by: settkepa <SridharKumar.Ettkepalli@windriver.com>

        '
