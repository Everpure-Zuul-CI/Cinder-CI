      build: 0a4412ad3dde43209574aa5921120267
      buildset: 5015df78a07f4735b8a23f23c8679794
      change: '1008534'
      change_message: '[Hitachi] Add volume group replication


        The Hitachi driver replicates single volumes but not generic volume

        groups, so a failover cannot keep write order across a group''s

        members. Add group replication: a replicated group is one Universal

        Replicator copy group, and enable_replication, disable_replication,

        failover_replication and list_replication_targets act on it as a

        whole. A copy group is named HBSD- plus the group''s UUID in 22 base62

        characters, the shortest alphanumeric form of the whole UUID that fits

        the name limit, so two groups can never share a copy group.


        A volume type can set group_replication_enabled so that its volumes

        are paired when they join a copy group rather than at create time.

        The storage system allows one pair per mirror unit, so a volume paired

        at create time could never join a copy group. The driver reads the

        spec the way Cinder reads replication_enabled, so it accepts the same

        ''<is>'' true values the scheduler matches.


        failover_replication accepts <backend_id>:graceful, which splits the

        copy group from the primary storage system, and

        <backend_id>:emergency, which takes it over from the secondary side

        without the primary. With no suffix the group type extra spec

        hbsd:group_replication_failover_mode decides, and the default is

        emergency. secondary_backend_id=default fails the copy group back and

        resumes from the current pair state.


        After a group fails over, attach and detach use its members''

        secondary volumes. Delete, extend, retype, migrate, snapshot and

        revert are refused until failback, because they would act on primary

        volumes that no longer hold the group''s data.


        Secondary volumes can be adopted with manage_existing, and group

        snapshots are taken on the secondary side. The

        hitachi_replication_check_pair_on_attach option makes attach read the

        copy group and refuse a volume that hosts cannot write, such as a

        standby secondary volume between failback swaps. It defaults to False

        because reading a copy group can take tens of seconds.


        A backend now starts when its replication peer is unreachable, so the

        DR site can serve a failover while the primary is down. REST errors

        log the detailCode, and KART40152-E (remote storage not registered)

        is not retried.


        This change also fixes three bugs in the existing replication code: a

        pair status wait that timed out raised RuntimeError (PEP 479), a

        journal LDEV leaked when labelling it failed, and update_group raised

        TypeError when an update failed with no volumes to remove.


        Change-Id: I6a85c1617ae1d3c9c85b2d834d43a0a459933408

        Signed-off-by: Pratik Shah <pratik.shah@platform9.com>

        '
