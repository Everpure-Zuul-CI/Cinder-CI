      build: b7241753e1d44293b32ea51dd20e97df
      buildset: 18aefbba088f49368df1233963299395
      change: '1000433'
      change_message: 'Lightbits: change QoS policy without migration


        Changing the IOPS limit of a volume meant retyping it, and the driver

        implemented no retype, so the volume manager fell back to a

        host-assisted migration. Every QoS change copied the whole volume into

        a new one and deleted the original. For an operator moving a group of

        volumes between limits this is the slowest possible way to change a

        number.


        A QoS policy is a property of the volume, not of where it sits, and

        the Lightbits volume update API already accepts one. The driver now

        implements retype: when the only difference between the two volume

        types is the QoS policy, it sets the policy on the volume and reports

        the retype done, so no data moves.


        Anything else is handed back to the volume manager, which migrates as

        before: a different project, replica count or compression all describe

        where the volume lives. Removing a policy is handed back too, because

        falling back to the project default is not expressible as a volume

        update. A rejected policy raises, which the manager logs and then

        migrates, so an operator gets the retype they asked for either way.


        The QoS update is sent as its own command carrying only the volume

        UUID and the policy, rather than folded into the volume update that

        also carries the ACL: a QoS-only change must not disturb a live ACL,

        and a retype unit test sets host ACLs and asserts they survive.

        Placement extra specs are compared textually, so a semantically equal

        respelling falls back to migration rather than risking a wrong

        in-place match.


        Assisted-By: Claude Opus 5, Claude Fable 5 (Claude Code)

        Change-Id: I7f5488be71565515be2fd75f052f67ba48445608

        Signed-off-by: Yuval Brave <yuval@lightbitslabs.com>

        '
