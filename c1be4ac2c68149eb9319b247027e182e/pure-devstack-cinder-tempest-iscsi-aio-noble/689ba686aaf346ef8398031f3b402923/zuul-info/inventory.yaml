      change: '484729'
      change_message: 'Optimize getting parent backup for new incremental


        When creating an incremental backup all existing backup entries were fetched

        from the DB to then search this potentially large list for the one to use
        as

        parent. This change introduces a new method utilizing a single DB query to

        find the parent (if one exists).


        Additionally the backup status of `RESTORING` was added to the list of

        valid status, as a restoring backup is indeed a valid, read-only source for
        a

        new incremental backup.


        Co-Authored-by: Niklas Schwarz <niklas.schwarz@inovex.de>

        Change-Id: I4ca4fd0dc3c294ebead069c5bb93e869b417439e

        Closes-Bug: 1696715

        Signed-off-by: Jon Bernard <jobernar@redhat.com>

        Signed-off-by: Christian Rohmann <christian.rohmann@inovex.de>

