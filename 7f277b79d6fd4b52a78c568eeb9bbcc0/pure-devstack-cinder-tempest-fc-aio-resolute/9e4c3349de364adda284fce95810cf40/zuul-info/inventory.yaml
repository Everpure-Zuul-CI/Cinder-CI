      change: '1000900'
      change_message: 'Add cross-cloud replica export/import APIs


        Replicated volumes can fail over to a secondary backend within one

        OpenStack deployment, but there is no way to move a replicated

        volume''s data and metadata to a volume in a different OpenStack

        deployment, which is required to recover from the loss of an

        entire cloud.


        Add microversion 3.72 with two new volume actions. export_replica

        exports a failed-over volume''s properties (size, name, volume

        type, metadata, glance metadata) and driver-specific vendor

        metadata as a self-contained document. import_replica creates a

        volume from that document on the target cloud: it reuses the

        manage_existing flow with a new ImportReplicaTask that skips the

        backend rename and replication setup manage_existing performs,

        since the backend resource is already the replicated image and

        already has replication configured by the storage layer. BaseVD

        gains export_replica, get_import_replica_ref and import_replica

        methods for drivers to implement; the RBD driver implements them

        using its image name and the source volume''s name_id as vendor

        metadata.


        import_replica validates that the backend resource named by the

        document''s vendor_metadata actually exists, synchronously through

        a new get_import_replica_ref volume RPC call before any volume

        record is created, so a bad reference is rejected with a 400

        instead of surfacing later as an error_managing volume. Like

        volume creation and manage, the request returns 202 and the

        import is routed through the scheduler (scheduler RPC 3.13), so

        the backend is validated against the volume type''s capabilities;

        the scheduler RPC API gains an import_replica method for this.

        The API layer reserves the volumes quota, sets multiattach and

        replication_status from the resolved volume type, rejects

        encrypted types, and errors the volume out if the cast fails. The

        manage flow gains an ImportReplicaMetadataTask that applies the

        portable metadata (the readonly admin metadata key, and glance

        metadata with id-bearing keys renamed with a source_ prefix)

        before the volume is marked available, so a failure reverts to

        error_managing.


        export_replica takes clear_existing so a driver can attempt

        best-effort array-side teardown (e.g. breaking replication from a

        backend that resyncs automatically); a failure to reach the source

        array must not fail the export, since export runs right after a DR

        event, exactly when that array may be unreachable. With

        clear_existing set, the source Cinder record is removed through

        the unmanage path once the document has been returned to the

        caller: the volume is claimed with a conditional_update requiring

        it to be available or error, unattached, not migrating and

        snapshot-free (group membership is allowed, since the spec wants

        per-member export), and the delete is issued as an

        unmanage-only delete_volume cast so quota release, unmanage

        notifications and stats bookkeeping all happen. Exporting a

        volume created from an encrypted volume type is rejected, since

        the target cloud cannot resolve a key UUID from the source

        cloud''s Barbican. get_import_replica_ref and import_replica take

        source_cloud_id, which a driver has no other way to learn, for any

        target-side bookkeeping or cleanup tied to provenance.


        Bump the volume RPC API to 3.21 for the new export_replica,

        import_replica and get_import_replica_ref methods.


        Add unit tests covering the volume_actions and v3 volumes

        controllers, the volume API and manager export_replica/

        import_replica methods, the scheduler hop, the policy rules,

        the RPC API bumps, and the RBD driver''s implementation.


        Depends-On: https://review.opendev.org/c/openstack/cinder-specs/+/985952

        APIImpact

        Partial-Implements: blueprint replication-v3

        Assisted-By: Claude (sonnet-4.5), GLM 5.3 (opencode)


        Change-Id: Ib998143680b41464a7618f4bf2b68d5b8a4e91d2

        Signed-off-by: Rajat Dhasmana <rajatdhasmana@gmail.com>

        '
