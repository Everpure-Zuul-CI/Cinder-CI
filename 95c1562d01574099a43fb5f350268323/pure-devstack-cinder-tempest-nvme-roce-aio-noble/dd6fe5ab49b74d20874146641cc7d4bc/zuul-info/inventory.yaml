      change: '998392'
      change_message: 'WIP: remotefs: allow source snapshot cleanup during retype


        Snapshot-aware retype commits the migration in two phases: after the

        destination adopts the rebuilt snapshots, the source backend is asked

        to delete the old snapshot artifacts. At that point the parent volume

        is still in the ''retyping'' state (it is only restored at the end of

        migrate_volume_completion), but the remotefs _delete_snapshot state

        validation only accepted ''available'', ''in-use'', ''backing-up'',

        ''deleting'' and ''downloading''. The deletion failed with InvalidVolume,

        and because the second commit phase is best-effort, the migration

        succeeded while every source chain file was left orphaned on the

        share (delete_volume later removes only the active file and the

        snapshot info file).


        Accept ''retyping'' in the state validation. This is safe because

        user-facing snapshot operations are rejected at the API layer for the

        whole duration of a retype, so the only request that can reach the

        driver in this state is the migration''s own source cleanup.


        Assisted-By: Github Copilot

        Implements: blueprint retype-volume-including-snapshots

        Depends-On: I93282cbf99194c8c6591c7c24a29804f7cce301a

        Depends-On: Ief4f84d364417b9221a77b2eae4fa9ade80009ea

        Change-Id: I321de6d45c455bb5998a4cfd5d3bb91ed3e7e206

        Signed-off-by: Fuli Qi <qi.fuli@fujitsu.com>

        '
