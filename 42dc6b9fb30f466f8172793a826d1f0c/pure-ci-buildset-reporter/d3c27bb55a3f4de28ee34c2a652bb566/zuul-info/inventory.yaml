      change: '928781'
      change_message: 'Pass volume summary filters from API to DB layer


        The volume summary API accepts volume filters but they

        are not applied when calling down to the database layer.


        This fixes that bug by passing the filters to the database

        function in a new microversion.


        This also fixes the bug where we would throw a 500 instead

        of 400 error when passing invalid parameters, this is done

        regardless of microversion.


        Depends-On: https://review.opendev.org/c/openstack/openstacksdk/+/928867

        Closes-Bug: #2080228

        Change-Id: I9efee1a14d670c193768ffef67b1b24e635a6d86

        Signed-off-by: Tobias Urdin <tobias.urdin@binero.com>

        '
