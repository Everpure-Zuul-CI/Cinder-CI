      build: 26a0f4d75caa44efb7512d3849107100
      buildset: 2014ab5d2f0642dc9d465fb9fa3edb7f
      change: '995793'
      change_message: "Fix encrypted volume operations cross-project failure\n\nWhen
        an admin from a different project performs operations on encrypted\nvolumes
        (migration, retype, clone, backup), Barbican denies access to\nthe encryption
        key because secrets are project-scoped.\n\nAdd a service-user context fallback
        to all encryption key access paths:\nwhen the initial key retrieval fails
        with a KeyManagerError, retry with\nthe Cinder service user context from [keystone_authtoken]
        configuration.\nThis extends the pattern already used by delete_encryption_key()
        to all\nencryption operations.\n\nChanges:\n- Extract _get_cinder_service_context()
        helper from delete_encryption_key\n- Add get_encryption_key_with_fallback()
        for drivers\n- Add service-context fallback to clone_encryption_key() and\n
        \ brick_attach_volume_encryptor()\n- Replace direct keymgr.get() calls in
        RBD, NFS, RemoteFS drivers and\n  create_volume flow with get_encryption_key_with_fallback()\n\nOperators
        must ensure the Cinder service user has Barbican policy\npermission to read
        secrets across projects.\n\nDepends-on: https://review.opendev.org/c/openstack/devstack/+/995827\n\nRelated-Bug:
        #1895848\nCloses-Bug: #1929128\n\nAssisted-By: Claude\nChange-Id: I219c0db4a934e64169542ba7653052724c766b9e\nSigned-off-by:
        Luca Miccini <lmiccini@redhat.com>\n"
