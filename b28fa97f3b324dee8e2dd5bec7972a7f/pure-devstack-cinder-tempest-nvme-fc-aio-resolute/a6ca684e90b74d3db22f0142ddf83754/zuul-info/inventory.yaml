      change: '999375'
      change_message: "HPE 3PAR: QOS handling for AlletraMP\n\nWith the recent changes
        in Alletra MP, few qos params are now enabled\nand requires handling from
        cinder driver upstream and new capacity based QoS introduced.\n\n1. Introduced
        capacity-based QoS handling through per-GB QoS extra specs such as read_iops_sec_per_gb,\n
        write_iops_sec_per_gb, and bandwidth equivalents.\n\n2. Capacity QoS values
        are translated into Alletra MP QoS payload fields with perGB=True and the\nappropriate
        ioDirection (r/w/rw).\n\n3. Added validation to allow capacity QoS only on
        Alletra MP 10.6.0 or later,\nreject mixed read/write directions, and prevent
        mixing capacity QoS with legacy absolute QoS limits.\n\n4. Added relevant
        UTs\n\nCloses-Bug: #2162549\nChange-Id: I083819b6c0332e09c39de8d9a597f97c544eb071\nSigned-off-by:
