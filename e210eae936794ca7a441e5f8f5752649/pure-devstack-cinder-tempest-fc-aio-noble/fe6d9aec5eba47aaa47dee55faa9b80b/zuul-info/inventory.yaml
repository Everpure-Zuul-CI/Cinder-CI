        changes that impacted multiple Cinder driver workflows,

        resulting in failures across driver initialization,

        volume creation, snapshot operations, source based

        provisioning, backup handling pertaining to EC gentype.


        This patch fixes these functionalities pertaining

        to PowerFlex 5.0


