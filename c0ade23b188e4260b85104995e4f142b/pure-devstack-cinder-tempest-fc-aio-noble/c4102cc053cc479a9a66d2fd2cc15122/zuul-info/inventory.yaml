      build: c4102cc053cc479a9a66d2fd2cc15122
      buildset: c0ade23b188e4260b85104995e4f142b
      change: '997211'
      change_message: 'ceph: advance dest offset when discarding zero chunks


        Restoring a backup to a new volume sets discard_zeros, so _transfer_data()

        skips all-zero chunks. The Ceph driver skipped them without moving the

        destination offset, so every following non-zero chunk was written too

        early and the restored volume came back shifted and corrupted.


        An encrypted (LUKS) volume hits this reliably: it is sparse, the restore

        takes the full non-diff path, and a freshly created target sets

        discard_zeros=True. The restore reports success and the corruption only

        shows up later when the guest cannot mount the volume.


        Advance the destination offset by the number of bytes just read whenever

        a zero chunk is discarded, the same bookkeeping the chunked driver

        already does on its non-zero writes.


        Closes-Bug: #2155612

        Change-Id: Idb7b709ba3f6c42ab237e717b0e58db365a7567c

        Signed-off-by: kurtyoon <kr.dev.kurtyoon@gmail.com>

        (cherry picked from commit 8d4a9e90242b5ab29d7aefc2c63ec3ae68d1e63f)

        (cherry picked from commit 4c63df3db31e6f7c954b17be28413fc465dbedd9)

        '
