      buildset: d73aef3e7f1d44029ed94e2b39c5279f
      change: '1001037'
      change_message: 'Let CBT drivers ask the changed-blocks API for a smaller page


        A volume driver has only two ways to answer get_cbt_extents(): return the

        extents, or return None. None means "changed block tracking is unsupported

        or unavailable", which the os-list_changed_blocks API reports as a 409.


        That leaves no way to say "the diff exists, just ask for less". A backend

        whose CBT API is synchronous, or subject to its own request limits and

        timeouts, can be unable to answer a large window in a single call. Today

        it either fails and is reported as a 409 -- indistinguishable from having

        no CBT support at all, so the client has no reason to think a smaller

        request would work -- or truncates its own result, which is worse: a short

        list is indistinguishable from "these are all the changed blocks", so the

        caller treats the missing extents as unchanged and writes a corrupt

        incremental backup.


        Add exception.CBTPagingRequired for drivers to raise instead, optionally

        carrying a suggested_limit. The volume manager lets it propagate rather

        than collapsing it to None (it reaches the caller intact because

        cinder.exception is an allowed remote exception module), the volume API

        passes it through, and the changed-blocks API reports it as HTTP 413 with

        the driver''s suggested page size, so the client can retry successfully.

        cinder-backup, which has no caller to retry with a smaller page, catches

        it like any other failure and falls back to a full scan.


        Also add changed_blocks_rpc_timeout for the get_cbt_extents RPC call.

        Computing a diff can take longer than a typical RPC on those same

        backends, where the default rpc_response_timeout would report a failure

        for a query that would otherwise have succeeded. It defaults to

        rpc_response_timeout when unset, so behaviour is unchanged unless a

        deployment opts in.


        Assisted-By: Claude Opus 4.8

        Change-Id: Ib7bb63748da8ce469b16067ae423dc7bda0bad4f

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
