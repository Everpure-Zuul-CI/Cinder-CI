      change: '997849'
      change_message: 'Everpure: add NVMe/FC support to the NVMe driver


        Add NVMe over Fibre Channel as a third transport for PureNVMEDriver,

        selected with pure_nvme_transport = fc (alongside roce and tcp). It

        reports storage_protocol NVMe-FC.


        For the FC transport the driver emits the nvmeof connection contract with

        transport_type=''fc'': FC target ports (those exposing both an NQN and a

        WWN) become ''nn-0x<wwn>:pn-0x<wwn>'' traddr portals, and the connection

        carries target_wwn plus an initiator_target_map so the FC Zone Manager

        zones the fabric on attach/detach. The host is still registered by its

        NQN, as for RoCE/TCP.


        _build_initiator_target_map is moved to the base driver so it is shared

        by the Fibre Channel and NVMe/FC transports. The RoCE/TCP paths are

        unchanged.


        Implements: blueprint nvme-fc-transport-support

        Depends-On: https://review.opendev.org/c/openstack/os-brick/+/997815

        Depends-On: https://review.opendev.org/c/openstack/cinder/+/997816

        Change-Id: I5558ca6807e585a96b63ea629e88b6d84f750bcc

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        Co-Authored-By: Claude Opus 4.8 (1M context) <noreply@anthropic.com>

        '
