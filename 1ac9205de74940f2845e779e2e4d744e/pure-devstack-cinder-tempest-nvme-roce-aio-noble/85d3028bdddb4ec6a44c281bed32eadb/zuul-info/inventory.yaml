      change: '997962'
      change_message: 'IBM SVF bug fix for broken SSH execution retry logic.

        The retry delay was triggered for SSH CLI commands that should not be retried,

        and the exception handling code prevented retries from occurring when attempts

        was greater than one. These issues are fixed by adding an additional

        condition before sleeping and moving the exception handling block outside

        the retry loop, allowing all configured retry attempts to be exhausted

        before the final exception is raised.


        Fixes bug 2161082

        Change-Id: I0df0b9395004da1af968c464548ae4aba2cf6cdc

        Signed-off-by: rakshay <akshay.ranade@ibm.com>

