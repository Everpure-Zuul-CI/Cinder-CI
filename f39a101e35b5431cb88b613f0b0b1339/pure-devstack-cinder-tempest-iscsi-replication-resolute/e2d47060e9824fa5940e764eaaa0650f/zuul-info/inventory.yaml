      change: '994909'
      change_message: 'volume: rebuild one snapshot into a staging destination snapshot


        Generic snapshot-aware retype rebuilds each source snapshot by creating

        a temporary volume from the source snapshot, copying its data into the

        destination volume, and then creating a staging destination snapshot there.


        The temporary resource in this flow is the source-side temporary volume.

        The destination-side snapshot is a staging snapshot, identified internally

        by the tmp-snap-migrate-<source-snapshot-id> display name, and later adopted

        by the preserved snapshot record.


        Add the per-snapshot rebuild flow and cleanup for failures after staging

        snapshot creation.


        Assisted-By: Github Copilot

        Implements: blueprint retype-volume-including-snapshots

