      branch: master
      build: 08da8b46c80d48e896ffc7fded3ceb97
      buildset: 7a4a259b2f1441e9b98acc3583b41f34
      change: '966521'
      change_message: 'cinder-volume: Disable ONTAP tunneling on _get_volume_by_args
        for

        inter-SVM file copy operations.


        When performing file copy operations from glance FlexVol which is different

        from cinder''s one to cinder FlexVol, `_get_volume_by_args`

        method for src volume will be called with enable_tunneling=True by default.

        However, src volume can be in different SVM from cinder''s one in this

        case, and thus, attempting to retrieve volume information fails.


        This change ensures that the file copy operations between different SVMs

        are handled by passing enable_tunneling=False to `_get_volume_by_args`

        explicitly for src volume.


        https://bugs.launchpad.net/cinder/+bug/2131009


        Change-Id: I0b46d0c5aa1c8b6a192a36367810301df94b4de7

        Signed-off-by: TOMOFUMI-KONDO <ugax2kontomo0314@gmail.com>

