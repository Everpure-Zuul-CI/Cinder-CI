      branch: master
      build: 4ab49b48102a4f72a2817c3214c0c60a
      buildset: f37e8791b31e4e70a79654cd29f2fb3d
      change: '997333'
      change_message: 'Fix os-services enable/disable to persist disabled state


        The os-services enable() and disable() handlers build their response

        dict but never set the Service object''s "disabled" attribute before

        calling save(). Because Service.save() only persists changed fields,

        the save is a silent no-op: the API returns HTTP 200 reporting the

        service as enabled/disabled while the database row is left unchanged.


        As a result, "volume service set --enable" (and the reason-less

        --disable) report success but do not actually change the service

        state, leaving a service stuck disabled. Only disable_log_reason()

        works, because it still sets the field explicitly.


        This is a regression introduced by commit 74b312d554f0,

        "api: Simplify enable/disable APIs (services)", which split the

        monolithic update() method into separate enable()/disable() handlers

        and dropped the shared "svc.disabled = ret_val[''disabled'']"

        assignment that update() performed before saving. The handlers were

        then copied to cinder/api/v3/services.py by "api: Merge os-services

        extension", carrying the bug to the v3 API.


        Set "disabled" explicitly (and clear "disabled_reason" on enable) so

        the change is persisted again. Extend the regression tests to assert

        that re-enabling also clears disabled_reason in the DB update path.


        Closes-Bug: #2160669

        Assisted-by: Github Copilot

        Change-Id: Ic075cd64e431cdfc34f40071eb1115910062d691

        Signed-off-by: Masayoshi Mizuma <m.mizuma@fujitsu.com>

        '
