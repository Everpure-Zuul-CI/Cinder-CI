      change: '998395'
      change_message: 'WIP: nfs: advertise snapshot migration support


        Advertise the snapshot_migration_support capability from the generic

        NFS driver so the scheduler can select it as a source or destination

        for snapshot-aware retype (migration_policy=

        on-demand-include-snapshots). All the machinery the flow relies on is

        now in place for remotefs backends: the format-aware generic data copy

        preserves the destination qcow2 chain, update_migrated_snapshot adopts

        rebuilt snapshots by re-keying the snapshot info file,

        update_migrated_volume leaves a rebuilt chain unrenamed, and the

        source-side cleanup is accepted while the volume is ''retyping''.


        The capability mirrors the _check_snapshot_support() conditions: it is

        only advertised when nfs_snapshot_support is enabled and

        nas_secure_file_operations is not ''true'', because the destination

        rebuild has to create snapshots on this backend and would otherwise

        fail at runtime instead of being filtered out by the scheduler. The

        driver reports no pools, so the single backend-level key serves both

        the scheduler filter (through the synthesized pool) and the volume

        manager''s up-front capability check.


        Assisted-By: Github Copilot

        Implements: blueprint retype-volume-including-snapshots

        Depends-On: I93282cbf99194c8c6591c7c24a29804f7cce301a

        Depends-On: Ief4f84d364417b9221a77b2eae4fa9ade80009ea

        Change-Id: Ibdc0ac1a9c0b777cee7509d471e6b1454dab2492

        Signed-off-by: Fuli Qi <qi.fuli@fujitsu.com>

        '
