      build: ee79fa3220cb4c8b8f7db90eb151833f
      buildset: f881a7622f3d4873b42f237882fd905d
      change: '949717'
      change_message: 'Avoid deep copying of volume when it''s on the same filesystem


        When both source and destination of the image->volume are on

        the same filesystem, like in case of image conversion, and does have

        same volume type, it makes sense to perform a move of the image

        rather then deep copy using dd.


        It not only speed up the download process, but also reduce diskspace

        consumption during such migration.


        A sample example would be having images on Swift storage while

        using Ceph as a volume storage. In case image is already stored in RAW

        it is enough to fetch, verify and move the image to expected destination

        rather then also doing deep copy with dd.


        At the moment 50Gb RAW image will consume 100Gb diskspace on

        cinder-volume for conversion, which is not even required.


        Change-Id: I6e2551f087b589c3e3e094f70169360d74099e57

        Signed-off-by: Dmitriy Rabotyagov <dmitriy.rabotyagov@cleura.com>

        '
