      branch: master
      build: d2acf9d290d14cb98ded7c7579aad5af
      buildset: 33eef4a2764b4ece94456179582c184c
      change: '1010230'
      change_message: "Allow size increase when retyping to encrypted type\n\nRetyping
        an available, unencrypted volume to a volume type with\nfront-end LUKS encryption
        fails on backends that write the LUKS header\ninside the volume: the destination
        volume has the same size as the\nsource volume, and copying the full source
        volume fails with \"No space\nleft on device\".\n\nImplement the spec retype-encrypt-allow-size-increase\n(https://review.opendev.org/c/openstack/cinder-specs/+/1011834):\n\n*
        Microversion 3.72 adds the optional \"allow_size_increase\" flag to the\n
        \ os-retype volume action. When it applies, the API does the checks of\n  an
        extend to the larger size (volume:extend policy, size limits of the\n  new
        type, per_volume_gigabytes) and reserves the extra gigabyte after\n  the other
        retype reservations.\n* The extra reservation goes to the scheduler in request_spec
        and on to\n  the volume manager with volume RPC API 3.21. The scheduler fails
        the\n  retype instead of dropping the reservation when it can not send 3.21.\n*
        The volume manager decides in retype(), from the new pool capability\n  encryption_header_space_allocated
        of the destination, whether the\n  destination volume must be larger. On a
        destination that reports\n  False, a retype without the flag now stops before
        the data copy with\n  a user message. The extra reservation is committed or
        rolled back with\n  the other new type reservations, and these rollbacks now
        use the\n  project of the volume.\n* Drivers set the capability with a class
        attribute, which the volume\n  manager adds to every pool. The LVM, Huawei
        iSCSI and FC, and\n  Everpure iSCSI, FC and NVMe drivers report False, as
        listed in the\n  spec, and the RBD drivers report True; other drivers keep
        the previous\n  behaviour. Operators can set it with extra_capabilities.\n\nThe
        code, tests and documentation were written with an AI assistant\nfrom the
        spec and an analysis of the Cinder code, then reviewed and\nedited by the
        author. An earlier version of the size increase (patch\nset 4) was tested
        on a 2024.2 deployment with a Huawei iSCSI backend.\n\nCloses-Bug: #1687880\nRelated-Bug:
        #1925818\nImplements: blueprint retype-encrypt-allow-size-increase\nAssisted-By:
        Claude Code (claude-opus-5-5)\nChange-Id: I7c8c118418782dc9d80cbd4dada47dc364440bde\nSigned-off-by:
        Jan Wasilewski <jan.wasilewski@atman.pl>\n"
