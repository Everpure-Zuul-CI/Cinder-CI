      build: ee5a6e974409458786849501bfbc0147
      buildset: 93924990587049c9b0cd3bc43294a3de
      change: '1012421'
      change_message: 'Decide all_tenants reads by policy, not is_admin


        Listing, counting or summarizing the volumes, snapshots and backups of

        every project was decided by context.is_admin, and the DB listers add

        their own admin-only gate. A role that may read everything but must

        not write could only be built by adding it to context_is_admin, which

        makes every is_admin:True check pass for it, rule:admin_api included.

        With enforce_new_defaults=false it can then also delete resources in

        other projects.


        Add volume:get_all:all_tenants, volume:get_all_snapshots:all_tenants

        and backup:get_all:all_tenants, defaulting to is_admin:True, the check

        the API makes today, so who may read across projects does not change

        until an operator grants them.

        rule:admin_api would not be the same check once a deployment overrides

        admin_api or context_is_admin. RequestContext.read_scope()

        applies the rule at the list, count and summary sites. It returns an

        elevated copy of the context for the DB read only after the policy

        passed, so the @require_admin_context gate of the DB listers stays as

        it is, and is_admin of the caller is never touched.


        A caller the policy denies still gets its own project, not a 403.

        python-cinderclient''s findall() sends all_tenants=1 on every lookup by

        name, so refusing would break "cinder show <name>" for every non-admin

        (bug 1917574). For the same reason reject_invalid_filters() and the

        pre-3.31 filter decorator keep all_tenants for these three resources,

        where it is a scope request and not a column. Every other resource

        still drops it. all_tenants=0 from an admin now lists the admin''s own

        project, where volumes returned an empty list.


        A malformed value is a 400 for a role the policy grants, as it already

        was for volumes and backups and is new for snapshots. An admin on

        snapshots keeps their own project, listed in

        policies.MALFORMED_ALL_TENANTS_FOR_ADMIN. is_admin only selects how

        such a value is read. The scope is still decided by the policy.

        all_tenants=None reaches the API as a Python None for volumes and is a

        malformed value, not an absent key. Snapshots read " 1" as true before,

        so they still do.


        A repeated all_tenants left a value for the DB, where it matched a

        column that does not exist and emptied the list. Every one is now

        removed. Volumes read the last value that parses, and snapshots and

        backups read the first, as they did.


        Show of another project''s volume, snapshot or backup is a one row list

        through the same rule. It only looks for what the caller could not see,

        so a denial by volume:get stays a 404.

        volume_api.get(), get_snapshot() and

        backup_api.get() are not widened: write paths fetch their target

        through them, and some of those actions (backup:create) still carry

        deprecated rules with an empty check_str, so a granted reader could

        copy another project''s data into its own. Actions on that resource

        stay decided by their own policies.


        Transfers, groups, group snapshots and attachments keep the is_admin

        check and are left for a follow-up.


        The detailed volume view looks a volume''s group up with the caller''s

        context to decide whether to show it as a consistency group. For a

        granted reader that lookup is project scoped, so another project''s

        grouped volume turned the whole list into a 404. The view now skips

        the consistency group alias when the group is not readable.


        Closes-Bug: #1522264

        Change-Id: I054aa06a0e3c77a521a726c5deddf8ae8b147218

        Signed-off-by: Noppakorn Kaewsalabnil <noppakorn@nipa.cloud>

        '
