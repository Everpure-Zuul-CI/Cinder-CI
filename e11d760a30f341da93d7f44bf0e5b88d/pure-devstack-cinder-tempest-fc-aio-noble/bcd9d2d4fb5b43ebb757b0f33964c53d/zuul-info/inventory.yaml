      change: '1002251'
      change_message: 'Restore a backup using the source volume type


        Restoring a backup without specifying a target volume auto-creates the

        destination volume. That volume was created with the deployment''s

        default volume type, discarding the source volume''s type. For encrypted

        volumes this broke restore entirely (EncryptedBackupOperationFailed,

        because the restored encryption metadata requires the source''s type),

        and for any volume it silently dropped the source type''s QoS and

        backend-specific settings.


        The restore API intentionally accepts no volume type, so the

        auto-created volume should reproduce the source volume as faithfully as

        possible. Create it with the source volume''s type, resolved before

        creation so the data lands on the correct backend (avoiding an

        otherwise-required migration). Fall back to the default type only when

        the source volume or its type no longer exists. Users who want a

        different type can use the create-volume-from-backup API, which does

        accept one.


        AI-modified files:

        - cinder/backup/api.py

        - cinder/tests/unit/backup/test_backup.py

        - releasenotes/notes/bug-2165014-encrypted-backup-restore-f007cebdc7725220.yaml


        Closes-Bug: #2165014

        Generated-By: Claude Code / claude-opus-4-8 (claude.ai/code)

        Change-Id: I44403d5a6d56ce3b7f0d32f3861ebc90123fe9f6

        Signed-off-by: Rajat Dhasmana <rajatdhasmana@gmail.com>

        '
