      change: '1006840'
      change_message: "Add cinder-manage quota deployment_check and deployment_sync\n\nThe
        existing 'quota check' and 'quota sync' actions skip the\ndeployment-wide
        aggregate counter on purpose, because their\nproject-keyed sync functions
        would compute its usage as zero.  Give the\ncounter its own verification and
        repair:\n\n- deployment_check recomputes the aggregate from the volume and\n
        \ snapshot tables and from the live reservations, compares it with the\n  counter
        and exits with status 1 on a discrepancy.\n\n- deployment_sync does the same
        and rewrites the counter, creating the\n  row when it does not exist yet.\n\nBoth
        reuse the aggregate helper introduced for on-demand row creation,\nso bootstrap
        and repair can never disagree about what the counter\nshould hold.  reserved
        is recomputed as the sum of the positive deltas\nof the live sentinel-owned
        reservations, exactly as the per-project sync\ndoes; negative deltas never
        enter reserved.\n\ndeployment_sync locks only the sentinel row and never a
        per-project\nrow, so it cannot deadlock with running services, which lock\nper-project
        rows first and the sentinel last.  It is the documented\nstep to run once
        every service has been upgraded and before enabling\ndeployment_max_gigabytes,
        since old services do not maintain the\ncounter during a mixed-version window,
        and it is the repair for\nreserved leaked by a service that died between reserve
        and commit.\n\nThe aggregate-on-demand query is too slow to serve as the enforcement\npath
        on every reservation, but it is correct and cheap as an occasional\nrepair,
        which is what it is used for here.\n\nImplements: blueprint deployment-aggregate-quota\nAssisted-By:
        Claude Code claude-fable-5-1\nChange-Id: I3941f470b4ed5c7112f388b76c70a933c8a25eb9\nSigned-off-by:
        Simon Dodsley <simon@purestorage.com>\n"
