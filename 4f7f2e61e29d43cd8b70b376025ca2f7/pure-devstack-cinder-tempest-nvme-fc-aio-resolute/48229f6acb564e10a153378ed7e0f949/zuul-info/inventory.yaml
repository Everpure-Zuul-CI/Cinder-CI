      build: 48229f6acb564e10a153378ed7e0f949
      buildset: 4f7f2e61e29d43cd8b70b376025ca2f7
      change: '1014245'
      change_message: 'Let adopted CBT reference snapshots follow the volume


        The Changed Block Tracking framework adopts the temporary snapshot that

        cinder-backup takes of an in-use volume as the backup chain''s reference

        point and keeps it alive after the backup. That snapshot is an ordinary

        Snapshot row, so after any CBT backup of an in-use volume the volume

        could no longer be deleted, unmanaged, migrated or retyped until the tip

        backup was deleted, and, being the newest snapshot, it also stopped the

        volume being reverted to any snapshot of the user''s own.


        Recognise an adopted reference by the backup record that names it

        (reference_snapshot_cinder_id in cbt_metadata) rather than by the

        snapshot''s use_quota flag, which a failed revert''s recovery snapshot

        shares. Leave exactly those snapshots out of the dependent-snapshot

        checks in volume delete, unmanage, migrate, group delete and the retype

        path and out of the latest-snapshot check of the revert action, and

        have the volume manager delete them together with the driver-created

        reference snapshots right before the driver deletes, unmanages,

        migrates or reverts the volume. A revert releases every reference of

        the volume except its target, so the next backup re-bootstraps its

        reference point. Any other snapshot blocks exactly as before.


        Assisted-By: Claude Code (Fable 5.1)

        Change-Id: I266e82161643875475a5f11271bdb4ca33ca1b8b

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
