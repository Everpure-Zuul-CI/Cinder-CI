      build: 743b2db8e6f2494099f5a644a0e6a4f0
      buildset: 66ad28b1c9f845c3adb94294272d7d05
      change: '1006322'
      change_message: 'Default backup compression to zstd


        The chunked backup drivers (Swift, S3, NFS/posix, Google) compress every

        chunk with backup_compression_algorithm before uploading it, and the

        default has been zlib since the option existed.  zlib is the bottleneck

        of the whole backup loop.  Measured on current master with cinder-backup

        on native threads, an S3 backend and a 10 GiB volume of mixed

        zero/text/random data (205 chunks of 50 MiB), compression was 68% of the

        per-chunk loop and ran on a single core: the 8-core node sat at 84%

        idle for the whole backup.


        zstd has been supported since aeb94ecec (Victoria) and is already a hard

        requirement (zstd>=1.5.0.0).  Switching to it cut the same backup from

        168 s to 72 s (61 -> 143 MiB/s) while producing a smaller backup (ratio

        6.46 vs 5.77).  Two runs on different nodes agreed to within 0.1 s.

        Uncompressed (''none'') was slower than zstd at 122-129 s because the

        upload of the extra bytes dominates.  The per-stage numbers are on the

        bug.


        Change the default to zstd.  Restores are unaffected: every backup

        object records the algorithm it was compressed with and the

        decompressor is chosen from that, so existing zlib backups restore as

        before and incremental chains that mix algorithms work.  Operators who

        want the previous behaviour can set backup_compression_algorithm = zlib.


        The driver tests that mock zlib.compress to prove compression runs on a

        native thread now select zlib explicitly, and the NFS tests feed the

        compressor bytes rather than a bytearray, which is what the driver reads

        from the volume and the only input zstd accepts.


        This is the first of the changes for the bug; pipelining the chunk loop

        (read/sha, compress, upload run strictly one after another today) is

        the next, and supersedes the upload-only parallelism of 779233.


        Partial-Bug: #1918119

        Assisted-By: Claude Code claude-fable-5-1

        Change-Id: I22e58420aa12b853e134dde6676283bd200f7d0e

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
