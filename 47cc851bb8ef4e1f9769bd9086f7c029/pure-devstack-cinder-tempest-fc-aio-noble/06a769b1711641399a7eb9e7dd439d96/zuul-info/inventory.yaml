      change: '1006408'
      change_message: 'Use a regular expression for like filters


        The like filters added in microversion 3.34 are matched with SQL LIKE,

        so a ''%'' or a ''_'' typed by a user acts as a wildcard: listing volumes

        with ''name~=%'' returns every volume instead of the volumes whose name

        contains a percent sign.


        Match them with the regular expression operator of the database, and

        reject a value that is not a valid regular expression with a 400

        response.


        The implementation follows nova, which matches its own like filters the

        same way: the helpers come from nova/db/utils.py (get_regexp_ops), the

        filtering from nova/db/main/api.py (_regex_instance_filter), and the 400

        response from the ''regex'' format checker that nova applies to its query

        parameters in nova/api/validation/validators.py.


        Closes-Bug: #2167797

        Signed-off-by: hongp <inyong.hong@samsung.com>

        Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>

        Change-Id: I056aed964cb62ac17c05aaa689a00ef04ae9c91c

        '
