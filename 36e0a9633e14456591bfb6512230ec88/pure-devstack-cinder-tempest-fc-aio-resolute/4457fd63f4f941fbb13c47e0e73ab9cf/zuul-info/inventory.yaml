      build: 4457fd63f4f941fbb13c47e0e73ab9cf
      buildset: 36e0a9633e14456591bfb6512230ec88
      change: '1007330'
      change_message: 'Fall back to buffered dd when direct I/O is rejected


        On Ubuntu 26.04 dd comes from Rust coreutils 0.10.0, whose O_DIRECT

        read buffer is not aligned to the device''s dma_alignment. On

        multipath, iSCSI, virtio and loop devices the kernel rejects the first

        read with EINVAL ("dd: IO error: Invalid input"), so every copy that

        goes through the host - generic volume migration, retype with

        migration, the LVM driver''s clones and the copy_volume paths of other

        drivers - fails within a fraction of a second and the volume ends up

        in error. check_for_odirect_support did not notice because it ran dd

        with count=0: the devices were opened with O_DIRECT but nothing was

        read.


        Probe the input side by reading one block of the source to /dev/null

        with the block size the copy will use, and, if the copy itself is

        still refused with EINVAL while a direct flag is in use, run it again

        with buffered I/O and conv=fdatasync so the data still reaches the

        device before the volume is detached (bug 1363016). A direct-I/O

        rejection happens on the first read or write, before any data has

        moved, so the retry is safe for every caller.


        The uutils bug is uutils/coreutils#12085, fixed in 0.11.0; the Ubuntu

        package bug is 2168495.


        Closes-Bug: #2168496

        Assisted-By: Claude Code claude-fable-5-1

        Change-Id: I7c7c0e7da36be74c8ae2af3e0e2ce28c062bf17d

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
