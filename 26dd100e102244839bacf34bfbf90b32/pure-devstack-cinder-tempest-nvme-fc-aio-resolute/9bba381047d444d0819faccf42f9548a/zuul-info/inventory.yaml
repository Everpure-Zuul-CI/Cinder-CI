      build: 9bba381047d444d0819faccf42f9548a
      buildset: 26dd100e102244839bacf34bfbf90b32
      change: '1007754'
      change_message: 'Add OpenTelemetry tracing middleware for Cinder


        Wire the OpenTelemetry tracing middleware provided by oslo.middleware

        into the Cinder API paste pipeline.


        The paste filter can be added unconditionally: the middleware is

        disabled by default and acts as a zero-overhead passthrough when off,

        so the optional opentelemetry libraries do not need to be installed

        just to have the filter present. Enabling tracing requires extra

        configuration: set "enabled = True" under the [oslo_middleware_tracing]

        group in cinder.conf and install the optional opentelemetry packages.

        Enabling the middleware without those packages installed will cause the

        service to fail at startup.


        The TracingMiddleware is only available from oslo.middleware 8.2.0

        onwards, so the minimum required version is bumped accordingly.


        Change-Id: I891d8525375c711f3e874117887b36394cee5399

        Signed-off-by: Juan Larriba <jlarriba@redhat.com>

        '
