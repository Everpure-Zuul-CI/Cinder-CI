      branch: master
      build: 892941adc93e4f598d8662cadfc6876f
      buildset: 983636758641411eb797cb0262373ac8
      change: '1008073'
      change_message: 'Everpure: report the backend as an explicit single pool


        The scheduler only emits capacity.pool and capacity.backend

        notifications for backends whose statistics include a pools list,

        and skips any pool lacking its required keys

        (HostManager._get_updated_pools). The Everpure driver reported no

        pools list, relying on the implicit pool the scheduler builds for

        such drivers, so those notifications, and the

        volume.provider.pool.capacity meters Ceilometer derives from them,

        were never produced for a FlashArray backend. The earlier release

        note for the provisioned_capacity_gb fix claimed to have restored

        capacity telemetry; it restored the scheduler''s over-subscription

        accounting only, because the missing pools list is checked first.


        A FlashArray has one tier of storage, so the backend is its only

        pool. Report it as a one-element pools list carrying every existing

        statistic, named after volume_backend_name. That is the name the

        scheduler already gave the implicit pool, so the host#pool of

        existing volumes and the capabilities.<key> names used in

        filter_function and goodness_function expressions are unchanged.

        thick_provisioning_support is now reported as False, which the

        scheduler previously defaulted.


        The unit test now also checks that the published pool passes the

        scheduler''s notification gate.


        Assisted-By: Claude Code claude-fable-5-1

        Change-Id: I897cc1d27e999ac6a7d0086449bb8a08fa0f9aec

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
