      change: '996497'
      change_message: "[Pure Storage] Implement Tiramisu group replication actions\n\nThe
        driver advertised the consistent_group_replication_enabled capability\nbut
        never implemented the generic volume group (Tiramisu) replication\nactions,
        so enable_replication, disable_replication and failover_replication\nfell
        through to the base driver and raised NotImplementedError.\n\nImplement all
        three actions for both asynchronous and synchronous\n(ActiveCluster) replicated
        groups:\n\n* enable_replication / disable_replication toggle the replication
        schedule\n  on the group protection group.\n* Async and trisync groups fail
        over by promoting the latest replicated\n  protection group snapshot on the
        secondary array (reusing the existing\n  async host-failover machinery).\n*
        Sync groups live in a stretched ActiveCluster pod served by both arrays,\n
        \ so failover and failback only update status without moving data (reusing\n
        \ the existing sync host-failover machinery). Sync-replicated consistency\n
        \ groups are now created inside the pod without async schedule setup.\n\nBecause
        a group failover is group scoped it deliberately does not move the\ndriver's
        current array the way failover_host() does, so the array now\nserving each
        failed over volume is recorded in that volume's\nreplication_driver_data and
        resolved per volume by _get_array_for_volume().\nVolume operations - attach,
        detach, extend, snapshot, revert and delete -\nfollow the group to the secondary,
        while volumes outside the group stay on\nthe primary. Failing back clears
        the recording. Operations that cannot be\nhonoured against a failed over volume,
        namely clone, create from snapshot\nand retype, are rejected with a clear
        message rather than silently creating\na volume outside the replication topology.\n\nAlso
        bump the iSCSI, FC and NVMe driver versions to 23.0.\n\nCo-Authored-By: Claude
        Opus 4.8 (1M context) <noreply@anthropic.com>\nSigned-off-by: Simon Dodsley
        <simon@purestorage.com>\nCo-Authored-By: Claude Opus 5 <noreply@anthropic.com>\nChange-Id:
        Ie3d497f92e3c70ee8f81cca5f21d95c1814f716e\n"
