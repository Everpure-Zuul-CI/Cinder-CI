      change: '1013382'
      change_message: 'pure: support migrated snapshot rename


        Pure names backend snapshots as <parent volume>.<suffix> and derives

        the suffix live from the Cinder snapshot id. During generic

        snapshot-aware migration, the destination snapshot is first created

        with a temporary Cinder snapshot id, then the original snapshot record

        is updated to point at that destination object.


        Implement update_migrated_snapshot() so the driver renames the staging

        snapshot on the destination array to pair the destination parent volume

        with the original snapshot suffix, exactly like manage_existing_snapshot

        adopts a pre-existing snapshot. The target parent is derived from the

        staging snapshot''s volume because the hook runs before completion swaps

        the volume records'' provider fields; for a destination in a sync

        replicated pod the parent name carries the pod prefix. If the rename

        fails and the target does not already exist (interrupted finalize

        retry), fail the migration so finalization rolls back to the intact

        source artifacts. The returned model update refreshes the

        array_snapshot_name/array_name snapshot metadata the driver maintains,

        which the volume manager merges into the preserved snapshot record.


        Also advertise snapshot_migration_support for all protocol subclasses

        (iSCSI/FC/NVMe). The driver reports the backend as a single pool, so the

        key is set both in the pool, which the scheduler filters on, and at the

        backend level, which the volume manager''s capability check reads.


        Assisted-By: Github Copilot

        Implements: blueprint retype-volume-including-snapshots

        Depends-On: https://review.opendev.org/c/openstack/cinder/+/994914

        Change-Id: I59a43062ca1d6bed080d90fc422375b332ec68c2

        Signed-off-by: Fuli Qi <qi.fuli@fujitsu.com>

        '
