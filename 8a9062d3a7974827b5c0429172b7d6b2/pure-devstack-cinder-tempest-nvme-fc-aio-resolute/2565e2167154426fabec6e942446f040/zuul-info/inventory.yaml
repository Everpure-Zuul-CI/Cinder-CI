      change: '999400'
      change_message: 'NetApp ONTAP: apply space allocation to cloned LUNs


        Creating a volume from a snapshot or cloning a volume did not

        consistently apply the netapp:space_allocation extra spec or the

        driver''s ONTAP-version-based default to the destination LUN.


        Determine the requested setting using the same policy as create_volume()

        and pass it through the clone, copy, migration, and snapshot-revert

        paths. Apply or verify it after creation where needed. REST updates use

        the UUID returned by discovery and do not explicitly offline the LUN.


        The current ZAPI implementation cycles the newly created LUN

        offline/online only when the setting differs. This is a conservative

        implementation choice, not a claim that a particular supported ONTAP

        release requires that cycle.


        Discover newly cloned or copied LUNs with three total attempts, one

        second apart, retrying empty results and object-not-found errors. Other

        lookup errors fail immediately.


        Discovery failure does not itself trigger rollback in these clone/copy

        paths, including snapshot revert. A retained LUN can require manual

        recovery or cleanup and may prevent a retry using the same name.

        Configuration failures trigger best-effort rollback; cleanup failure

        does not replace the original error.


        Closes-Bug: #2162548

        Related-Bug: #2152031

        Assisted-By: Claude Code claude-opus-5

        Signed-off-by: hongp <inyong.hong@samsung.com>

        Change-Id: Idd175236e0f0a4bbb7e4e0f12f079c6e92acc172

        '
