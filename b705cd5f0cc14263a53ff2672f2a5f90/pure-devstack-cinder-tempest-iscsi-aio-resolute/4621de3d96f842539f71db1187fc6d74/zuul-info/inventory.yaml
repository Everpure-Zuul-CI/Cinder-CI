      build: 4621de3d96f842539f71db1187fc6d74
      buildset: b705cd5f0cc14263a53ff2672f2a5f90
      change: '1000900'
      change_message: 'Add cross-cloud replica export/import APIs


        Replicated volumes can fail over to a secondary backend within one

        OpenStack deployment, but there is no way to move a replicated

        volume''s data and metadata to a volume in a different OpenStack

        deployment, which is required to recover from the loss of an

        entire cloud.


        Add microversion 3.72 with two new volume actions. export-replica

        exports a failed-over volume''s properties (size, name, volume

        type, metadata, glance metadata) and driver-specific vendor

        metadata as a self-contained document, then optionally deletes the

        Cinder record of the source volume via the clear_existing

        parameter. import-replica creates a volume from that document on

        the target cloud: it reuses the manage_existing flow with a new

        ImportReplicaTask that skips the backend rename and replication

        setup manage_existing performs, since the backend resource is

        already the replicated image and already has replication

        configured by the storage layer. BaseVD gains export_replica,

        get_import_replica_ref and import_replica methods for drivers to

        implement; the RBD driver implements them using its pool and image

        name as vendor metadata.


        Bump the volume RPC API to 3.21 for the new export_replica and

        import_replica methods.


        Add unit tests covering the volume_actions and v3 volumes

        controllers, the volume API and manager export_replica/

        import_replica methods, the RPC API bump, and the RBD driver''s

        implementation.


        AI-modified files:

        - cinder/api/contrib/volume_actions.py

        - cinder/api/microversions.py

        - cinder/api/openstack/api_version_request.py

        - cinder/api/schemas/volume_actions.py

        - cinder/api/schemas/volumes.py

        - cinder/api/v3/router.py

        - cinder/api/v3/volumes.py

        - cinder/policies/volume_actions.py

        - cinder/policies/volumes.py

        - cinder/volume/api.py

        - cinder/volume/driver.py

        - cinder/volume/drivers/rbd.py

        - cinder/volume/flows/manager/manage_existing.py

        - cinder/volume/manager.py

        - cinder/volume/rpcapi.py

        - cinder/tests/unit/api/contrib/test_volume_actions.py

        - cinder/tests/unit/api/v3/test_volumes.py

        - cinder/tests/unit/volume/drivers/test_rbd.py

        - cinder/tests/unit/volume/test_replication_manager.py

        - cinder/tests/unit/volume/test_rpcapi.py

        - releasenotes/notes/cross-cloud-replication-export-import-ef39cca491954691.yaml


        APIImpact

        Partial-Implements: blueprint replication-v3

        Generated-By: Claude Code / claude-opus-4-6, claude-sonnet-4-5 (claude.ai/code)


