      change: '990982'
      change_message: 'FlashArray: add Changed Block Tracking backup support


        Implement the CBT incremental backup driver methods (get_cbt_extents,

        create_cbt_snapshot, delete_cbt_snapshot) for the Everpure FlashArray

        driver using the array''s volumes/diff API. Opaque reference identifiers

        from the backup framework are mapped deterministically to length-safe

        array snapshot names, and adjacent changed extents are consolidated to

        bound the RPC payload.


        get_cbt_extents() also accepts from_snapshot=None, which the backup

        framework uses on a full backup to request the volume''s allocation map.

        In that case the driver runs volumes/diff with no base_name so the array

        reports every written block, letting the full backup be sparse -- only

        allocated regions are shipped and never-written holes are skipped.


        Add a pure_cbt_diff_block_size option to control diff granularity. On

        arrays or Purity versions where volumes/diff is unavailable the backup

        falls back to the existing full-scan path.


        Also rebrand the driver''s copyright, comments and docstrings from

        Pure Storage to Everpure.


        The FlashArray third-party CI runs the cinder-tempest-plugin CBT scenario

        tests (including the in-use backup/restore round-trip) against this driver,

        so this change also depends on that test change.


        Assisted-By: Claude (Opus 4.8)

        Depends-On: https://review.opendev.org/c/openstack/cinder/+/990923

        Depends-On: https://review.opendev.org/c/openstack/cinder-tempest-plugin/+/995741

        Change-Id: I463a6c7657b5f65a75707f0a146b58029edc8613

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
