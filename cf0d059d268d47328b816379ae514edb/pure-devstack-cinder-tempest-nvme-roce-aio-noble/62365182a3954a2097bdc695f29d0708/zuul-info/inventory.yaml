      branch: master
      build: 62365182a3954a2097bdc695f29d0708
      buildset: cf0d059d268d47328b816379ae514edb
      change: '933006'
      change_message: 'Directly import converted image to RBD


        For volume encryption from Glance image case,

        once we cloned the image down, we do convert and import back to RBD.


        This patch allows us to avoid another tempfile write and directly

        upload image to RBD.


        The ``qemu-img convert`` invocation this adds (via

        ``_encrypt_image_and_upload`` and the non-encrypted direct path in

        ``_copy_image_to_volume``) inherits the RBD tuning introduced by the

        direct_dest parent commit. For any ``rbd:`` destination,

        ``_tune_qemu_convert_for_rbd`` appends ``-m 16 -W`` and the URL

        options ``rbd_cache=false:rbd_concurrent_management_ops=20``.

        ``-m 16`` raises qemu-img''s parallel conversion coroutine count

        (default 8) so more writes are in flight at once and the per-write

        round trip to Ceph is hidden; ``-W`` allows out-of-order write

        completion so coroutines do not serialize on the previous write.

        Without them the direct path is several times slower than the legacy

        ``rbd import`` staging step on a network-replicated cluster.


        Related-Bug: #2055517

        Change-Id: Ib5e15eeee6a02e2833d14ac34f6fdeb4a6548a67

        Signed-off-by: Rico Lin <rlin@vexxhost.com>

        Assisted-By: Copilot <223556219+Copilot@users.noreply.github.com>

        Assisted-By: Codex <noreply@openai.com>

        '
