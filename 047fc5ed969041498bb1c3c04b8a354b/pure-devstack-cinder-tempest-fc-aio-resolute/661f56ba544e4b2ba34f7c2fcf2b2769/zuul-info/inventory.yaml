      change: '1009514'
      change_message: 'Everpure: distinguish the replication pod from other pods


        The driver treats any "::" in a volume name as "this volume is in the

        ActiveCluster pod": initialize_connection also connects it on the

        uniform replication targets, terminate_connection disconnects it there,

        and _setup_volume reports it as replicated. The only pod the driver

        places volumes in is the replication pod, but a volume imported with

        manage_existing from any other pod carries the same prefix, and then it

        is connected on arrays where it does not exist and reported as

        replicated when it is not.


        Test for the replication pod by name instead, through one helper that

        also copes with a backend that has no replication devices (there the

        pod name is unset, and a bare volume name must not match it).


        Protection groups inside a pod are named by the pod on a replication

        target (pod:pg), not by the source array (array:pg). The driver knew

        this only for the trisync leg and special-cased it twice; derive the

        target-side name from the group name in _get_pgroup_name_on_target and

        use it everywhere, including when looking the replicated snapshot up at

        failover. Behaviour for the trisync leg is unchanged.


        Partial-Implements: blueprint flasharray-pod-pools


        Assisted-By: Claude Code claude-fable-5-1

        Change-Id: I6d58642cc15b9f4d93eb4f73399a0b0293552013

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
