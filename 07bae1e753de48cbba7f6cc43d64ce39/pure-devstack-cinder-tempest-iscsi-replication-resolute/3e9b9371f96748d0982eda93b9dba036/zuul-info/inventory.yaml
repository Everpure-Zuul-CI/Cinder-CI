      change: '1009518'
      change_message: 'Everpure: manage existing volumes into pod pools


        cinder manage --host host@backend#pod now places the imported volume in

        that pod: a reference already in the pod is renamed in place, a

        reference at the array root is moved into the pod (the pod quota

        permitting), and a reference in another pod or in a volume group is

        refused with ManageExistingInvalidReference, since moving between pods

        is left to the administrator. The volume type''s volume group, if any,

        is created inside the pod. Managing onto the array pool is unchanged.


        Partial-Implements: blueprint flasharray-pod-pools


