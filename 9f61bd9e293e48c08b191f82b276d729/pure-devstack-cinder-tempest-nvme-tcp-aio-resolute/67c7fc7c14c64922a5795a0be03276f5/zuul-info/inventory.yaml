      change: '1006838'
      change_message: "Maintain the deployment-wide gigabytes counter on reserve\n\nWire
        the deployment-wide aggregate quota counter into quota_reserve.\nNothing is
        enforced yet: the limit handed down is always -1, so the\ncounter is maintained
        and observable through 'cinder-manage quota\ndeployment_usage' while every
        reservation succeeds exactly as before.\n\nIn quota_reserve, once the per-project
        rows are locked and the\nper-project check has passed, every tracked resource
        in the deltas\n(currently gigabytes) is applied to the sentinel row:\n\n-
        The row is found, or created on first use with in_use computed from\n  the
        volume and snapshot tables.  A concurrent first creator loses\n  with DBDuplicateEntry,
        which the existing wrap_db_retry already\n  retries.  This replaces any seed
        migration.\n\n- A positive delta is claimed with one conditional UPDATE whose
        WHERE\n  clause carries the ceiling and the INT overflow guard, so the check\n
        \ and the claim have no window between them and correctness under\n  active-active
        services rests on row atomicity alone.  Zero affected\n  rows means refused;
        the row is re-read to raise QuotaUsageOverflow or\n  DeploymentQuotaExceeded.
        \ The figures are logged at WARNING and kept\n  out of the exception.\n\n-
        Every delta, of either sign, gets a sentinel-owned reservation, so\n  commit,
        rollback and expiry apply it exactly as for a project.  A\n  negative delta
        never touches reserved and reaches in_use at commit;\n  decrementing reserved
        at reserve time would publish headroom before\n  the delete commits and, because
        commit leaves reserved alone for\n  negative deltas, would drift it negative
        by the size of every delete.\n\nThe sentinel is touched last on every path.
        \ Per-project rows first,\nsentinel row last is the global lock order for
        quota_usages, and the\nper-project check runs first so that a request which
        would fail project\nquota never reaches the sentinel and is reported as it
        is today.\n\nA request naming the sentinel as its project_id is rejected with\nInvalidInput.\n\nThe
        limit and an exemption flag travel from QuotaEngine through\nDbQuotaDriver.reserve
        to quota_reserve, which widens the quota driver\ncontract.  The public QUOTAS.reserve
        signature is unchanged; a new\nQuotaEngine.reserve_net_zero, with the same
        parameters, skips the\nsentinel entirely for paired-delta flows such as volume
        transfer, whose\nacceptor-side positive reservation would otherwise be refused
        at the\nceiling although no capacity is being added.\n\nConcurrency is covered
        by opportunistic MySQL and PostgreSQL tests in\ncinder/tests/unit/db/test_deployment_quota_concurrency.py,
        skipped\nwhere no such database is available: twelve parallel reservations\nstraddling
        a ceiling of five, of which exactly five succeed and the\ncounter lands with
        no leaked reserved; concurrent first-use creation\nyielding exactly one sentinel
        row; and expiry releasing the aggregate\nreserved.  SQLite has neither SELECT
        ... FOR UPDATE nor concurrent\nwriters, so these cannot run there.\n\nThe
        QuotaReserveSqlAlchemyTestCase fakes are white-box tests of the\nper-project
        algorithm and now stub the deployment path; the aggregate\npath has its own
        tests in test_db_api.\n\nImplements: blueprint deployment-aggregate-quota\nAssisted-By:
        Claude Code claude-fable-5-1\nChange-Id: If55f1dae004a028cbcb9ec5383e53ae651814d7f\nSigned-off-by:
        Simon Dodsley <simon@purestorage.com>\n"
