      build: df6e75fe64954da3b974798cfec111cb
      buildset: bc7f8c91590c427da202c55385f3ecaf
      change: '988574'
      change_message: 'NetApp ONTAP: honor ONTAP 9.15.1+ default for LUN space-allocation


        ONTAP 9.15.1 changed the default LUN space-allocation setting from

        disabled to enabled. The block driver was unconditionally creating

        LUNs with space-allocation disabled (unless the

        netapp:space_allocation extra spec was set), causing inconsistency

        between Cinder-managed volumes and ONTAP''s own defaults.


        The driver now checks the ONTAP version when no extra spec is present:

        - ONTAP >= 9.15.1: space-allocation enabled (matches ONTAP default)

        - ONTAP < 9.15.1: space-allocation disabled (preserves existing behaviour)


        The explicit netapp:space_allocation extra spec continues to take

        precedence over version-based defaults.


        Closes-Bug: #2152031


        Change-Id: I4dd3bbb1d634befe02cdcde0a20fab7f2f4c046a

        Signed-off-by: hongp <inyong.hong@samsung.com>

        (cherry picked from commit fd7d0560180ffc5bed008541c2224aa4b1cfca99)

        '
