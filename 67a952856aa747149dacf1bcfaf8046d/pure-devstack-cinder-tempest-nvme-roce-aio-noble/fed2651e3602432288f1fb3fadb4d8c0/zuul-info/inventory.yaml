      branch: stable/2025.2
      build: fed2651e3602432288f1fb3fadb4d8c0
      buildset: 67a952856aa747149dacf1bcfaf8046d
      change: '994410'
      change_message: 'HPE 3par: Fix session share issue


        This patch is backport of

        https://review.opendev.org/c/openstack/cinder/+/971158


        [1] One request (say initialize_connection or terminate_connection)

        obtains a session token and attempts to logout after completing.


        [2] Meanwhile, a parallel periodic task (get_volume_stats) starts and

        reuses the same session token. This function executes wsapi calls (which

        could take few seconds).


        When logout is attempted by [1], while get_volume_stats [2] is still

        running; the session token deletion fails with below error, because it''s

        actively being used. Conflict (HTTP 409) 34 - resource in use


        This patch resolves session share issue by creating separate session

        token for operations [1]. Thus these operations would not interfere with

        session token used by get_volume_stats.


        Closes-Bug: #2125037

        Change-Id: Ia6c09b55b9c615a80b65965e17e0d66bd7d8c55c

        Signed-off-by: Raghavendra Tilay <raghavendra-uddhav.tilay@hpe.com>

        (cherry picked from commit d5094f72f9a635b786a7b1070558c613be4438cc)

        '
