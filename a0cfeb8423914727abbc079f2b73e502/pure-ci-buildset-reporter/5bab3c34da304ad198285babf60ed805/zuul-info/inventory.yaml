      change: '988742'
      change_message: 'Dell PowerFlex: Handle missing errorCode in NVMe-oF REST error
        responses


        Remove redundant "errorCode" in response checks from query_system_nqn,

        query_sdts, query_hosts, and create_nvme_host methods. This ensures

        errors are properly raised even when the response does not contain an

        errorCode field, making error handling more robust.


        Follow up to https://review.opendev.org/c/openstack/cinder/+/912058


        Change-Id: I151ebb3e74826cc65829a12599ec00e0bb808168

        Signed-off-by: Nilesh Thathagar <nilesh.thathagar@dell.com>

        '
