      ansible_version: '8'
      attempts: 1
      branch: master
      build: 7ad20927f07c41208d330ec4c1fe3387
      buildset: 15f01737051b424d8f939f3da47f0e79
      change: '1010803'
      change_message: 'Register the osprofiler SQLAlchemy tracing hook


        configure() in cinder/db/api.py meant to add osprofiler''s SQLAlchemy

        tracing to the database engine, but the hook is a lambda that is

        built and thrown away rather than registered, and nothing calls

        configure() anyway. With [profiler] enabled and trace_sqlalchemy set,

        traces therefore have WSGI and RPC spans but never a db span.


        Register the hook on main_context_manager with

        append_on_engine_create(). It runs when enginefacade creates the

        engine, on the first database access, so it reads [profiler] after

        the service has parsed its configuration. It does not import

        cinder.service for the [profiler] options as configure() did: in a

        process that parsed its arguments without importing it, that import

        registers command line options and fails the first database access.

        Such a process has not set up osprofiler, so the hook does nothing

        when the options are not registered. configure() keeps only the

        database configuration.


        Assisted-By: Claude Opus 5.5 <noreply@anthropic.com>

        Change-Id: I7dff6d554c2449e151264c8e2e5770226322ff42

        Signed-off-by: Simon Zhou <td@fivetime.ltd>

        '
