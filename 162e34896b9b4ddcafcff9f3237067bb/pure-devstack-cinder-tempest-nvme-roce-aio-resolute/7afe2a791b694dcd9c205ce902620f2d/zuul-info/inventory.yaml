      buildset: 162e34896b9b4ddcafcff9f3237067bb
      change: '1006839'
      change_message: 'Exempt volume transfer from the deployment-wide counter


        A transfer moves a volume, and optionally its snapshots, from one

        project to another without changing the total capacity the deployment

        has provisioned.  accept() reserves +size for the acceptor and -size

        for the donor as two separate QUOTAS.reserve calls in separate

        transactions, with the donor call best-effort inside a bare except.

        Left as they are, the acceptor''s positive reservation would be refused

        at the deployment ceiling although nothing is being added, and the

        donor''s negative one would then lower the aggregate for capacity that

        never left.


        Switch both sides in accept() and in _handle_snapshot_quota to

        QuotaEngine.reserve_net_zero, which performs exactly the per-project

        work of reserve() but neither checks nor maintains the deployment-wide

        aggregate counter.  Pairing the two deltas into a single transaction

        would have meant restructuring transfer, which is out of scope.


        This is the one place where the "the hook lives only in QuotaEngine"

        rule is relaxed.  No behaviour changes while enforcement is dark; with

        a ceiling configured, cross-project transfers keep succeeding at the

        ceiling, which the tempest coverage asserts.


        Implements: blueprint deployment-aggregate-quota

        Assisted-By: Claude Code claude-fable-5-1

        Change-Id: I9cdbbb9fe50b319dfa7aed37d875c3aa13a8ee50

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
