      buildset: 31be1311c14c4e49931f083650269baf
      change: '1004868'
      change_message: "NetApp ONTAP: re-raise perf counter NaApiError\n\nWith the
        NetApp ONTAP REST client (netapp_use_legacy_client=false),\nget_performance_counter_info()
        in client_cmode_rest.py catches\nNaApiError and re-raises it as cinder.exception.NotFound.
        The intended\nfallback in perf_cmode._init_counter_info() only catches NaApiError,
        and\nNotFound is not a subclass of it, so the fallback cannot catch the\ntranslated
        exception and do_setup() fails.\n\nThis fires whenever the performance counter
        lookup returns no usable\ndata (for example when the system:constituent counter
        table is\nunavailable for the configured account or ONTAP version). The ZAPI\nclient
        raises NaApiError from the equivalent path, where the same\nfallback catches
        it and sets a default base counter, so ZAPI\ninitializes while REST does not.\n\nRe-raise
        the original NaApiError instead of translating it, so the\nexisting perf_cmode
        fallback handles the REST and ZAPI paths\nconsistently and driver initialization
        can continue. No caller relies on\nreceiving NotFound from this method.\n\nA
        stalled change [1] for a related bug [2] instead widens the fallback\nlayer
        to also catch NotFound; that accommodates the wrong exception type\nat the
        caller and risks regressing the ZAPI path. Fixing the exception\ntype at the
        source is cleaner and keeps both clients aligned.\n\n[1] https://review.opendev.org/c/openstack/cinder/+/939230\n[2]
        https://bugs.launchpad.net/cinder/bug/2080945\n\nTest Plan:\nPASS - New unit
        test in test_client_cmode_rest.py: a NaApiError from the\n       counter lookup
        propagates out of get_performance_counter_info as\n       NaApiError (not
        NotFound).\nPASS - Existing get_performance_counter_info tests (happy path
        and\n       not-found-rows) still pass.\n\nCloses-Bug: #2166908\nSigned-off-by:
        settkepa <SridharKumar.Ettkepalli@windriver.com>\nChange-Id: I3c91c299efda3245a7d43419d702d227747eb857\n"
      change_url: https://review.opendev.org/c/openstack/cinder/+/1004868
