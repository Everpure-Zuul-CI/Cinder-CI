      buildset: 8775feebf3074e098b3d6721375955a9
      change: '985643'
      change_message: "rbd: diagnose EC/data-pool misconfiguration on EPERM\n\nWhen
        an operator deploys Cinder against a Ceph cluster that uses an\nerasure-coded
        data pool, volume creation through the new direct-to-RBD\npaths introduced
        by Idf287cff17c66988066a6450dee1ba0eb0dcdf04,\nIf7a72a4acd5600de1350289a9d9c38017d42659e,
        and\nIb5e15eeee6a02e2833d14ac34f6fdeb4a6548a67 fails with a cryptic\n\"Operation
        not permitted\" if either rbd_default_data_pool is not set\nin the client
        ceph.conf, or the client ceph auth caps do not cover the\ndata pool.\n\nThis
        change:\n\n* Caches rbd_default_data_pool and the EC-ness of the configured\n
        \ metadata pool at driver setup time, and warns early when the\n  combination
        looks inconsistent.\n* Recognizes both global and pool-restricted write-capable
        Ceph caps\n  without treating an unknown caps query as a confirmed failure.\n*
        Catches ProcessExecutionError EPERM from qemu-img / rbd import in\n  the three
        direct-to-RBD paths (empty encrypted volume,\n  non-encrypted image copy,
        and encrypted image upload) and appends\n  an operator-friendly hint pointing
        at the most likely cause, using\n  only cached state (no extra mon round-trip
        on the create hot path).\n* Adds unit coverage for the pre-flight diagnostics,
        capability\n  parsing, EPERM detection, and direct-to-RBD error paths.\n\nDiagnostics
        are fail-open: any failure in the pre-flight is swallowed\nso it can never
        prevent the driver from starting.\n\nChange-Id: Ic5152485135efec71a69f16ac75310170e7573e0\nSigned-off-by:
        Rico Lin <rlin@vexxhost.com>\nAssisted-By: Claude <noreply@anthropic.com>\nAssisted-By:
        Codex <noreply@openai.com>\n"
