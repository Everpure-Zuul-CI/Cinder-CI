      change_message: 'Everpure: asynchronous replication for pod pools


        Allow async replicated types in pod pools. A protection group only

        accepts members from its own pod, so each pool pod gets its own

        replication group, pod::<pure_replication_pg_name>, with the array

        group''s targets, schedule and retention. Failover promotes volumes from

        the array group and every pod group; the pod must exist on the target,

        which setup checks, and the driver never creates it there. Sync and

        trisync types stay refused.


        Implements: blueprint flasharray-pod-pools


