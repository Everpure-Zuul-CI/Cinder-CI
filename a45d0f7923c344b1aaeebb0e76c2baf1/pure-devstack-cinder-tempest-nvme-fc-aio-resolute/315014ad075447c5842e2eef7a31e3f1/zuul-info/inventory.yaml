      build: 315014ad075447c5842e2eef7a31e3f1
      buildset: a45d0f7923c344b1aaeebb0e76c2baf1
      change: '1007032'
      change_message: "Everpure: per-group replication schedules for CGs\n\nEvery
        protection group created for a replicated consistency group used\nthe backend-wide
        pure_replica_interval_default and inherited the array's\ndefault retention
        policy. Operators with groups of differing recovery\npoint objectives had
        to retune each protection group by hand on the\narray.\n\nAdd four optional
        group specs that are read from the group's group type\nwhen its protection
        group is created:\n\n  flasharray:replication_interval        (seconds)\n
        \ flasharray:retention_short_term        (seconds)\n  flasharray:retention_long_term_per_day\n
        \ flasharray:retention_long_term         (days)\n\nEach falls back to the
        matching pure_replica_* option. Retention is\nopt-in: a retention policy is
        only applied when at least one retention\ngroup spec is present, so existing
        group types keep today's behaviour.\n\nThe schedules come from the group type
        rather than a volume type\nbecause the group has no member volumes when its
        protection group is\ncreated, and a group has exactly one group type. They
        are applied once,\nat creation, and never re-applied, so a storage administrator
        remains\nfree to retune a protection group on the array without the driver\nundoing
        it.\n\nAn interval outside the 5 minute to 400 day range the array accepts
        is\nrejected before the protection group is created, and a value that is\nnot
        an integer is logged and ignored in favour of the default. The\nschedule and
        the retention policy are sent in separate PATCH requests\nbecause Purity rejects
        the two in a single request.\n\nAssisted-By: Claude Code claude-fable-5-1\nChange-Id:
        Ia21e64bcef7c829b51c37fcca517b5f32e2d15e1\nSigned-off-by: Simon Dodsley <simon@purestorage.com>\n"
