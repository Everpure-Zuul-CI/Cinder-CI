      change: '1002961'
      change_message: 'RBD: add Changed Block Tracking backup support


        Implement create_cbt_snapshot(), get_cbt_extents() and

        delete_cbt_snapshot() for the Ceph RBD driver on top of librbd''s

        diff_iterate(), so incremental backups to the chunked backup drivers

        ship only changed blocks and the first full backup is sparse, instead of

        scanning and SHA256-hashing the whole volume.


        get_cbt_extents() diffs two existing snapshots and creates nothing.  It

        pushes the requested window into diff_iterate(), consolidates adjacent

        extents, and returns a page via volume_utils.window_cbt_page rather than

        truncating.  from_snapshot=None yields the allocation map a full backup

        needs, and any failure returns None so the backup falls back to a full

        scan.


        Only regions to ship are reported, always exists=True.  An incremental

        diff keeps the regions librbd reports with exists=0 -- guest

        fstrim/discards -- because dropping them would leave the parent''s stale

        data in place on restore; in the allocation map the same flag marks a

        never-written hole and is omitted.  Snapshot identifiers are RBD snap

        names, and ordinary snapshots now expose theirs via provider_id, so

        os-list_changed_blocks can diff any two snapshots.


        In-use volumes reach this path only through the backup''s temporary

        snapshot, which the framework adopts as the reference point, so the

        driver returns True from backup_use_temp_snapshot().  That needs the

        snapshot export support added by

        https://review.opendev.org/c/openstack/cinder/+/1004171.


        Assisted-By: Claude Opus 5

        Depends-On: https://review.opendev.org/c/openstack/cinder/+/990923

        Depends-On: https://review.opendev.org/c/openstack/cinder/+/1004171

        Depends-On: https://review.opendev.org/c/openstack/cinder/+/1013936

        Signed-off-by: hongp <inyong.hong@samsung.com>

        Change-Id: I3fb5b39dfa6713203804728442380ac9fb93963e

        '
