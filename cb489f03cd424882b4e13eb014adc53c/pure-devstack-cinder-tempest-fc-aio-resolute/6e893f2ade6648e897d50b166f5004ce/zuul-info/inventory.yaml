      change_message: "Add iSCSI export support to the StorPool driver\n\nAdd four
        new driver options:\n- storpool_iscsi_cinder_volume: use StorPool iSCSI attachments
        whenever\n  the cinder-volume service needs to attach a volume to the controller,\n
        \ e.g. for copying an image to a volume or vice versa\n- storpool_iscsi_export_to:\n
        \ - an empty string to use the StorPool native protocol for exporting\n    volumes\n
        \ - the string \"*\" to always use iSCSI for exporting volumes\n  - an experimental,
        not fully supported list of IQN patterns to export\n    volumes to using iSCSI;
        this results in a Cinder driver that exports\n    different volumes using
        different storage protocols\n- storpool_iscsi_portal_group: the name of the
        iSCSI portal group\n  defined in the StorPool configuration to use for these
        export\n- storpool_iscsi_learn_initiator_iqns: automatically create StorPool\n
        \ configuration records for an initiator when a volume is first exported\n
        \ to it\n\nWhen exporting volumes via iSCSI, report the storage protocol as\n\"iSCSI\".\n\nChange-Id:
