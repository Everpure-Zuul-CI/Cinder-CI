      build: b9236250a4464c078d8a522280a97671
      buildset: 636cdc5b1689433e906a429f4cf3a95c
      change: '995189'
      change_message: 'RBD: Add generic volume group support (1/2)


        The RBD driver does not implement the generic volume group driver

        interface, so create_group, delete_group and update_group on an

        RBD-backed group type fall back to Cinder''s generic, DB-only group

        handling: member volumes are tracked in the database but never

        organized into an actual RBD group.


        Implement create_group, delete_group and update_group using

        librbd''s Group API (RBD.group_create/group_remove, Group.add_image/

        remove_image). Add newly created volumes to their group at creation

        time in create_cloned_volume, create_volume and

        create_volume_from_snapshot, so a volume created with group_id set

        is already a member of the backend group.


        This is the first of two patches; group snapshot support follows.


        AI-modified files:

        - cinder/volume/drivers/rbd.py

        - cinder/tests/unit/volume/drivers/test_rbd.py

        - releasenotes/notes/rbd-generic-volume-group-a6053c802fbb7300.yaml


        Partial-Implements: blueprint replication-v3

        Generated-By: Claude Code / claude-sonnet-4-5 (claude.ai/code)


        Change-Id: Ifa44c5fc455dbbb148a18e281d07b2c1bd3ba8bd

        Signed-off-by: Rajat Dhasmana <rajatdhasmana@gmail.com>

        Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>

        '
