      change_message: 'Cleanup unused only_quotas path in quota_destroy_all_by_project


        Remove the unused only_quotas=False path from

        quota_destroy_all_by_project, per Stephen Finucane''s TODO.


        Additionally, after this change, quota_destroy_all_by_project and

        quota_destroy_by_project do exactly the same thing, making the

        "destroy_all" name misleading. Therefore, the logic was moved into

        quota_destroy_by_project (which is already used by the API), and

        quota_destroy_all_by_project was entirely removed.


        The redundant test test_quota_destroy_sqlalchemy_all_by_project_

        was also deleted, as it became an exact copy of

        test_quota_destroy_by_project.


        Change-Id: I1089ba70f84d587a4b69c34ba0f7808f81219867

        Signed-off-by: Eduardo-Morais <eduardo.henrique.lima.morais@gmail.com>

