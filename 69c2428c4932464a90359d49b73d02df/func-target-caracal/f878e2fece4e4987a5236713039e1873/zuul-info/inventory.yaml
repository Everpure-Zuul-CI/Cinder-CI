      change: '1014445'
      change_message: 'Drop allowed_direct_url_schemes from the backend section


        The charm has emitted allowed_direct_url_schemes = cinder into the

        backend section of cinder.conf since ee5c5d9, but cinder only reads

        that option from [DEFAULT], so the setting never had any effect. This

        charm sends only its own backend section through the cinder-backend

        interface and does not set [DEFAULT] options; operators who want

        Glance cinder-store images cloned instead of copied set it on the

        cinder charm, so document that and stop sending the dead option. The

        functional propagation test now checks volume_backend_name instead.


        Related-Bug: #1957848

        Assisted-By: Claude Code claude-fable-5-1

        Change-Id: Ic1a9ac66236df9bc07c7db23e9392aeed913281a

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
