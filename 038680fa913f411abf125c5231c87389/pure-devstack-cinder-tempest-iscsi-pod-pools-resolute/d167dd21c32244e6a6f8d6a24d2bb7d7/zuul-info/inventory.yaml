      change: '1009515'
      change_message: 'Everpure: report FlashArray pods as Cinder pools


        Purity//FA 6.4.3 (REST 2.23) lets a pod carry a quota on the provisioned

        size of the volumes inside it, enforced by the array on create, resize,

        copy and recovery. A new list option, pure_pod_pools, names pre-existing

        pods to expose as additional Cinder pools next to the array pool: each

        pod''s quota is reported as the pool''s total capacity and its used

        provisioned space as the provisioned capacity, as a thin pool with a

        fixed oversubscription ratio of 1.0 and no reserve, so the scheduler

        refuses exactly the placements the array would refuse and the array

        backs it up. One extra GET /pods per stats cycle covers every pod.


        The driver never creates pods or sets quotas. At setup each pod must

        exist with a quota and be neither stretched nor replica-linked (volumes

        cannot be moved into or out of such pods), and the array must offer

        REST 2.23; array-wide default protection is reported with a warning,

        because volumes it protects cannot later be moved into a pod. A pod

        that loses its quota, or is destroyed, is still reported, with zero

        capacity, so its volumes keep a pool for extend and retype while nothing

        new is placed there.


        A volume scheduled on a pod pool is created as pod::name; a volume

        group type places its group inside the pod (pod::group/name). Snapshots

        follow the volume name. A replicated volume type on a pod pool is

        refused, and a retype that changes the pool returns (False, None) so

        Cinder copies the volume rather than reporting a move that did not

        happen; both are refined by later changes in this series. A quota

        rejection names the pod in the error.


        Without the option the driver reports the single pool it reports today,

        with the same name, numbers and behaviour.


        Partial-Implements: blueprint flasharray-pod-pools


        Assisted-By: Claude Code claude-fable-5-1

        Change-Id: Ia34935d866fea2b962ad0dd9f9da64570a586487

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
