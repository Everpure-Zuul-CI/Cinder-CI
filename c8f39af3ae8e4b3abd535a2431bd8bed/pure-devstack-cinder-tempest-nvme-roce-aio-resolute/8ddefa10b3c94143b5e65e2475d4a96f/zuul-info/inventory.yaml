      build: 8ddefa10b3c94143b5e65e2475d4a96f
      buildset: c8f39af3ae8e4b3abd535a2431bd8bed
      change: '960686'
      change_message: 'Accept both "system uuid" and "system_uuid" connector keys


        os-brick is renaming the connector properties key "system uuid" to

        "system_uuid" to drop the non-conventional space. The connector

        dictionary is built by os-brick on the compute node, so during a

        rolling upgrade Cinder receives the legacy key from computes that

        still run an older os-brick and the new key from upgraded ones. It

        has to accept both for as long as mixed versions are in service.


        Add volume_utils.get_connector_system_uuid(), which returns the value

        under either spelling, and use it in the three drivers that read the

        key: Pure Storage, RSD and Infinidat. Infinidat used to compare the

        connector key by key, so an attachment recorded under one spelling

        never matched a detach carrying the other and the multiattach check

        only held up through the wwpns/initiator fallback. It now compares

        the normalised value on both sides.


        Unit tests exercise both spellings for the helper and for each

        driver, plus the no-uuid fallback in the Pure driver.


        This change is safe against either os-brick version and must merge

        before the os-brick rename, which carries a Depends-On for it:

        https://review.opendev.org/960205


        Assisted-By: Claude Code claude-fable-5-1

        Change-Id: I7b2242eaf018506a6cd65d0dbfccb8c15ee6b79a

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
