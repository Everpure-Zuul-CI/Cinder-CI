      change: '1014439'
      change_message: 'image_utils: use concurrency-aware tpool wrapping


        Replace direct eventlet tpool use with utils.tpool_wrap. The helper

        retains tpool behavior when running with eventlet and returns callable

        and file objects unchanged with native threads.


        Annotate _verify_image()''s file as typing.BinaryIO, which is what

        open(path, ''rb'') returns, now that tpool_wrap() passes its argument

        types through to mypy.


        Test that the helper ignores autowrap with native threads, and update

        the image_utils tests to verify the wrapped objects passed to Glance.


        Assisted-By: OpenCode claude-opus-4.6

