      change: '1006358'
      change_message: 'Fix missing volume delete notifications on group delete


        When deleting a group with the delete-volumes flag set to True,

        the volumes associated with the group are deleted, but the

        ''volume.delete.end'' notifications are not emitted. This occurs

        because the group delete flow in the manager does not trigger

        the standard notification logic used in individual volume deletes.


        This patch ensures that ''volume.delete.start'' and

        ''volume.delete.end'' notifications are correctly sent for each

        volume processed during a group deletion.


        Closes-Bug: #2139068

        Change-Id: I2abff84798f54f207ce53ab5afedf41e26348648

        Signed-off-by: hongp <inyong.hong@samsung.com>

        (cherry picked from commit cb63d6f58c6d01fc249e5f77b7f71f9098b315a8)

        (cherry picked from commit 429a763449c46e693fe60b95f73022273f1f77d0)

        '
