      change: '1006841'
      change_message: "Enforce deployment_max_gigabytes\n\nPass the configured deployment_max_gigabytes
        down to quota_reserve\ninstead of the fixed -1 the previous changes used.
        \ This is the only\nchange in the series that alters behaviour for a configured
        deployment:\nwith the option left at its default of -1 nothing is refused
        and the\ncounter is merely maintained, as before.  With a non-negative value,
        a\nvolume create, extend, snapshot create, clone or manage whose gigabytes\ndelta
        would push the deployment-wide total past the ceiling is refused\nwith HTTP
        413 and DeploymentQuotaExceeded.  Deletes and transfers keep\nsucceeding at
        the ceiling.\n\nBecause DeploymentQuotaExceeded is raised from the DB layer
        and is not\nan OverQuota, no 'except OverQuota' handler needed to change.
        \ Every\npositive-delta QUOTAS.reserve caller was audited for how the new\nexception
        surfaces:\n\n- The API create flow, snapshot create, backup create, groups,
        retype\n  and manage_existing_snapshot route OverQuota through\n  process_reserve_over_quota;
        the new exception bypasses that translator\n  and propagates out of the taskflow
        engine exactly as the translated\n  per-project errors do today.  manage_existing
        reuses the create flow's\n  QuotaReserveTask.\n\n- volume/api.py extend has
        its own OverQuota handler that would have\n  mislabelled a marker as a tenant
        quota error with per-project figures;\n  the direct raise avoids that, and
        its finally clause already rolls the\n  volume status back whenever no reservation
        was obtained.\n\n- The image-volume cache clone in volume/manager.py reserves
        with no\n  quota handler at all, but its caller catches CinderException, logs
        a\n  warning and skips the cache entry, so a refusal there degrades to \"no\n
        \ cache entry\" rather than an error for the user.\n\n- Retype reserves only
        the per-type resources, so it never touches the\n  base gigabytes counter
        and cannot be refused by the ceiling.\n\nEnable the option only after every
        service has been upgraded and\n'cinder-manage quota deployment_sync' has been
        run, because services\nstill running the old code do not maintain the counter.\n\nImplements:
        blueprint deployment-aggregate-quota\nAssisted-By: Claude Code claude-fable-5-1\nChange-Id:
        Ia14306508c81396253d56f2ed42ee325053f9ea9\nSigned-off-by: Simon Dodsley <simon@purestorage.com>\n"
      change_url: https://review.opendev.org/c/openstack/cinder/+/1006841
