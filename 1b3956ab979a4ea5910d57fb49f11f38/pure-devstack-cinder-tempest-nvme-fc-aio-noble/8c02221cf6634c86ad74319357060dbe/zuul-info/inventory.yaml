      buildset: 1b3956ab979a4ea5910d57fb49f11f38
      change: '967734'
      change_message: "fix: netapp file copy between volumes\n\n1. This patch strips
        the leading slash from the volume name.\n   Otherwise the _get_volume_by_args
        call would fail because the Netapp API\n   only allows volumes with letter
        or underscores as first character\n   (NetApp API 917887)\n\n2. The 'path'
        parameter should only contain the \"/filename\".\n   Previously the path was
        recognized like: 'netapp-volume-name/filename',\n   which got interpreted
        as foldername/file -> leading to not existing\n   paths.\n\n3. Per default
        RestClient.send_request already evaluates the HTTP 202\n   (Accepted)responses
        (wait_on_accepted=True) and returns the job\n   object.\n   Therefore the
        previous return of \"result['job']['uuid']\" raised a\n   KeyError.\n\n4.
        Set the provider location when using the restclient and not the\n   copyoffload
        tool. Otherwise the _register_image_in_cache will fail.\n\n5. use /private/cli/file/copy
        api to check copy status. The REST\n   /cluster/jobs/{job_uuid} endpoint immediately
        returns the state\n   \"success\" which does not reflect the actual file copy
        progress.\n   See netapp case #2010582439 [1][2]\n\n[1] https://kb.netapp.com/on-prem/ontap/Ontap_OS/FS_Issues/CONTAP-99205\n[2]
        https://review.opendev.org/c/openstack/cinder/+/967734/comments/d0fe3efc_cfc3f8ea\n\nFixes
        LP Bug: #2131955\nChange-Id: I9b9728e938a32b1700d40c88b2f08198765f15f5\nSigned-off-by:
        Max Lamprecht <max.lamprecht@stackit.cloud>\nSigned-off-by: Max Lamprecht
        <max.lamprecht@digits.schwarz>\n"
