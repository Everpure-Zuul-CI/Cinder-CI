      change: '989836'
      change_message: "Implement graceful shutdown for Cinder services\n\nAdd a three-phase
        graceful shutdown for cinder-volume and cinder-backup\nso that in-flight volume
        and backup operations finish before the process\nexits, instead of being aborted
        mid-operation when a pod is terminated\n(e.g. during a Kubernetes rolling
        update).\n\nOn SIGTERM/SIGINT/SIGHUP the service now:\n - Phase 0: deregisters
        from RPC and stops consuming messages, while the\n   process keeps answering
        existing connections. SIG_IGN is installed for\n   the termination signals
        so a second signal from the supervisor (for\n   example the systemd KillMode=mixed
        pair, or an upgrade-tools\n   SIGTERM-then-SIGTERM to the child) cannot kill
        the child while it is\n   still draining.\n - Phase 1: stops the RPC servers
        (drain) - MessageHandlingServer.stop()\n   joins the listener but leaves the
        work executor running, so in-flight\n   handler greenthreads keep running.\n
        - Phase 2: waits for the in-flight handlers to complete under a single\n   total
        deadline (graceful_shutdown_timeout) shared across the RPC\n   executor, the
        greenthread pools, and the driver cleanup thread.\n - Phase 3: cleans up (threadpool,
        coordination backends, service\n   record) before exiting.\n\nComponents:\n
        - signal handling and the three-phase shutdown in Service/ServiceGroup,\n
        \  with per-service timeout resolution and a ProcessLauncher that keeps\n
        \  supervising the worker until the supervisor's grace period expires.\n -
        shutdown-aware thread pools: _add_to_threadpool() rejects new work\n   once
        shutdown has been signaled, and the pools are drained before the\n   process
        exits.\n - reject_if_draining() on the volume RPC entry points: while draining,\n
        \  new create/attach/detach calls fail fast with ServiceUnavailable so\n   the
        request is retried on a healthy instance instead of being accepted\n   and
        then silently dropped.\n - do_cleanup freshness check during init_host (skip
        fresh entries) so a\n   new service instance does not reset resources still
        being processed\n   by a draining instance.\n - Backup restore heartbeat (prevents
        BackupRestoreCancel).\n - If the drain deadline expires with operations still
        running, the\n   service keeps waiting (logs each interval) rather than tearing
        down\n   underneath them; the supervisor terminates it when the grace period\n
        \  elapses.\n\nUnit tests cover the drain loop (TestGracefulShutdown - real
        GreenPool,\ndeadline timeout, forced exit, signal handler, drain counter),
        the\nshutdown-aware pools (ThreadPoolManager/SizedThreadPoolManager\nshutdown
        tests), reject_if_draining, and the backup/graceful-shutdown\nRPC entry points.\n\nCloses-Bug:
        #2000001\nChange-Id: Icdd28affc73fd34491b656a68410dce8e46264d4\nSigned-off-by:
        Walter Boring <waboring@hemna.com>\n"
