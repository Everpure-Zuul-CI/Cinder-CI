        auto: true
        conf: true
        localrc: true
        log: true
        stackenv: true
        yaml: true
        yml: true
      external_bridge_mtu: 1500
      nodepool:
        az: nova
        cloud: kolla-admin
        external_id: e6769d6a-187c-445a-9fb6-7c51b5a49b7f
        host_id: 99f8d44760dec060f0d7188c1d1c9cd2ee71502d28a8d7556a883647
