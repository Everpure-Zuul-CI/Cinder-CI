      change_message: 'backup-perf: drop the tempest test-config block from local.conf


        The first run of pure-devstack-cinder-backup-perf-iscsi-noble died seven

        minutes into stack.sh: pure-setup emits a [[test-config|/]]

        block for the tempest jobs, and with tempest disabled that variable is

        empty, so devstack tried to create a config file at / and stopped.


        Filter the test-config key out of devstack_local_conf before

        write-devstack-local-conf runs.  Nothing in this job reads it.


        Co-Authored-By: Claude Fable 5.1 <noreply@anthropic.com>

        Change-Id: I537fe4fc0e46e4e19c52000d89f5c503593ed3bb

