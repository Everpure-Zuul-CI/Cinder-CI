      branch: master
      build: 4ba21162e88a4831b202475c93e34542
      buildset: 2069ce67be7d445eadc8f79693e059fe
      change: '1007256'
      change_message: 'Everpure: add assisted migration peers to config


        Accept "assisted" as a replication_device type in the FlashArray

        driver. Such an entry names a peer array for storage-assisted volume

        migration, which a following change implements, and is not a

        replication target. It is kept out of every replication collection so

        that no protection group, pod or failover handling ever sees it, and

        replication is only reported as enabled when a sync, async or trisync

        entry exists. Today the driver does not validate the type value at

        all, so an unrecognised type is silently treated as an async target

        and gets a protection group.


        Each peer is checked once at start-up for a Purity release with volume

        send and for a connected array connection from the local array. Both

        problems are logged rather than raised, because the peer can be fixed

        without a cinder-volume restart and the migration path re-checks the

        connection anyway.


        The driver also publishes its Purity array ID in its stats under

        pure_array_id. A source backend has no view of another backend''s

        configuration, so this is how it will confirm that a migration

        destination host really fronts one of its configured peers.


        Partially-Implements: blueprint flasharray-assisted-migration


        Assisted-By: Claude Code claude-fable-5-1

        Change-Id: I539fa709eb9e2414ebfd824758f038e6a351dd37

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
