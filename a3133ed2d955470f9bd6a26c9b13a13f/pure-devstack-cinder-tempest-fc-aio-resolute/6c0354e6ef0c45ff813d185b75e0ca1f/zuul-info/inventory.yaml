      build: 6c0354e6ef0c45ff813d185b75e0ca1f
      buildset: a3133ed2d955470f9bd6a26c9b13a13f
      change: '1009935'
      change_message: 'Fix evaluator for pyparsing 3.3.3


        pyparsing 3.3.3 replaced the recursive implementation of

        infix_notation with a shunting-yard parser, in which unary operators

        with OpAssoc.RIGHT are now treated as generic prefix operators. The

        evaluator grammar defined "fn = Word(alphas + ''_'' + ''.'')" as such an

        operator to implement function calls, which now makes pyparsing

        capture any bare identifier as a function applied to the rest of the

        expression: dotted variable references such as stats.free_capacity_gb

        or capabilities.foo, as well as the NOT keyword, can no longer be

        substituted, breaking the DriverFilter and GoodnessWeigher, and

        failing 14 unit tests.


        Restrict the fn operator to the only functions that the evaluator

        implements (abs, max, min): any other name was already failing with a

        KeyError at evaluation time, so this only affects the error path. The

        parser now behaves identically with pyparsing 3.0.9, 3.1.2 and 3.3.3.


        The same fix was applied to Manila:

        https://review.opendev.org/c/openstack/manila/+/1009926


        See also:

        Debian-Bug: https://bugs.debian.org/1150443


        Assisted-By: Infomaniak Euria-Code

        Change-Id: If602af768e64824e4c3aee358d838bea2d3fbd2b

        Signed-off-by: Thomas Goirand <zigo@debian.org>

        '
