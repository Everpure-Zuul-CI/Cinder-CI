      change: '1004806'
      change_message: "NetApp ONTAP: skip SVM tunnel header for SVM users\n\nWith
        the NetApp ONTAP REST client (netapp_use_legacy_client=false),\nsend_request()
        enables tunneling by default and _build_headers() adds\nthe X-Dot-SVM-Name
        header. For an SVM-scoped (Vserver) account -- the\nnormal Cinder configuration
        on an SVM data LIF -- the session is already\nbound to an SVM context, so
        ONTAP rejects any request carrying this\nheader with error 2621712 (\"Cannot
        set the svm context ... while in an\nexisting svm context\"). do_setup() issues
        such requests, so the driver\nfails to initialize and the backend never comes
        up.\n\nSuppress the header for SVM-scoped accounts. The account scope is\ndetected
        once during client init (single-threaded, before any tunneled\nrequest) via
        GET /api/security/accounts, which reports scope as \"svm\" or\n\"cluster\";
        _build_headers() then only reads the cached result. Detection\nis best-effort
        and defaults to cluster-scoped (header sent, as today)\nwhen it cannot be
        determined -- for example a certificate-auth client\nwith no username, or
        an SVM-scoped role not permitted to read\n/api/security/accounts. In that
        case invoke_successfully() reacts to the\nresulting 2621712 rejection, caches
        the account as SVM-scoped, and\nretries the request once without the header.
        Cluster-scoped behaviour,\nthe ZAPI client, and the request auth path are
        unchanged.\n\nTest Plan:\nPASS - Unit tests (NetAppRestApiServerTests): scope
        svm/cluster; a\n       cluster-scoped account on a single-SVM cluster and
        a name that\n       matches mixed svm+cluster records are both classified\n
        \      cluster-scoped; no-username, unreadable, and unparseable probe\n       responses
        fall back to cluster-scoped without raising; the\n       tunneling header
        is sent for cluster-scoped and suppressed for\n       SVM-scoped; _build_headers
        performs no I/O.\nPASS - Unit test: a request rejected with error 2621712
        (int or string\n       code) while carrying X-Dot-SVM-Name caches the account
        as\n       SVM-scoped and is retried once without the header; a retry that\n
        \      still fails re-raises NaApiError.\nPASS - Validated live on an SVM-scoped
        NetApp ONTAP 9.15.1 REST backend\n       (iSCSI and NFS): do_setup() completes
        and volume operations\n       succeed with no 2621712. This exercised the
        security/accounts\n       detection path (the account was classified up front);
        the\n       reactive 2621712 retry is covered by unit tests.\n\nCloses-Bug:
        #2166532\nSigned-off-by: settkepa <SridharKumar.Ettkepalli@windriver.com>\nChange-Id:
        I3b65e9cee24df32d85121283f52158b774716d91\n"
