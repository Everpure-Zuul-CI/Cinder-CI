      change: '1009517'
      change_message: 'Everpure: move volumes between pools on the array


        Pools of one backend are pods of one array, so a volume can change pool

        with a single rename on the array instead of a host-side copy. The

        volume manager calls driver.retype() for a same-backend retype even

        when only the pool differs, and offers driver.migrate_volume() for a

        detached volume whose destination differs only in the pool; both now

        move the volume with PATCH /volumes (pod=...), removing it from any

        protection group first, and return the new provider_id.


        The array cannot move everything in place: a volume group member, a

        replicated volume, or a volume the array refuses to move (SafeMode

        protected volumes may only move into another SafeMode container) are

        handed back to Cinder''s generic migration with (False, None). A pod

        quota rejection is raised, because the copy would fail the same way.

        A retype into a pod pool with a replicated target type is refused.


        migrate_volume only handles a destination on this backend; any other

        destination returns (False, None), which leaves inter-array migration

        to its own implementation. The driver support matrix now lists

        storage-assisted volume migration as complete for the FlashArray.


        Partial-Implements: blueprint flasharray-pod-pools


        Assisted-By: Claude Code claude-fable-5-1

        Change-Id: I1379298cc8c3609110dc9873d22eaaf97af8b851

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
