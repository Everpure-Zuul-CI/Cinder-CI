      change_message: 'HPE AlletraMP : Feature Automate Failback cinder replication
        recovery


        Enabled Feature support - Automate Failback cinder replication recovery


        1. Enhanced failback logic to restore the natural replication direction more
        reliably.


        2. Added idempotency checks to avoid reprocessing volumes/groups already in
        the expected failed-over/failback state.


        3. Added failover target-aware handling in the failover path.


        4. Tightened role-aware decision-making for active-active and non-active-active
        replication flows.


        Closes-Bug: #2167916

        Change-Id: I6ca4c6335059fd2e921297598e94640348266d94

