      branch: master
      build: a48e22fe7cd44e56879e08e7590a2332
      buildset: 8eef65b8f1cd4040a9191f866374c03a
      change: '559'
      change_message: 'backup-perf: grant the S3 user a policy and fail fast on a
        dead c-bak


        The third run reached the harness and then lost all three cells the same

        way: every c-bak restart died in driver init with AccessDenied on

        ListBuckets, backend_state never became True, and each backup create was

        rejected with "Service not found for creating backup".  The harness

        mints the FlashBlade object-store user but never attached an access

        policy to it, and a FlashBlade user has no S3 permissions at all until

        one is.  Attach pure:policy/full-access, scoped to the throwaway account.


        The harness also hid this for 37 minutes.  It waited for cinder''s

        "Backup driver was successfully initialized." line, which never appears:

        the LoopingCallDone that would log it is swallowed inside oslo.service,

        so the check always warned and carried on, then spent six retries per

        cell on a c-bak that could not recover (a failed init loop is never

        re-run).  Replace it with the signal the scheduler actually acts on, its

        own debug line "Received backup service update ... ''backend_state'':

        True" after the restart, and fail immediately on the init-failure lines

        in the c-bak journal.  On any failure the journal from the restart

        onward is saved (keys redacted) and its tail printed inline, and the

        first failed cell aborts the matrix so the logs are available at once.

        --continue-on-failure restores the keep-going behaviour.


        Co-Authored-By: Claude Fable 5.1 <noreply@anthropic.com>

        Change-Id: I7d89917f6f4324a5f2c5f84b2cd05108fd9e22f5

        '
