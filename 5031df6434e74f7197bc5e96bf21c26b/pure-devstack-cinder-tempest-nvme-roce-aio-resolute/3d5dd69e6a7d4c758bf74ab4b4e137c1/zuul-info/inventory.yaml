      change: '1006836'
      change_message: 'Resolve sentinel usage rows in reservation commit/rollback


        reservation_commit and reservation_rollback build their usage map with

        _get_quota_usages(context, project_id, ...) and then index it by

        reservation.usage_id.  A reservation owned by the deployment-wide

        aggregate quota sentinel is absent from that map, so the lookup raises

        KeyError inside the writer transaction.  Because QuotaEngine.commit and

        rollback swallow every exception, the visible effect would not be an

        error but a silent leak: the transaction rolls back and every

        reservation in the batch, the per-project ones included, keeps its

        reserved quantity until expiry.


        Group the reservations'' resources by project_id and lock the caller''s

        per-project rows first and the sentinel row last.  That is the global

        lock order for quota_usages, and every path that touches the sentinel

        must follow it or concurrent mixed operations deadlock.  The existing

        delta >= 0 asymmetry and the in_use clamp apply to the sentinel row

        unchanged: a negative delta never touches reserved and only lowers

        in_use at commit.


        This is a no-op until sentinel reservations exist, which is why it

        lands before the change that creates them.


        Implements: blueprint deployment-aggregate-quota

        Assisted-By: Claude Code claude-fable-5-1

        Change-Id: Iedb892896caab44269f1d108e4495906f432165d

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
