      build: 06834360ff2b4bac952db0605cad443c
      buildset: d1f6edbca0484a05974abb402edac4e0
      change: '990923'
      change_message: 'Add Changed Block Tracking (CBT) backup framework and changed-blocks
        API


        Add a framework that lets chunked backup drivers (Swift, S3, Google,

        NFS, Ceph, ...) ship only the blocks that changed since the previous

        backup, instead of scanning and SHA256-hashing the whole volume.


        Volume drivers opt in by overriding the new BaseVD.get_cbt_extents()

        (plus create_cbt_snapshot()/delete_cbt_snapshot() for reference-point

        management). Support is advertised over a new cinder-volume RPC API

        version 3.21. The backup manager establishes a reference point on full

        backups, asks the driver for the changed extents on incrementals, and

        instructs the chunked driver to back up only those extents.


        On a full backup the manager also asks the driver for the volume''s

        allocation map (a get_cbt_extents() diff with from_snapshot=None) so the

        full backup is itself sparse -- only written extents are shipped -- on

        backends that can report their written blocks. Backends that cannot

        answer a full diff return None and the full backup is a dense scan, as

        before; either way a reference point is recorded for the next

        incremental.


        get_cbt_extents() is side-effect-free: it diffs two snapshots that

        already exist, while snapshot creation/deletion is done explicitly via

        create_cbt_snapshot()/delete_cbt_snapshot(). The backup manager creates

        this backup''s reference point before diffing against the parent''s.


        The framework falls back transparently to the existing SHA-diff path

        when CBT is unsupported, and re-bootstraps a fresh reference point

        (one full scan) when a CBT chain''s reference snapshot has gone missing,

        so the chain recovers automatically. Restore is unchanged.


        Because get_cbt_extents() is side-effect-free, the same capability is

        also exposed directly to external backup tools via a new

        ''os-list_changed_blocks'' volume action (REST API microversion 3.72).

        It returns the changed block extents between two of a volume''s existing

        snapshots (omit the base snapshot for a full enumeration), with optional

        byte-window and marker/limit pagination, and a new

        volume:list_changed_blocks policy. Backends without CBT return a 409.


        Includes unit tests for the chunked driver, backup manager, volume

        manager, RPC API and the changed-blocks API, a contributor guide for

        vendor drivers, and release notes.


        Assisted-By: Claude (Opus 4.8)

        Change-Id: Ib8e4ca1f061e178f1e20df2c0ca1960ec2480251

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
