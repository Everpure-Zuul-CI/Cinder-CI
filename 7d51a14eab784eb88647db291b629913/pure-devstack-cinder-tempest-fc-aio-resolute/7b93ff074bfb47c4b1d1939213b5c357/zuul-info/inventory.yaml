      change: '1004875'
      change_message: "NetApp ONTAP REST: fix dropped SSC extra spec\n\nIn the NetApp
        ONTAP REST client, SSC_API_MAP['/storage/volumes'] is\nmissing a comma after
        'netapp_flexvol_encryption'. Python implicit\nstring-literal concatenation
        therefore joins it with the next entry into\n'netapp_flexvol_encryptionnetapp_dedup',
        so the list has two elements\ninstead of three and the netapp_flexvol_encryption
        SSC extra spec is\nsilently dropped. check_api_permissions() never recognizes
        or validates\nit, and no error is raised at init.\n\nAdd the missing comma
        so the list has three distinct elements and\nnetapp_flexvol_encryption is
        handled as intended.\n\nTest Plan:\nPASS - New unit test in test_client_cmode_rest.py
        asserts\n       SSC_API_MAP['/storage/volumes'] contains netapp_flexvol_encryption,\n
        \      netapp_dedup and netapp_compression as three distinct elements and\n
        \      that the concatenated 'netapp_flexvol_encryptionnetapp_dedup' is\n
        \      absent.\nPASS - Existing check_api_permissions tests still pass.\nPASS
        - Tempest and Rally cinder volume scenarios passed against an\n       SVM-scoped
        NetApp ONTAP 9.15.1 REST backend (iSCSI and NFS).\n\nCloses-Bug: #2166485\nSigned-off-by:
        settkepa <SridharKumar.Ettkepalli@windriver.com>\nChange-Id: I4bc105a4303391027120a6ff40fb578cb0abe0f3\n"
