      build: df6f7a700981455abcb7ee5dbd0e13b4
      buildset: d63144d1c7d34e07b8abc71e8e5cf0f3
      change: '1003582'
      change_message: 'Keep replicated volumes on the generic migration path


        Driver assisted migration moves a volume in place, but the driver is

        only handed the destination host by migrate_volume(); it is never told

        the target volume type. On success the manager then stamps the new

        volume_type_id onto the volume. A driver that moved a replicated volume

        without reconfiguring replication to match the target type would

        therefore leave the volume claiming a type it does not implement.


        _can_use_driver_migration() does reject a diff that changes the

        replication extra specs, but it deliberately ignores a change of

        volume_backend_name, so two volume types that differ only in which

        backend they live on are considered eligible. That is exactly the shape

        of a retype that moves a volume from one replication pair to another.


        Keep replicated volumes on the generic migration path instead. Generic

        migration cannot get this wrong: it creates a new volume of the target

        type on the destination backend, which establishes replication there,

        and removes the source only once the copy has completed.


        This changes no behaviour on its own, because a volume with replication

        enabled is rejected before it can reach migrate_volume() at all. It is

        a prerequisite for letting those volumes through.


        Assisted-By: Claude Opus 5 (Claude Code)

        Change-Id: I7f097c2ab28537499e9357427e5007196b5b22fd

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
