      change: '1005206'
      change_message: "Stop disabled members consuming cluster RPC\n\nClustered volume
        services share a cluster RPC queue, so removing a\ndisabled member from scheduler
        state does not stop that member from\nconsuming requests. Stop the local cluster
        RPC server while the service\nis disabled and restart it when the service
        is enabled again. Healthy\ncluster members remain available for scheduling.\n\nWhile
        doing this, restore persistence of the disabled flag in the\nservice enable
        and disable API actions: since the v3 API refactor\n(74b312d55) they returned
        success but silently changed nothing in the\nservices table, so a disabled
        service kept running at full capacity\nand could not be re-enabled without
        providing a disabled reason.\nenable() also clears the stale disabled_reason
        again, as it did before\nthat refactor.\n\nHardening from code review:\n-
        keep stopped cluster RPC servers in a list so that Service.wait()\n  joins
        them at shutdown; a server stopped by a disable/re-enable\n  cycle is no longer
        dropped on the floor\n- a failed cluster RPC server start is retried on the
        next heartbeat\n  instead of caching a half-started server\n- a missing service
        DB entry at startup no longer crashes the service:\n  the cluster RPC server
        is simply not started and report_state\n  recovers later\n- transient RPC
        errors while toggling the cluster server during a\n  heartbeat no longer make
        the service appear \"down\"\n- pass the already-built serializer to the cluster
        RPC server instead\n  of rebuilding one\n\nAI-modified files:\n- cinder/api/v3/services.py\n-
        cinder/service.py\n- cinder/tests/unit/api/v3/test_services.py\n- cinder/tests/unit/scheduler/test_host_manager.py\n-
        cinder/tests/unit/test_service.py\n- releasenotes/notes/remove-disabled-from-state-map-626bc7ae5eac59b9.yaml\n\nCloses-Bug:
        #2158889\nGenerated-By: OpenCode / euria-code\nChange-Id: I97bdfc8d87b9e0c1518b9b15719097df26652361\nSigned-off-by:
        Rajat Dhasmana <rajatdhasmana@gmail.com>\n"
