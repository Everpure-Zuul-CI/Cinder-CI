      buildset: f8d414b584b34265a793f670024df8f8
      change: '1006834'
      change_message: "Add deployment-wide quota option and exception\n\nCinder quota
        is enforced strictly per-project and the sum of the\nper-project limits is
        not itself bounded, so an operator cannot cap the\ntotal capacity a deployment
        may provision.  The blueprint\ndeployment-aggregate-quota adds a single ceiling
        on provisioned\ngigabytes across all projects, maintained as a counter in
        a sentinel\nquota_usages row and claimed with an atomic conditional UPDATE.\n\nThis
        is the first change in that series and is a pure addition with no\nbehaviour
        change:\n\n- deployment_max_gigabytes, an IntOpt in the existing quota_opts
        list,\n  defaulting to -1 (unlimited).  The counter will be maintained\n  regardless
        of its value; the option only controls enforcement.\n\n- DEPLOYMENT_QUOTA_PROJECT_ID,
        the reserved quota_usages project_id\n  '<deployment>' under which the counter
        is kept.  Keystone never\n  issues a project id containing angle brackets,
        so it cannot collide\n  with a real project, and once stored it must never
        change.\n\n- DeploymentQuotaExceeded, subclassing QuotaError so that it carries\n
        \ the 413 status, the Retry-After header and safe=True.  It is\n  deliberately
        not an OverQuota: the existing 'except OverQuota'\n  handlers are bypassed
        and the rejection surfaces at the API without\n  changing any of them.  Its
        message names the ceiling but carries no\n  figures, because quoting the deployment-wide
        usage would disclose\n  the cloud's total provisioned capacity to every tenant.\n\nImplements:
        blueprint deployment-aggregate-quota\nAssisted-By: Claude Code claude-fable-5-1\nChange-Id:
        I806ad801468da9ec8f326d51925df39c58b0d779\nSigned-off-by: Simon Dodsley <simon@purestorage.com>\n"
