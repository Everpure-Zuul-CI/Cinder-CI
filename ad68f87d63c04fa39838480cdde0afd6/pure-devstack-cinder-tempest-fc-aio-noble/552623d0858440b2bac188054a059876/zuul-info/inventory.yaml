      change: '988336'
      change_message: "feat: Add per-pool disable/draining mechanism\n\nImplements
        a new per-pool administrative state that allows operators\nto mark individual
        storage pools as disabled/draining. When a pool is\nmarked disabled, a scheduler
        filter blocks all provisioning operations\n(creates, extends, snapshots, retypes,
        migrates, manage_existing,\ngroup-create) from landing on that pool.\n\nNew
        components:\n- pool_disabled_states database table with UNIQUE(pool_name,
        deleted)\n- PoolDisabledFilter scheduler filter using backend_id for canonical\n
        \ pool name resolution (supports Active/Active HA via service_topic_queue)\n-
        GET /scheduler-stats/get_pools enriched with disabled/disabled_reason\n- PUT
        /pool-states/disable and PUT /pool-states/enable endpoints\n- GET /pool-states
        endpoint to list all disabled pools\n- API pre-checks returning HTTP 409 for
        extend/snapshot on disabled pools\n- Dedicated policy module cinder/policies/pool_states.py
        with three rules\n- Microversion 3.72\n\nAPIImpact\n\nChange-Id: Ic2b71abca04edce0215cd102b9f4a625b1ede85e\nSigned-off-by:
        Walter Boring <waboring@hemna.com>\n"
