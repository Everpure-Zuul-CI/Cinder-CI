      change: '1014446'
      change_message: 'Add scheduler tuning options for the backend


        Expose the generic Cinder backend options reserved_percentage,

        extra_capabilities, filter_function and goodness_function as charm

        config so operators can reserve capacity, advertise custom

        capabilities and drive the DriverFilter and GoodnessWeigher without

        hand-editing cinder.conf. Values that would stop cinder-volume from

        starting (an out-of-range percentage, extra-capabilities that is not a

        JSON object, or a multi-line function) are withheld from the backend

        config and the unit goes blocked instead.


        Assisted-By: Claude Code claude-fable-5-1

        Change-Id: I78daf73371011d6ec6951cb4a38523940a4c6869

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

