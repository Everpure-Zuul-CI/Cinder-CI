      change: '1010818'
      change_message: "NetApp REST: honor certificate host validation\n\nRestNaServer._create_certificate_auth_handler()
        copied\nrequests.Session.verify onto netapp_certificate_host_validation.\nA
        new session defaults that value to True, so an explicit False\nwas overwritten
        and a configured CA file was still used. TLS\nconnections then failed even
        though host validation was disabled.\n\nKeep the configured flag and select
        verify the same way the ZAPI\nclient does. Use False when netapp_ssl_cert_verify
        is false, the\nCA path when host validation and netapp_ca_certificate_file
        are\nboth set, and the host-validation boolean otherwise.\nnetapp_ssl_cert_path
        stays limited to basic authentication.\n\nTest Plan:\nPASS - NetApp API client
        unit tests, including the certificate\n       verify decision table (144 tests).\nPASS
        - flake8 on the changed modules.\nPASS - Live REST probes against ONTAP. With
        host validation\n       disabled, session.verify stays False and the flag
        is not\n       overwritten. Host validation selects the CA file or the\n       default
        trust store. netapp_ssl_cert_verify=False forces\n       verify=False. Untrusted
        lab client certificates then fail\n       with TLSV1_ALERT_UNKNOWN_CA rather
        than\n       CERTIFICATE_VERIFY_FAILED.\n\nCloses-Bug: #2171037\nAssisted-By:
        Cursor Grok-4.7\nChange-Id: I0d034ddd43872e99d3f41fcb8640d288f1d2a68f\nSigned-off-by:
