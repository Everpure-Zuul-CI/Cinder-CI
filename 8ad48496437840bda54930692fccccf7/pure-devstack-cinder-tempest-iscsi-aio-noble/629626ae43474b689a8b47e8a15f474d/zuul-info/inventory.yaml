      branch: master
      build: 629626ae43474b689a8b47e8a15f474d
      buildset: 8ad48496437840bda54930692fccccf7
      change: '1003583'
      change_message: 'Allow migration of replicated volumes


        A volume with replication enabled could not be migrated between

        backends, nor retyped to a volume type living on a different backend,

        because both the API and the volume manager rejected any

        replication_status other than disabled or not-capable.


        That rejection is broader than it needs to be. Migration never moves a

        replication relationship. Generic migration creates a new volume of the

        target type on the destination backend, which establishes replication

        there, copies the data across, and removes the source only once the copy

        has completed. The source keeps replicating untouched until then, so

        nothing is at risk if the copy fails.


        What must stay blocked are the states in which the volume we would copy

        from is not the volume we believe it is: replication being reconfigured

        underneath us (enabling, disabling, failing-over), an unknown state

        (error, failover-error), or a volume currently served by a secondary and

        so not a replication source at all (failed-over). Those were previously

        covered incidentally by the blanket rejection of everything replicated,

        and are now an explicit check that names the offending status.


        Collect the migratable statuses in one place so that the API and manager

        guards cannot drift apart.


        Note that because the relationship on the destination is built from

        scratch, anything held only on the source relationship is not carried

        over. Most importantly that means any secondary side snapshot or

        retention history, and for asynchronous replication the RPO clock starts

        again. The migrated volume is also a different volume on the target

        storage, so its identifiers change and failover is driven by the

        destination backend from that point on.


        Assisted-By: Claude Opus 5 (Claude Code)

        Change-Id: Id5801178970021d97f36f5f9c7285566e2166e97

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
