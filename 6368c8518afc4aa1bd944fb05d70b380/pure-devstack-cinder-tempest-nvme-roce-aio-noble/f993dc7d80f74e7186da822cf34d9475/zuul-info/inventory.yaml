      buildset: 6368c8518afc4aa1bd944fb05d70b380
      change: '1002127'
      change_message: "NetApp ONTAP: fix ZAPI destroy_file_copy file-index type\n\nThe
        ZAPI destroy_file_copy() method sent 'file-index' as an integer\n(0) in the
        file-copy-destroy request. ONTAP requires this field to be\na string and rejects
        the integer with:\n\n    NaApiError: 13115:Invalid integer value for file-index:
        (null)\n\nAs a result, destroy_file_copy() always raised NaApiError -- the\ncancel/destroy
        of an in-progress file copy never actually succeeded\non the controller. Callers
        (e.g. NFS driver's _cancel_file_copy)\ncaught the resulting exception and
        fell back to manually deleting the\npartially-copied destination file, which
        masked the defect in normal\noperation: cleanup still happened, so this went
        unnoticed until ZAPI/\nREST parity testing surfaced it.\n\nFix: send 'file-index'
        as a string ('0') instead of an integer.\n\nCloses-Bug: #2164909\nChange-Id:
        I289578fee132b916f63e52fb7cc5aecc368d9fb4\nSigned-off-by: Saikumar Pulluri
        <saikumar1016@gmail.com>\n"
