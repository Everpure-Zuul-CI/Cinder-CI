      build: 186499d981084c668fb1ab3f29389c37
      buildset: 43bbb0fde9354173a8430bbfb3022566
      change: '1007257'
      change_message: 'Everpure: storage-assisted migration via volume send


        Implement migrate_volume() in the FlashArray driver. When the

        destination backend reports a pure_array_id matching one of the

        backend''s assisted replication_device peers, the volume is copied

        array-to-array with the Purity "volume send" operation instead of

        through the cinder-volume host: the source array sends a snapshot of

        the volume, the driver polls the peer until the replica snapshot has

        arrived, copies it into a volume of the same Purity name there,

        applies the type''s QoS and tags, removes the replica and send

        snapshots, and deletes the source volume. Every other case returns

        (False, None) so that generic migration runs: a non-FlashArray or

        unknown destination, a volume in a group, volume group or pod, a

        replicated type, an end-to-end encrypted volume, no connected array

        connection, and any failure during the transfer, after which the

        objects the attempt created on the peer are destroyed and eradicated.

        A same-named volume on the peer is only removed when Purity records

        one of our replica snapshots as its source; anything else is left

        alone.


        Behaviour verified against Purity 6.9.2, 6.10.6 and 6.10.7: the send is

        accepted over a sync-replication connection as well as an async one;

        the peer names the replica with the requested suffix while the source

        reports its own snapshot name, so the driver finds the replica on the

        peer by prefix rather than predicting it; the source-side send snapshot

        is removed by Purity once the transfer completes; and the

        remote-volume-snapshot endpoints reject "on" for FlashArray targets, so

        all peer-side work goes through the peer''s own client. Only the peer

        exposes transfer progress.


        The retype path with migration-policy on-demand reaches this code

        whenever the two types differ only in volume_backend_name, which is

        how such a move is normally expressed, so no volume manager change is

        needed. No update_migrated_volume() is needed either: the driver names

        volumes from provider_id, which the manager swaps between the records

        when a generic migration completes.


        The support matrix previously had a single storage assisted migration

        row whose entries all describe pool or tier moves within one array.

        That row is now labelled intra-array, and a new inter-array row is

        added on which this driver is the first entry.


        Implements: blueprint flasharray-assisted-migration


        Assisted-By: Claude Code claude-fable-5-1

        Change-Id: I6258b231ecf498cb2e31a4c8dc9676c6569f3f5a

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
