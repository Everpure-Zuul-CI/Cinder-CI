      change: '1009519'
      change_message: 'Everpure: asynchronous replication for pod pools


        Allow async replicated volume types in pod pools. A protection group

        only accepts members from its own pod, so when replication is

        configured the driver creates one replication protection group per pool

        pod, pod::<pure_replication_pg_name>, with the same targets, schedule

        and retention as the array-level group, and an async volume in a pod

        pool joins its pod''s group. Pod pools report replication_type [''async'']

        and consistent_group_replication_enabled; sync and trisync types stay

        refused, because an unstretched pod cannot be moved into the stretched

        replication pod.


        Failover promotes volumes from the latest replicated snapshot of the

        array-level group and of every pod group, matching members by their

        bare name (protection group snapshot members carry no pod). A pod-pool

        volume keeps its pod-qualified name, so its pod must exist on the

        target: setup requires every pool pod on every async target, and the

        driver never creates one there, since a pod created at failover would

        inherit the target''s default protection and could never be eradicated.

        A volume whose pod has since gone from the target is left in error.


        Implements: blueprint flasharray-pod-pools


        Assisted-By: Claude Code claude-fable-5-1

        Change-Id: Ibf762486ea06a1b02fa5d0360bc921173e19cf47

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
