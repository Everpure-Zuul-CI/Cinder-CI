      build: 09b66bc34cde4a1aaf64786ee1913ffc
      buildset: 5ea614863701410e92c10813baaae4a6
      change: '964289'
      change_message: "LINSTOR: Rewrite driver as v2.0.0\n\nReplace the LINSTOR driver
        with a rewrite that uses the API bindings of\nthe python-linstor project.
        The previous driver made a number of design\ndecisions that turned out to
        be mistakes:\n\n- It configured LINSTOR storage pools automatically. This
        barely worked\n  in test setups and is best left to the administrator, using
        the\n  \"linstor\" CLI.\n- It had an option to shrink volumes by a fixed amount.
        This does not\n  make sense: a request for a 10 GiB volume should create a
        10 GiB\n  volume.\n- It manually deployed replicas of a volume on every node.
        LINSTOR\n  handles this directly, without additional code in the driver.\n-
        It had custom handling of block_size and other target related\n  settings.
        These are best left to the regular target helpers.\n- The administrator had
        to ensure that the cinder-volume host has access\n  to the volume. The driver
        now manages this dynamically.\n\nExisting volumes keep working after the update.
        Besides reimplementing\nthe existing features where it makes sense, the new
        driver adds:\n\n- Multiple LINSTOR controller URIs, for HA setups with several\n
        \ controllers or load balancers.\n- Mapping of Cinder volume types to LINSTOR
        resource groups, letting\n  users set replica counts, DRBD options and more
        per volume type.\n- Live migration of instances using directly attached DRBD
        volumes.\n- Multi-attach for iSCSI exported volumes.\n- Reverting volumes
        to snapshots.\n- Assisted retype and migration between LINSTOR backends.\n-
        An option to read the LINSTOR node name of the cinder-volume host\n  from
        a file. In containerized deployments the host name seen by the\n  service
        often does not match the LINSTOR node name.\n\nThe unit tests are updated
        to work with the python-linstor library.\n\nThe documentation describes the
        new features, including TLS support,\nand contains upgrade notes for administrators.
        A release note covers\nthe rewrite and the fix for the broken iSCSI export
        path.\n\nDepends-On: https://review.opendev.org/c/openstack/cinder/+/1005585\nDepends-On:
        https://review.opendev.org/c/openstack/cinder/+/1005664\nChange-Id: Ic6afb506ba4727746925368dc714d829967be3a7\nSigned-off-by:
        Moritz Tanner <moritz.tanner@linbit.com>\n"
      change_url: https://review.opendev.org/c/openstack/cinder/+/964289
