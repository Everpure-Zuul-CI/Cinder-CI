      build: ef15d3f96e5a4f41a336313e658821f0
      buildset: 4adf4a62ec064cb59cfe3f498126408f
      change: '997422'
      change_message: 'NetApp ONTAP: Add REST metrics-based pool utilization


        Add a netapp_use_metrics_based_utilization config option (default

        True). When enabled and supported (REST client, ONTAP 9.13+), the

        driver reads processor_utilization from the ONTAP REST node metrics

        endpoint instead of the counter-based calculation. A stale value is

        reused for up to 10 minutes before falling back to the default

        utilization. Unsupported backends (ZAPI client, ONTAP < 9.13) keep

        using the counter-based calculation.


        The ASA r2 disaggregated platform has no counter-based path, so

        NODE_METRICS is always enabled there and the performance cache is

        always refreshed, regardless of this option.


        Also fix FlexGroup pools reporting netapp_aggregate_used_percent from

        only their first aggregate: the capabilities library now keeps the

        full aggregate list for FlexGroup volumes, and both utilization paths

        average across all of them.


        Change-Id: I3ee5c28a3b1be36cb9531b4ef86efcd5c75e89a2

        Signed-off-by: jayaanan <jayaanand.borra@netapp.com>

        '
