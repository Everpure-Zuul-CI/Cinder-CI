      change: '1011532'
      change_message: 'Infinidat: preserve compatibility with older InfiniSDK


        Commit 4202c9c made InfiniSDK 250.0.0 mandatory when adding snapshot

        promotion. This prevents existing deployments with older SDKs, including

        220.0.0 bundled with host-power-tools, from starting even though the

        previous data-copy implementation remains available.


        Treat 250.0.0 as the minimum for snapshot promotion only. During setup,

        combine the SDK version check with the storage promotion capability and

        cache the result. Use generic data copy for both clone paths when either

        requirement is unmet, and warn whether the SDK or storage lacks support.

        Do not call the newer capability method on older SDKs.


        Restore the previous dependency minimum of 103.0.1 and update the driver

        documentation and release note. Cover SDK/storage combinations, warnings,

        and fallback behavior in unit tests while preserving promotion coverage.


        Closes-bug: #2171540

        Assisted-By: Copilot GPT6.1 Sol

        Signed-off-by: Erlon R. Cruz <erlon@canonical.com>

        Change-Id: I727f0d38c3641e5aace38e8084060467a4738cbf

        '
