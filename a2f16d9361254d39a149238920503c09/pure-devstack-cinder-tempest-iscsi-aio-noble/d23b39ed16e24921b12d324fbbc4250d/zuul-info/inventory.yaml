      change: '988747'
      change_message: 'Add jobs to run unit and func test (no-eventlet)


        This adds unit and functional jobs for eventlet removal

        testing as part of the openstack-wide goal to remove eventlet.


        added jobs set OS_CINDER_DISABLE_EVENTLET_PATCHING=true to disable

        eventlet and use oslo.service threading instead.

        Both jobs are non-voting to discover threading compatibility issues

        without blocking new patches.


        Also skip unit tests that verify eventlet-specific behavior (tpool,

        greenpool, eventlet.Semaphore) when running in threading mode as these

        tests verify eventlet impl details not used with native threads.


        Change-Id: I0cd1da31a132bb709c8e8c1b42f20cebfcd1c889

        Signed-off-by: Amit Uniyal <auniyal@redhat.com>

