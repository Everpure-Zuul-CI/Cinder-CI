      change: '1014558'
      change_message: 'Cleanup master CI


        Bring the build and test tooling in line with the other reactive

        charms: build with charm 3.x/stable without the Rust toolchain, pin

        dnspython below 2.9 so the wheelhouse no longer pulls in rustup, move

        to pip-compiled py3.12 requirements with setuptools pinned so stestr

        finds pkg_resources, use zaza''s juju36 constraints and point the test

        bundle at the charmcraft 3 artifact name. Without this both charmbuild

        and openstack-tox-py312 fail on master.


        Assisted-By: Claude Code claude-fable-5-1

        Change-Id: Ib75b822de11dfac2f4a362187dc5f12a65255232

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
