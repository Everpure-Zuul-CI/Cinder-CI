      change: '1001534'
      change_message: 'KIOXIA: stop global urllib3 warning suppression


        disable_warnings() at import scope silenced every urllib3 warning in the

        cinder-volume process, including other backends'' TLS warnings, and it

        overrode suppress_requests_ssl_warnings. Drop the call. The import stays,

        PoolManager and Timeout still use it.


        KumoScale''s own requests are unverified (cert_reqs=CERT_NONE), so

        InsecureRequestWarning now shows where it was previously hidden. Set

        suppress_requests_ssl_warnings if you need it quiet.


        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        Change-Id: I43623ced664e8b887a2944fdebcc3d235c3590f4

