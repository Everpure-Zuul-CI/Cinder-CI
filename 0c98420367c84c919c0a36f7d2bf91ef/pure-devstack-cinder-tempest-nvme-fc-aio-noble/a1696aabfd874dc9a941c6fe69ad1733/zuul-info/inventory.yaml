      branch: stable/2026.2
      build: a1696aabfd874dc9a941c6fe69ad1733
      buildset: 0c98420367c84c919c0a36f7d2bf91ef
      change: '1015285'
      change_message: 'Scope attachments by their own volume''s project


        Change Ib2044e4143b9 turned on project_only for attachment reads, but

        the filter model_query adds for VolumeAttachment compares

        Volume.project_id with no link to the attachment. The result is a cross

        join that only asks whether the caller''s project owns any volume, so a

        non-admin whose project has a volume can show another project''s

        attachment, including its connection info, given the attachment''s UUID.


        Filter on the attachment''s own volume instead. Update and delete were

        already refused by policy for these callers, and now return 404 rather

        than 403, the same as a caller whose project has no volume.


        test_migrate_attachment_specs mocked models.Volume, which made the old

        filter always true. It now creates a real volume.


        Closes-Bug: #2173158

        Related-Bug: #2138566

        Signed-off-by: Noppakorn Kaewsalabnil <noppakorn@nipa.cloud>

        Change-Id: I91c4a033e2b3b16d999faaf0dce96448531a2d03

        (cherry picked from commit 6c3354e665e7a34927954ba2d2135c5731a82f7d)

        '
