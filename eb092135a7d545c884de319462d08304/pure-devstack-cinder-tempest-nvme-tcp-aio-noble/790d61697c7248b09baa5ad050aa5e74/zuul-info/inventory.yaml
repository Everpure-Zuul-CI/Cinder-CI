      change: '993363'
      change_message: "NetApp ONTAP: begin closing ZAPI-to-REST gaps\n\nSeveral primitives
        implemented on the ZAPI client are missing on the\nREST client and silently
        fall through to ZAPI via __getattr__, breaking\nparity when operators run
        with netapp_use_legacy_client=False. This is\nthe first batch of native REST
        implementations.\n\nThis patch adds:\n\n* destroy_file_copy -- cancels an
        in-progress file copy via\n  PATCH /api/cluster/jobs/{uuid} and removes the
        partially-copied\n  destination file.\n\n* set_lun_qos_policy_group -- assigns
        a QoS policy group to a LUN via\n  PATCH /api/storage/luns/{uuid} with ``qos_policy.name``.
        Unlike the\n  ZAPI client, the REST client uses a single field for both adaptive\n
        \ and non-adaptive policies.\n\n* get_snapshot -- looks up a single snapshot
        via\n  GET /api/storage/volumes/{volume.uuid}/snapshots filtered by name and\n
        \ returns a ZAPI-compatible dict (name, volume, busy, owners). A\n  wait_for_busy_snapshot
        helper polls it until the snapshot is no longer\n  busy.\n\n* rename_snapshot
        / mark_snapshot_for_deletion -- renames a backing\n  snapshot to the ``deleted_cinder_<name>``
        GC prefix by resolving the\n  snapshot uuid via GET and issuing a PATCH; preserves
        snapshot\n  identity.\n\n* get_snapshots_marked_for_deletion -- lists ``deleted_cinder_*``\n
        \ snapshots across the SVMs FlexVols for the periodic reaper. REST has\n  no
        server-side busy filter, so busy snapshots are skipped client-side\n  via
        the snapshots owners[] array.\n\n* get_file_usage -- retrieves the unique-bytes
        count of a file via\n  GET /api/private/cli/volume/file/show-disk-usage. Used
        by the NFS\n  image-cache cleanup path. No public REST equivalent exists for
        the\n  ZAPI file-usage-get unique-bytes attribute; the private CLI endpoint\n
        \ is a short-term workaround.\n\n* get_clone_split_info -- fetches unsplit
        clone status via\n  GET /api/storage/file/clone/split-status. Maps REST fields\n
        \ unsplit_size and pending_splits to ZAPI-compatible output keys.\n\n* get_flexvol_dedupe_used_percent
        -- combines get_flexvol_dedupe_info\n  and get_clone_split_info using the
        same formula as the ZAPI baseline:\n  100 * (logical_data_size + unsplit_size)
        / logical_data_limit.\n  Guarded by the CLONE_SPLIT_STATUS feature flag (ONTAP
        8.3+).\n\n* create_cg_snapshot -- implements crash-consistent group snapshots\n
        \ natively in the REST client. Creates an ephemeral ONTAP consistency\n  group,
        posts a CG snapshot, then deletes the CG. The per-FlexVol\n  snapshot persists
        for cloning and is deleted after all clones\n  complete, mirroring the ZAPI
        cg-start/cg-commit behaviour.\n  _start_cg_snapshot and _commit_cg_snapshot
        are blocked on the REST\n  client via __getattr__ to prevent silent fallback.\n\nget_cluster_peers
        ZAPI implementation removed; it was dead code.\n\nIt also fixes the NFS file-copy
        cancel cleanup path: the ZAPI\ndestroy_file_copy sent ``file-index`` as an
        integer, which ONTAP\nrejects, so the cancel always raised; _cancel_file_copy
        now passes it\nas a string and always removes the partially-copied destination
        file,\ntreating an already-absent file as success.\n\nChange-Id: Ib07d2cd496cdac490313b69e55b03093b012af9d\nSigned-off-by:
        Saikumar Pulluri <saikumar1016@gmail.com>\nRelated: https://etherpad.opendev.org/p/cinder-netapp-zapi-to-rest-gaps\n"
