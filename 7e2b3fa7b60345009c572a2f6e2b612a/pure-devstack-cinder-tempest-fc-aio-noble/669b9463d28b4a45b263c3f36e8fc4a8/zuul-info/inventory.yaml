      build: 669b9463d28b4a45b263c3f36e8fc4a8
      buildset: 7e2b3fa7b60345009c572a2f6e2b612a
      change: '1006190'
      change_message: 'Add QSAN iSCSI and NVMe-TCP Cinder volume drivers


        QSAN Technology is an enterprise storage vendor. This change adds

        Cinder volume drivers for QSAN arrays running XEVO2, XEVO3, or QSM4.


        QsanISCSIDriver provides iSCSI connectivity using SSH on XEVO2 and

        REST APIs on XEVO3 and QSM4. QsanNVMeDriver provides NVMe/TCP

        connectivity using REST APIs on XEVO3 and QSM4.


        The volume drivers support volume creation, deletion, extension,

        snapshots, cloning, creation from snapshots, connection initialization

        and termination, manage and unmanage, and per-pool capacity reporting.


        The NVMe/TCP driver supports offline extension. Multiattach and

        replication are not supported.


        Configure a backend through enabled_backends with volume_driver,

        volume_backend_name, management_ip, login_account, login_password,

        qsan_pool_name, and qsan_os. REST backends also require qsan_api_url

        and appropriate TLS settings.


        NVMe/TCP requires an existing Block/NVMeTCP host group with target

        interfaces and access for the connecting hosts'' NQNs. The driver

        does not create host groups or modify host NQN access lists.


        Set qsan_nvme_host_group to select a specific group. When unset,

        the driver selects a group only if exactly one matching group

        exists. Missing or ambiguous groups cause setup to fail.


        NVMe capability and network queries prefer Cinder-specific REST

        routes and fall back to existing REST v2 routes on HTTP 404.


        QsanBackupDriver provides independently configured backup storage

        for iSCSI and NVMe/TCP backup and restore through backup_* options.

        NVMe/TCP backup uses backup_protocol=nvme and requires

        backup_nvme_host_group.


        Unit tests cover the drivers and REST interactions, including NVMe

        host group selection and REST route fallback behavior.


        QSAN product manuals and documentation:

        https://www.qsan.com/en/download_center


        Blueprint: qsan-cinder-driver

        Signed-off-by: Miles Lee <miles.lee@qsan.com>

        Change-Id: I6ed90747f00f9c287ebab32dc273a88af36a0638

        '
