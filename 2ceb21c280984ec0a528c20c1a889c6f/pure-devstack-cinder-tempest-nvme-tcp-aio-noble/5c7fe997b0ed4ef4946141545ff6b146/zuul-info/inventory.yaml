      change: '993979'
      change_message: 'Dell PowerFlex: Add direct-child count for image cache vTree
        size


        Add support for checking the image cache vTree size by counting only

        the direct child volumes of the cache volume.


        Previously, the driver used query_vtree_statistics, which counted all

        descendants in the vTree, including snapshots, grandchildren, and deeper

        nested volumes. This could cause clone creation to be blocked before

        the cache volume reached the configured direct-child limit.


        Use query_vtree_volumes with the ancestorVolumeId filter to count only

        immediate child volumes of the cache volume.


        The powerflex_max_image_cache_vtree_size configuration option name and

        behavior are preserved.


        Implements: blueprint bp-dell-powerflex-improved-vtree

        Change-Id: I77291902e477ed14180dbe4692edde6717bbb791

        Signed-off-by: Nilesh Thathagar <nilesh.thathagar@dell.com>

        Signed-off-by: Siddharth Kumar <siddharth.kumar1@dell.com>

        '
